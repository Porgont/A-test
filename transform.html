<script>
/* ==== ENGINE START ==== */
const LinAlg = (function(){
  "use strict";
  var ZERO = null, ONE = null, TWO = null;

  /* ==================== 符号值层（把 Calc 包装成一个「数」） ==================== */
  /* 一个值只有两种形态：
       - Frac（精确有理数，和以前完全一样）
       - Sym （符号表达式，内部是内置符号引擎 Calc 的 AST）
     矩阵里每个格子都可以是其中一种；下面的 vAdd/vMul/... 负责两种形态的混合运算。 */

  var SYM_FUNCS = ["sin", "cos", "tan", "cot", "sec", "csc", "asin", "acos", "atan",
    "sinh", "cosh", "tanh", "ln", "log", "exp", "sqrt", "abs"];
  var SYM_MSG_RREF = "行化简需要判断主元是否为零，暂不支持；符号行列式和四则运算是支持的。";
  var SYM_MSG_INV = "符号矩阵不能做精确除法，所以无法求逆；符号行列式和四则运算是支持的。";
  var SYM_MSG_NUM = "这个运算要求矩阵里全是数字；符号矩阵只支持加减、乘法、数乘、转置、迹和行列式。";
  var SYM_MSG_DET = "符号矩阵的行列式不能做精确除法，暂不支持；符号行列式和四则运算是支持的。";

  function symOf(expr){ return new Sym(expr, Calc.str(expr)); }
  /* 符号节点的子节点只能是 AST 节点或 Sym；Frac / 数字要先变成 {t:"num"} 节点。 */
  function sExpr(x){
    if (isSym(x)) return x.expr;
    if (x instanceof Frac) return Calc.num(x.n, x.d);
    if (typeof x === "number") return Calc.num(x);
    if (typeof x === "bigint") return Calc.num(x);
    return val(x).expr;
  }
  function Sym(expr, text){ this.expr = expr; this.text = text; }
  Sym.prototype.isZero = function(){ return this.expr.t === "num" && this.expr.v.isZero; };
  Sym.prototype.isOne = function(){ return this.expr.t === "num" && this.expr.v.isOne; };
  Sym.prototype.sign = function(){
    if (this.expr.t !== "num") throw new Error("符号表达式「" + this.text + "」没有确定的正负号，" + SYM_MSG_RREF);
    return this.expr.v.sign;
  };
  Sym.prototype.neg = function(){ return symOf(Calc.simplify({ t: "neg", a: this.expr })); };
  Sym.prototype.add = function(o){ return symOf(Calc.simplify({ t: "add", a: this.expr, b: sExpr(o) })); };
  Sym.prototype.sub = function(o){ return symOf(Calc.simplify({ t: "add", a: this.expr, b: { t: "neg", a: sExpr(o) } })); };
  Sym.prototype.mul = function(o){ return symOf(Calc.simplify({ t: "mul", a: this.expr, b: sExpr(o) })); };
  /* 符号除法：不真正做除法，化成乘以 -1 次幂（Calc 会把分母打印成 1/x 这类写法）。 */
  Sym.prototype.div = function(o){
    if (o.isZero()) throw new Error("不能除以 0");
    return symOf(Calc.simplify({ t: "mul", a: this.expr, b: { t: "pow", a: sExpr(o), b: Calc.num(-1) } }));
  };
  Sym.prototype.toString = function(){ return this.text; };
  Sym.prototype.toNumber = function(){ throw new Error("符号表达式「" + this.text + "」没有数值，" + SYM_MSG_NUM); };
  Sym.prototype.isSym = true;   /* 标记位：注意别把 isSym() 这个函数名盖掉 */

  function isSym(v){ return !!(v && v.isSym === true); }
  function symVars(n, out){
    out = out || [];
    if (!n || typeof n !== "object") return out;
    if (n.t === "var"){ if (out.indexOf(n.name) < 0) out.push(n.name); return out; }
    if (n.t === "neg") { symVars(n.a, out); return out; }
    if (n.t === "add" || n.t === "mul" || n.t === "pow"){ symVars(n.a, out); symVars(n.b, out); return out; }
    if (n.t === "fn" && n.arg) symVars(n.arg, out);
    return out;
  }
  function symName(v, dflt){
    var vs = symVars(v.expr === undefined ? v : v.expr);
    if (!vs.length) return dflt || "变量";
    if (vs.length === 1) return vs[0];
    return vs.slice(0, 3).join("、") + " 等 " + vs.length + " 个符号";
  }
  /* 还没变成「值」的原始输入（字符串、数字）→ true；已经是 Frac 或 Sym → false。 */
  function needsVal(n){ return !(n instanceof Frac) && !isSym(n); }
  /* 整个矩阵都是数字（没有符号）→ true；只要有一个符号就 → false。 */
  function allNums(M){
    for (var i = 0; i < M.length; i++){
      for (var j = 0; j < M[i].length; j++){ if (isSym(M[i][j])) return false; }
    }
    return true;
  }
  function symGuard(M, tail){
    for (var i = 0; i < M.length; i++){
      for (var j = 0; j < M[i].length; j++){
        if (isSym(M[i][j])) return "矩阵里有符号 " + symName(M[i][j]) + "，" + tail;
      }
    }
    return null;
  }
  function guardRowMap(M){ var m = symGuard(M, SYM_MSG_RREF); if (m) throw new Error(m); return M; }
  function guardNoDiv(M){ var m = symGuard(M, SYM_MSG_INV); if (m) throw new Error(m); return M; }
  function guardNumOnly(M){ var m = symGuard(M, SYM_MSG_NUM); if (m) throw new Error(m); return M; }
  function guardDet(M){ var m = symGuard(M, SYM_MSG_DET); if (m) throw new Error(m); return M; }

  function symOK(n){
    if (!n || typeof n !== "object") return false;
    if (n.t === "num" || n.t === "var") return true;
    if (n.t === "neg") return symOK(n.a);
    if (n.t === "add" || n.t === "mul" || n.t === "pow") return symOK(n.a) && symOK(n.b);
    return false;
  }

  /* ---------- 值构造：数字尽量保持 Frac，带字母的才变成 Sym ---------- */

  /* 把用户输入的空格、各种减号、幂号、百分号之外的写法规范化。
     注意：只补上「数字后面直接跟字母」的乘号（2a → 2*a），
     并保留 Calc 本来就支持的隐式乘法（a(b+1)、ab）。 */
  function prepSym(s){
    var t = String(s).replace(/\s+/g, "").replace(/−/g, "-").replace(/—/g, "-")
      .replace(/／/g, "/").replace(/×/g, "*").replace(/÷/g, "/").replace(/\*\*/g, "^");
    t = t.replace(/([0-9])([A-Za-z(])/g, "$1*$2");
    t = t.replace(/\)([0-9A-Za-z(])/g, ")*$1");
    return t;
  }
  /* 解析成数值；不是纯数字就返回 null。 */
  function numTry(s){
    if (s instanceof Frac) return s;
    if (typeof s === "bigint" || typeof s === "number") return F(s);
    if (typeof s !== "string") return null;
    try { return F(s); } catch (e){ return null; }
  }
  function buildSym(s){
    var t = prepSym(s);
    var node;
    try { node = Calc.simplify(Calc.parse(t)); }
    catch (e){ throw new Error("无法解析「" + String(s).trim() + "」：" + e.message); }
    var bad = null;
    (function scan(n){
      if (bad || !n || typeof n !== "object") return;
      if (n.t === "fn"){
        if (n.name === "pi" || n.name === "e") bad = "常量 " + n.name + " 不是精确数";
        else bad = "函数 " + n.name + "()";
        return;
      }
      if (n.t === "neg") { scan(n.a); return; }
      if (n.t === "add" || n.t === "mul" || n.t === "pow"){ scan(n.a); scan(n.b); }
    })(node);
    if (bad) throw new Error("矩阵格子里不能用" + bad + "；只支持数字、字母（a–z、A–Z，可多字母）、+ - * / ^ 和括号。");
    if (Calc.str(node).length > 160) throw new Error("这个符号表达式太长了，暂时算不动");
    return new Sym(node, Calc.str(node));
  }
  /* 用户输入的一个格子 → 值（支持 -3/4、1.25、a、2a、a+1、a*b、a^2、-k/2） */
  function val(x){
    if (x instanceof Frac || isSym(x)) return x;
    if (typeof x === "bigint") return F(x);
    if (typeof x === "number") return F(x);
    var n = numTry(x);
    if (n !== null) return n;
    return buildSym(x);
  }
  function valMat(M){
    shape(M);
    return M.map(function(r){ return r.map(function(v){ return val(v); }); });
  }

  /* ---------- 两种形态之间的四则运算 ---------- */

  /* 两种形态之间的四则运算：只要有一边是符号，两边都先升成符号值。 */
  function vAdd(x, y){ return (isSym(x) || isSym(y)) ? symOf(Calc.simplify({ t: "add", a: sExpr(x), b: sExpr(y) })) : x.add(y); }
  function vSub(x, y){ return (isSym(x) || isSym(y)) ? symOf(Calc.simplify({ t: "add", a: sExpr(x), b: { t: "neg", a: sExpr(y) } })) : x.sub(y); }
  function vMul(x, y){ return (isSym(x) || isSym(y)) ? symOf(Calc.simplify({ t: "mul", a: sExpr(x), b: sExpr(y) })) : x.mul(y); }
  function vNeg(x){ return isSym(x) ? x.neg() : x.neg(); }
  function cellNeg(x){ if (x === undefined || x === null || x === ZERO) return ZERO; return vNeg(x); }
  function vIsZero(x){ return isSym(x) ? x.isZero() : x.isZero(); }
  function vDetZero(x){ return (x === undefined || x === null) ? true : vIsZero(x); }
  function vStr(x){ return isSym(x) ? x.toString() : x.toString(); }
  function isNumVal(x){ return x instanceof Frac ? x : (x.expr.t === "num" ? x.expr.v : null); }
  function isOneVal(x){ if (x === undefined || x === null) return false; return x instanceof Frac ? (x.n === 1n && x.d === 1n) : x.isOne(); }

// 蒲瓜的计算器 · 符号微积分引擎
// 零依赖 ES module，只用 Node 内置能力（BigInt / Math），不联网、不装包。
//
// 导出：parse / simplify / toString / evalAt / deriv / taylor / limit /
//       integrate / definiteIntegral / Rat (精确有理数，便于外部复用)
//
// AST 节点形状固定：
//   { t:"num", v:Rat } | { t:"var", name:"x" } | { t:"neg", a } |
//   { t:"add", a, b }  | { t:"mul", a, b }     | { t:"pow", a, b } |
//   { t:"fn", name:"sin", arg }
//
// 内部约定：所有数值字面量与导数系数都用精确有理数（BigInt 分子/分母）表示，
// 因此 d/dx(x^3/3) 精确得到 x^2，不存在浮点退化。

/* ============================== 1. 精确有理数 ============================== */

function bigAbs(a) { return a < 0n ? -a : a; }

function bigGcd(a, b) {
  a = bigAbs(a); b = bigAbs(b);
  while (b) { const t = a % b; a = b; b = t; }
  return a;
}

/** 精确有理数：BigInt 分子 / BigInt 分母，分母恒正、自动约分。 */
class Rat {
  constructor(n, d = 1n) {
    n = BigInt(n); d = BigInt(d);
    if (d === 0n) throw new Error("有理数的分母不能为 0");
    if (d < 0n) { n = -n; d = -d; }
    const g = bigGcd(n, d) || 1n;
    this.n = n / g;
    this.d = d / g;
  }
  add(o) { return new Rat(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { return new Rat(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { return new Rat(this.n * o.n, this.d * o.d); }
  div(o) {
    if (o.n === 0n) throw new Error("有理数除以 0");
    return new Rat(this.n * o.d, this.d * o.n);
  }
  neg() { return new Rat(-this.n, this.d); }
  inv() {
    if (this.n === 0n) throw new Error("0 没有倒数");
    return new Rat(this.d, this.n);
  }
  abs() { return this.n < 0n ? this.neg() : this; }
  get isZero() { return this.n === 0n; }
  get isOne() { return this.n === 1n && this.d === 1n; }
  get isInt() { return this.d === 1n; }
  get sign() { return this.n < 0n ? -1 : (this.n > 0n ? 1 : 0); }
  eq(o) { return this.n === o.n && this.d === o.d; }
  cmp(o) { const l = this.n * o.d, r = o.n * this.d; return l < r ? -1 : (l > r ? 1 : 0); }
  toNumber() { return Number(this.n) / Number(this.d); }
  /** "3"、"1/6"、"-1/6" */
  toString() { return this.d === 1n ? this.n.toString() : this.n + "/" + this.d; }
}

const R0 = new Rat(0n);
const R1 = new Rat(1n);
const R2 = new Rat(2n);
const RHALF = new Rat(1n, 2n);
const RAT_CACHE = new Map();
/** 由整数构造有理数（带缓存，热路径友好）。 */
function ri(n) {
  n = BigInt(n);
  let v = RAT_CACHE.get(n);
  if (!v) { v = new Rat(n, 1n); RAT_CACHE.set(n, v); }
  return v;
}
function rn(n) { return new Rat(n); }

/**
 * 连分数有理重构：浮点数 x 若非常接近分母不大的有理数，就还原它。
 * 用于「数值判定的极限恰好是 1/2 这类精确值」的场景。
 */
function ratApprox(x, maxDen = 100000000n, eps = 1e-9) {
  if (!Number.isFinite(x)) return null;
  const neg = x < 0;
  const v = Math.abs(x);
  if (v > 1e15) return null;
  let h0 = 0n, h1 = 1n, k0 = 1n, k1 = 0n;
  let frac = v;
  for (let i = 0; i < 40; i++) {
    const a = Math.floor(frac);
    if (!Number.isFinite(a) || a < 0) break;
    const ab = BigInt(a);
    const h2 = ab * h1 + h0, k2 = ab * k1 + k0;
    if (k2 > maxDen) break;
    h0 = h1; h1 = h2; k0 = k1; k1 = k2;
    const cand = Number(h1) / Number(k1);
    if (Math.abs(cand - v) <= eps * Math.max(1, Math.abs(v))) {
      const r = new Rat(h1, k1);
      return neg ? r.neg() : r;
    }
    const next = frac - a;
    if (next < 1e-15) break;
    frac = 1 / next;
  }
  return null;
}

/* ============================== 2. 数值格式化 ============================== */

/** 一般数值 → 可读文本（给 limit.value、steps 展示用）。 */
function formatNumber(x) {
  if (typeof x !== "number") return String(x);
  if (Number.isNaN(x)) return "NaN";
  if (x === Infinity) return "+inf";
  if (x === -Infinity) return "-inf";
  if (Number.isInteger(x)) return String(x);
  const r = ratApprox(x, 1000000n, 1e-12);
  if (r && !r.isInt) return r.toString();
  return String(Number(x.toPrecision(12)));
}

/** 定积分数值的展示：只有能精确还原成简单分数时才写成分数，否则写十进制。 */
function numericText(x) {
  if (typeof x !== "number" || !Number.isFinite(x)) return formatNumber(x);
  if (Number.isInteger(x)) return String(x);
  const r = ratApprox(x, 10000n, 1e-13);
  if (r && !r.isInt) return r.toString();
  return String(Number(x.toPrecision(12)));
}

/* ============================== 3. AST 工具 ============================== */

const num = (v) => ({ t: "num", v: (v instanceof Rat ? v : rn(v)) });
const n0 = () => ({ t: "num", v: R0 });
const n1 = () => ({ t: "num", v: R1 });
const variable = (name) => ({ t: "var", name });
const isNum = (x) => x.t === "num";
const isZeroNode = (x) => x.t === "num" && x.v.isZero;
const isOneNode = (x) => x.t === "num" && x.v.isOne;
const PI_NODE = () => ({ t: "fn", name: "pi", arg: null });
const E_NODE = () => ({ t: "fn", name: "e", arg: null });

/** 是否是自然常数 e 这个节点。 */
function isENode(n) {
  return !!n && n.t === "fn" && n.name === "e" && n.arg === null;
}

/** 稳定结构键：结构等价的子树 → 同一字符串（用于排序/同类项合并）。 */
function key(n) {
  switch (n.t) {
    case "num": return "#" + n.v.toString();
    case "var": return "$" + n.name;
    case "neg": return "-(" + key(n.a) + ")";
    case "add": return "+(" + key(n.a) + "," + key(n.b) + ")";
    case "mul": return "*(" + key(n.a) + "," + key(n.b) + ")";
    case "pow": return "^(" + key(n.a) + "," + key(n.b) + ")";
    case "fn": return "@" + n.name + "(" + (n.arg ? key(n.arg) : "") + ")";
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
}

const CMP = (a, b) => (a < b ? -1 : (a > b ? 1 : 0));

/** 深拷贝。 */
function clone(n) {
  switch (n.t) {
    case "num": return { t: "num", v: n.v };
    case "var": return { t: "var", name: n.name };
    case "neg": return { t: "neg", a: clone(n.a) };
    case "add": return { t: "add", a: clone(n.a), b: clone(n.b) };
    case "mul": return { t: "mul", a: clone(n.a), b: clone(n.b) };
    case "pow": return { t: "pow", a: clone(n.a), b: clone(n.b) };
    case "fn": return { t: "fn", name: n.name, arg: n.arg ? clone(n.arg) : null };
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
}

function walk(n, f) {
  f(n);
  if (n.t === "neg") walk(n.a, f);
  else if (n.t === "add" || n.t === "mul" || n.t === "pow") { walk(n.a, f); walk(n.b, f); }
  else if (n.t === "fn" && n.arg) walk(n.arg, f);
}

/* ============================== 4. 词法分析 ============================== */

const FUNCS = new Set([
  "sin", "cos", "tan", "cot", "sec", "csc",
  "asin", "acos", "atan", "sinh", "cosh", "tanh",
  "ln", "log", "exp", "sqrt", "abs",
]);
const CONSTS = new Set(["pi", "e"]);

function tokenize(src) {
  if (typeof src !== "string") throw new Error("表达式必须是字符串");
  const s = src.replace(/\u03C0/g, " pi ").replace(/\u221E/g, " inf ").replace(/\*\*/g, "^");
  const out = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(s[i + 1] || ""))) {
      let j = i, seenDot = false;
      while (j < s.length && (/[0-9]/.test(s[j]) || (s[j] === "." && !seenDot))) {
        if (s[j] === ".") seenDot = true;
        j++;
      }
      if (s[j] === "e" || s[j] === "E") {
        let k = j + 1;
        if (s[k] === "+" || s[k] === "-") k++;
        if (/[0-9]/.test(s[k] || "")) { while (k < s.length && /[0-9]/.test(s[k])) k++; j = k; }
      }
      out.push({ k: "num", v: s.slice(i, j) });
      i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i;
      while (j < s.length && /[A-Za-z0-9_]/.test(s[j])) j++;
      out.push({ k: "name", v: s.slice(i, j) });
      i = j; continue;
    }
    if ("+-*/^(),".includes(c)) { out.push({ k: c }); i++; continue; }
    throw new Error("无法识别的字符「" + c + "」（位置 " + i + "）");
  }
  out.push({ k: "eof" });
  return out;
}

/* ============================== 5. 语法分析 ============================== */

/** 把十进制字面量精确转成有理数（不用 parseFloat，避免精度丢失）。 */
function decToRat(text) {
  let s = String(text);
  let exp = 0;
  const eIdx = s.search(/[eE]/);
  if (eIdx >= 0) {
    exp = parseInt(s.slice(eIdx + 1), 10);
    s = s.slice(0, eIdx);
  }
  let intPart = s, fracPart = "";
  const dot = s.indexOf(".");
  if (dot >= 0) { intPart = s.slice(0, dot); fracPart = s.slice(dot + 1); }
  if (intPart === "") intPart = "0";
  let n = BigInt(intPart || "0") * BigInt("1" + "0".repeat(fracPart.length)) + BigInt(fracPart || "0");
  let d = BigInt("1" + "0".repeat(fracPart.length));
  if (exp > 0) n *= BigInt("10") ** BigInt(exp);
  else if (exp < 0) d *= BigInt("10") ** BigInt(-exp);
  return new Rat(n, d);
}

/**
 * 解析字符串 → AST。
 * 支持隐式乘法（2x、3sin(x)、x(x+1)、2(x+1)）、^ 右结合、一元负号、括号。
 * 出错时 throw new Error(中文错误信息)。
 */
function parse(src) {
  const toks = tokenize(src);
  let pos = 0;
  const peek = () => toks[pos];
  const next = () => toks[pos++];
  const at = (k) => toks[pos].k === k;

  function expect(k, msg) {
    if (!at(k)) throw new Error("语法错误：" + msg + "，但读到" + describe(peek()));
    return next();
  }
  function describe(t) {
    if (!t || t.k === "eof") return "表达式结尾";
    if (t.k === "num") return "数字「" + t.v + "」";
    if (t.k === "name") return "「" + t.v + "」";
    return "「" + t.k + "」";
  }

  function parseExpr() {
    let left = parseMul();
    while (at("+") || at("-")) {
      const op = next().k;
      const right = parseMul();
      left = op === "+" ? { t: "add", a: left, b: right } : { t: "add", a: left, b: { t: "neg", a: right } };
    }
    return left;
  }

  // 乘法层：连续的「因子」自动视为相乘（隐式乘法）
  function parseMul() {
    let left = parseUnary();
    for (;;) {
      const t = peek();
      if (t.k === "num" || t.k === "name" || t.k === "(") {
        const right = parseUnary();
        left = { t: "mul", a: left, b: right };
      } else if (t.k === "*" || t.k === "/") {
        next();
        const right = parseUnary();
        left = t.k === "*"
          ? { t: "mul", a: left, b: right }
          : { t: "mul", a: left, b: { t: "pow", a: right, b: num(ri(-1)) } };
      } else break;
    }
    return left;
  }

  // 一元层：-x、+x，然后进入幂层
  function parseUnary() {
    if (at("-")) { next(); return { t: "neg", a: parseUnary() }; }
    if (at("+")) { next(); return parseUnary(); }
    return parsePower();
  }

  // 幂层：右结合，指数本身可以带一元负号（x^-1）
  function parsePower() {
    const base = parseAtom();
    if (at("^")) {
      next();
      const exp = parseUnary();
      return { t: "pow", a: base, b: exp };
    }
    return base;
  }

  function parseAtom() {
    const t = peek();
    if (t.k === "num") { next(); return { t: "num", v: decToRat(t.v) }; }
    if (t.k === "name") {
      next();
      const name = t.v;
      // 已登记的函数名后面跟括号 → 函数调用；其它名字后面跟括号 → 隐式乘法 x(x+1)
      if (FUNCS.has(name) && at("(")) {
        next();
        const arg = parseExpr();
        expect(")", "函数 " + name + " 缺少右括号「)」");
        return { t: "fn", name, arg };
      }
      if (CONSTS.has(name)) return name === "pi" ? PI_NODE() : E_NODE();
      if (FUNCS.has(name)) throw new Error("函数「" + name + "」缺少参数括号，请写成 " + name + "(x)");
      // 单字母名字后面跟括号 → 隐式乘法 x(x+1)；多字母名字 → 当作未知函数调用
      if (at("(") && name.length > 1) throw new Error("未知函数「" + name + "」");
      if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) return variable(name);
      throw new Error("无法识别的名称「" + name + "」");
    }
    if (t.k === "(") {
      next();
      const inner = parseExpr();
      if (!at(")")) throw new Error("括号没有闭合：缺少右括号「)」");
      next();
      return inner;
    }
    if (t.k === "eof") throw new Error("表达式不完整：结尾缺少内容");
    if (t.k === ")") throw new Error("表达式里出现了多余的右括号「)」");
    throw new Error("语法错误：这里不该出现" + describe(t));
  }

  const root = parseExpr();
  if (!at("eof")) throw new Error("表达式在" + describe(peek()) + "之后还有多余内容，请检查运算符是否写漏");
  return root;
}

/* ============================== 6. 化简 ============================== */

/** 把和式摊平成项列表。 */
function flattenSum(n, out = []) {
  if (n.t === "add") { flattenSum(n.a, out); flattenSum(n.b, out); return out; }
  out.push(n);
  return out;
}

/** 把积式摊平成因子列表（neg 也算系数 -1）。 */
function flattenProd(n, out = []) {
  if (n.t === "mul") { flattenProd(n.a, out); flattenProd(n.b, out); return out; }
  if (n.t === "neg") { flattenProd(n.a, out); out.unshift(num(ri(-1))); return out; }
  out.push(n);
  return out;
}

/** 取出项的数值系数与其余部分：2*x → {c:2, base:x}；-x → {c:-1, base:x}；5 → {c:5, base:null} */
function coeffOf(n) {
  const factors = flattenProd(n);
  let c = R1;
  const rest = [];
  for (const f of factors) {
    if (isNum(f)) c = c.mul(f.v);
    else rest.push(f);
  }
  if (rest.length === 0) return { c, base: null };
  let base = rest[0];
  for (let i = 1; i < rest.length; i++) base = { t: "mul", a: base, b: rest[i] };
  return { c, base };
}

const factKey = (b) => (b === null ? "#1" : key(b));

/** 单项乘积的规范化：合并数值系数、合并同底数幂、稳定排序。 */
function makeProd(factors) {
  let c = R1;
  const powers = []; // { base, exp: Rat | node | null }
  for (const f of factors) {
    if (isNum(f)) { c = c.mul(f.v); continue; }
    let base = f, exp = null;
    if (f.t === "pow") { base = f.a; exp = f.b; }
    if (base.t === "neg") { c = c.neg(); base = base.a; }
    // 只有「数字底数 + 数字指数」才能折进系数；2^x 这种指数是变量的必须保留
    if (base.t === "num" && exp !== null && isNum(exp)) {
      const folded = powRat(base.v, exp);
      if (folded) { c = c.mul(folded); continue; }
    }
    if (exp && isNum(exp) && exp.v.isZero) continue;
    if (exp && isNum(exp) && exp.v.isOne) exp = null;
    let merged = false;
    if (exp === null) {
      for (const p of powers) {
        if (key(p.base) !== key(base)) continue;
        if (p.exp === null) p.exp = ri(2);
        else if (p.exp instanceof Rat) p.exp = p.exp.add(R1);
        else continue;
        merged = true; break;
      }
    } else if (isNum(exp)) {
      for (const p of powers) {
        if (key(p.base) !== key(base)) continue;
        if (p.exp === null) p.exp = exp.v.add(R1);
        else if (p.exp instanceof Rat) p.exp = p.exp.add(exp.v);
        else continue;
        merged = true; break;
      }
    }
    if (!merged) powers.push({ base, exp: exp === null ? null : (isNum(exp) ? exp.v : exp) });
  }
  if (c.isZero) return n0();
  const list = [];
  for (const p of powers) {
    if (p.exp === null) list.push(p.base);
    else if (p.exp instanceof Rat) {
      if (p.exp.isZero) continue;
      if (p.exp.isOne) list.push(p.base);
      else list.push({ t: "pow", a: p.base, b: num(p.exp) });
    } else list.push({ t: "pow", a: p.base, b: p.exp });
  }
  for (const f of list) if (isNum(f) && f.v.isZero) return n0();
  list.sort(factorCmp);
  if (list.length === 0) return num(c);
  if (c.isOne) return list.length === 1 ? list[0] : buildMulList(list);
  if (c.eq(ri(-1))) {
    const body = list.length === 1 ? list[0] : buildMulList(list);
    return body.t === "num" ? num(c.mul(body.v)) : { t: "neg", a: body };
  }
  return buildMulList([num(c), ...list]);
}

function buildMulList(list) {
  let acc = list[0];
  for (let i = 1; i < list.length; i++) acc = { t: "mul", a: acc, b: list[i] };
  return acc;
}

/** 因子排序：数字 → 变量 → 幂 → 函数，同类按键排序，保证输出稳定。 */
function factorCmp(x, y) {
  const rank = (n) => {
    if (n.t === "num") return 0;
    if (n.t === "var") return 1;
    if (n.t === "pow") return 2;
    if (n.t === "fn") return 3;
    return 4;
  };
  const rx = rank(x), ry = rank(y);
  if (rx !== ry) return rx - ry;
  return CMP(key(x), key(y));
}

/** 项的排序（和式稳定输出）：按次数降序，再按键。 */
function termSortCmp(a, b) {
  const da = sortDeg(a), db = sortDeg(b);
  if (da !== db) return db - da;
  return CMP(key(a), key(b));
}
function sortDeg(n) {
  if (n.t === "pow" && isNum(n.b)) return Number(n.b.v.toNumber());
  if (n.t === "var") return 1;
  if (n.t === "num") return -1e9;
  if (n.t === "neg") return sortDeg(n.a);
  if (n.t === "mul") return Math.max(sortDeg(n.a), sortDeg(n.b));
  return 0;
}

/** 有理数底数的整数次幂（保持精确）。 */
function powRat(base, expNode) {
  if (!isNum(expNode)) return null;
  const e = expNode.v;
  if (e.isInt) {
    const k = e.n;
    if (k >= 0n) {
      if (k > 4096n) return null;
      return new Rat(base.n ** k, base.d ** k);
    }
    const kk = -k;
    if (kk > 4096n) return null;
    if (base.isZero) return null;
    return new Rat(base.d ** kk, base.n ** kk);
  }
  return null;
}

/**
 * 化简（含常数折叠、恒等式、合并同类项）。
 * 输出稳定：同样输入永远得到结构相同的输出。
 */
function simplify(node) {
  return simp(node, new Map());
}

function simp(n, cache) {
  if (!n || typeof n !== "object") throw new Error("simplify 收到非法节点");
  const k = key(n);
  if (cache.has(k)) return cache.get(k);
  const r = simpInner(n, cache);
  cache.set(k, r);
  return r;
}

function simpInner(n, cache) {
  switch (n.t) {
    case "num": return num(n.v);
    case "var": return variable(n.name);
    case "fn":
      if (n.arg === null) return { t: "fn", name: n.name, arg: null };
      return { t: "fn", name: n.name, arg: simp(n.arg, cache) };
    case "neg": {
      const a = simp(n.a, cache);
      if (isNum(a)) return num(a.v.neg());
      if (a.t === "neg") return a.a;
      return makeProd([num(ri(-1)), a]);
    }
    case "add": return simplifySum(flattenSum(n).map((t) => simp(t, cache)));
    case "mul": return makeProd(flattenProd(n).map((f) => simp(f, cache)));
    case "pow": {
      const a = simp(n.a, cache), b = simp(n.b, cache);
      return simpPow(a, b);
    }
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
}

function simpPow(a, b) {
  if (isNum(b)) {
    if (b.v.isZero) return n1();
    if (b.v.isOne) return a;
    if (isNum(a)) {
      const r = powRat(a.v, b);
      if (r) return num(r);
    }
  }
  // e^x 与 exp(x) 统一成 exp(x)，两种写法行为完全一致
  if (isENode(a)) return { t: "fn", name: "exp", arg: b };
  if (isNum(a) && a.v.isZero) return b.t === "num" && b.v.sign > 0 ? n0() : { t: "pow", a, b };
  if (isNum(a) && a.v.isOne) return n1();
  if (b.t === "num" && b.v.eq(ri(-1))) return { t: "pow", a, b };
  if (a.t === "pow" && isNum(a.b) && isNum(b)) {
    const e = a.b.v.mul(b.v);
    if (e.isOne) return a.a;
    if (e.isZero) return n1();
    return { t: "pow", a: a.a, b: num(e) };
  }
  return { t: "pow", a, b };
}

/** 和式化简：合并同类项 + 常数折叠 + 稳定排序。 */
function simplifySum(terms) {
  const groups = new Map();
  for (const t of terms) {
    const { c, base } = coeffOf(t);
    if (c.isZero) continue;
    const bk = factKey(base);
    const g = groups.get(bk);
    if (g) g.c = g.c.add(c);
    else groups.set(bk, { c, base });
  }
  const out = [];
  for (const g of [...groups.values()]) {
    if (g.c.isZero) continue;
    if (g.base === null) { out.push(num(g.c)); continue; }
    out.push(makeProd([num(g.c), g.base]));
  }
  if (out.length === 0) return n0();
  if (out.length === 1) return out[0];
  const nums = out.filter(isNum);
  const rest = out.filter((x) => !isNum(x));
  rest.sort(termSortCmp);
  const all = [...rest, ...nums]; // 常数项放最后，符合书写习惯
  let acc = all[0];
  for (let i = 1; i < all.length; i++) acc = { t: "add", a: acc, b: all[i] };
  return acc;
}

/* ============================== 7. 打印 ============================== */

const PREC_ADD = 1, PREC_MUL = 2, PREC_NEG = 3, PREC_POW = 4, PREC_ATOM = 5;

function prec(n) {
  switch (n.t) {
    case "add": return PREC_ADD;
    case "mul": return PREC_MUL;
    case "neg": return PREC_NEG;
    case "pow": return PREC_POW;
    default: return PREC_ATOM;
  }
}

/** 原子形状（数字/变量/函数调用/幂），打印时不需要额外括号。 */
function isAtomish(n) {
  return n.t === "num" || n.t === "var" || n.t === "fn" || n.t === "pow";
}

/** 负系数拆分：用于 a - b 的打印。返回其相反数（正系数形式），无负号则 null。 */
function negSplit(n) {
  if (n.t === "neg") return n.a;
  if (isNum(n) && n.v.sign < 0) return num(n.v.neg());
  if (n.t === "mul") {
    const { c, base } = coeffOf(n);
    if (base !== null && c.sign < 0) return makeProd([num(c.neg()), base]);
  }
  return null;
}

function fmt(n, parentPrec) {
  const p = prec(n);
  let s;
  switch (n.t) {
    case "num": s = n.v.toString(); break;
    case "var": s = n.name; break;
    case "fn": s = n.arg === null ? n.name : n.name + "(" + fmt(n.arg, 0) + ")"; break;
    case "neg": {
      s = prec(n.a) < PREC_MUL ? "-(" + fmt(n.a, 0) + ")" : "-" + fmt(n.a, PREC_NEG);
      break;
    }
    case "pow": {
      const basePrec = isAtomish(n.a) ? PREC_ATOM : PREC_MUL;
      let base = fmt(n.a, basePrec);
      if (isNum(n.a) && n.a.v.sign < 0) base = "(" + n.a.v.toString() + ")";
      // 负整数指数打印成分式，避免出现 x^2^-1 这种令人困惑的写法
      if (isNum(n.b) && n.b.v.isInt && n.b.v.sign < 0) {
        const m = n.b.v.neg();
        const denom = m.isOne ? base : base + "^" + m.toString();
        s = "1/" + (isAtomish(n.a) ? denom : "(" + denom + ")");
        break;
      }
      s = base + "^" + fmt(n.b, PREC_POW);
      break;
    }
    case "mul": s = fmtProduct(n); break;
    case "add": s = fmtSum(n); break;
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
  if (p < parentPrec) s = "(" + s + ")";
  return s;
}

function fmtSum(n) {
  const terms = flattenSum(n);
  let out = "";
  for (let i = 0; i < terms.length; i++) {
    const t = terms[i];
    if (i === 0) {
      out += fmtProduct(t);
    } else {
      const pos = negSplit(t);
      if (pos !== null) out += " - " + fmtProduct(pos);
      else out += " + " + fmtProduct(t);
    }
  }
  return out;
}

function fmtProduct(n) {
  if (n.t === "neg") return "-" + fmtProduct(n.a);
  if (n.t !== "mul") return fmt(n, PREC_MUL);
  const factors = flattenProd(n);
  let c = R1;
  const rest = [];
  for (const f of factors) {
    if (isNum(f)) c = c.mul(f.v);
    else rest.push(f);
  }
  if (rest.length === 0) return c.toString();
  rest.sort(factorCmp);
  const sign = c.sign < 0 ? "-" : "";
  const absC = c.abs();
  let head = "";
  if (absC.isOne) head = "";
  else if (absC.n === 1n && absC.d !== 1n) head = "";
  else head = absC.toString() + "*";
  let body = rest.map((f) => fmt(f, PREC_MUL)).join("*");
  if (head === "" && absC.n === 1n && absC.d !== 1n) body = body + "/" + absC.d.toString();
  return sign + head + body;
}

/**
 * 把 AST 打印成中缀字符串，优先级正确、括号最少。
 * 只使用 ASCII：* / ^ -，函数写成 sin(x) 这样。
 */
function toString(node) {
  if (!node || typeof node !== "object") throw new Error("toString 收到非法节点");
  return fmt(node, 0);
}

/* ============================== 8. 求值 ============================== */

const FN_EVAL = {
  sin: Math.sin, cos: Math.cos, tan: Math.tan,
  asin: Math.asin, acos: Math.acos, atan: Math.atan,
  sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  sech: (x) => 1 / Math.cosh(x),
  coth: (x) => Math.cosh(x) / Math.sinh(x),
  ln: (x) => (x === 0 ? -Infinity : (x < 0 ? NaN : Math.log(x))),
  log: (x) => (x === 0 ? -Infinity : (x < 0 ? NaN : Math.log(x))),
  exp: Math.exp, sqrt: Math.sqrt, abs: Math.abs,
};

/** 代入数值：返回 number（可能 Infinity / NaN，不抛错）。 */
function evalAt(node, x, varName = "x") {
  return ev(node, { x, varName });
}

function ev(n, env) {
  switch (n.t) {
    case "num": return n.v.toNumber();
    case "var": return n.name === env.varName ? env.x : NaN;
    case "neg": return -ev(n.a, env);
    case "add": return ev(n.a, env) + ev(n.b, env);
    case "mul": return ev(n.a, env) * ev(n.b, env);
    case "pow": {
      const b = ev(n.a, env), e = ev(n.b, env);
      if (b === 0 && e === 0) return NaN;
      if (b < 0 && !Number.isInteger(e)) return NaN;
      return Math.pow(b, e);
    }
    case "fn": {
      if (n.arg === null) return n.name === "pi" ? Math.PI : Math.E;
      const a = ev(n.arg, env);
      if (n.name === "cot") return Math.cos(a) / Math.sin(a);
      if (n.name === "sec") return 1 / Math.cos(a);
      if (n.name === "csc") return 1 / Math.sin(a);
      const f = FN_EVAL[n.name];
      if (!f) throw new Error("未知函数：" + n.name);
      return f(a);
    }
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
}

/** 纯有理数求值：全部用 Rat 计算，除不尽（如 sin、sqrt）返回 null。 */
function evalRat(n, x, varName = "x") {
  switch (n.t) {
    case "num": return n.v;
    case "var": return n.name === varName ? x : null;
    case "neg": { const a = evalRat(n.a, x, varName); return a === null ? null : a.neg(); }
    case "add": {
      const a = evalRat(n.a, x, varName), b = evalRat(n.b, x, varName);
      return (a === null || b === null) ? null : a.add(b);
    }
    case "mul": {
      const a = evalRat(n.a, x, varName), b = evalRat(n.b, x, varName);
      return (a === null || b === null) ? null : a.mul(b);
    }
    case "pow": {
      const a = evalRat(n.a, x, varName), b = evalRat(n.b, x, varName);
      if (a === null || b === null || !b.isInt) return null;
      const k = b.n;
      if (k >= 0n) return new Rat(a.n ** k, a.d ** k);
      if (a.isZero) return null;
      const kk = -k;
      return new Rat(a.d ** kk, a.n ** kk);
    }
    default: return null;
  }
}

/* ============================== 9. 求导 ============================== */

const DERIV_FN = {
  sin: (a) => ({ t: "fn", name: "cos", arg: a }),
  cos: (a) => ({ t: "neg", a: { t: "fn", name: "sin", arg: a } }),
  tan: (a) => ({ t: "pow", a: { t: "fn", name: "sec", arg: a }, b: num(ri(2)) }),
  cot: (a) => ({ t: "neg", a: { t: "pow", a: { t: "fn", name: "csc", arg: a }, b: num(ri(2)) } }),
  sec: (a) => ({ t: "mul", a: { t: "fn", name: "sec", arg: a }, b: { t: "fn", name: "tan", arg: a } }),
  csc: (a) => ({ t: "neg", a: { t: "mul", a: { t: "fn", name: "csc", arg: a }, b: { t: "fn", name: "cot", arg: a } } }),
  asin: (a) => ({ t: "pow", a: { t: "add", a: n1(), b: { t: "neg", a: { t: "pow", a, b: num(R2) } } }, b: num(new Rat(-1n, 2n)) }),
  acos: (a) => ({ t: "neg", a: { t: "pow", a: { t: "add", a: n1(), b: { t: "neg", a: { t: "pow", a, b: num(R2) } } }, b: num(new Rat(-1n, 2n)) } }),
  atan: (a) => ({ t: "pow", a: { t: "add", a: n1(), b: { t: "pow", a, b: num(R2) } }, b: num(ri(-1)) }),
  sinh: (a) => ({ t: "fn", name: "cosh", arg: a }),
  cosh: (a) => ({ t: "fn", name: "sinh", arg: a }),
  tanh: (a) => ({ t: "pow", a: { t: "fn", name: "sech", arg: a }, b: num(R2) }),
  ln: (a) => ({ t: "pow", a, b: num(ri(-1)) }),
  log: (a) => ({ t: "pow", a, b: num(ri(-1)) }),
  exp: (a) => ({ t: "fn", name: "exp", arg: a }),
  sqrt: (a) => ({ t: "mul", a: num(RHALF), b: { t: "pow", a, b: num(new Rat(-1n, 2n)) } }),
  abs: (a) => ({ t: "mul", a: { t: "fn", name: "abs", arg: a }, b: { t: "pow", a, b: num(ri(-1)) } }),
};

/**
 * 求导（结果已 simplify）。
 * 规则齐全：幂、积、商、链式、以及 a^b 的一般式（对数求导）。
 */
function deriv(node, varName = "x") {
  return d(node, varName);
}

function d(n, v) {
  switch (n.t) {
    case "num": return n0();
    case "var": return n.name === v ? n1() : n0();
    case "neg": return { t: "neg", a: d(n.a, v) };
    case "add": return smooth({ t: "add", a: d(n.a, v), b: d(n.b, v) });
    case "mul": {
      // 积法则：(uv)' = u'v + uv'
      const a = d(n.a, v), b = d(n.b, v);
      return smooth({
        t: "add",
        a: { t: "mul", a, b: clone(n.b) },
        b: { t: "mul", a: clone(n.a), b },
      });
    }
    case "pow": {
      const base = n.a, exp = n.b;
      if (isNum(exp)) {
        // 幂法则（含链式）：n * base^(n-1) * base'
        const k = exp.v;
        const newExp = k.sub(R1);
        const p = newExp.isZero ? clone(base) : { t: "pow", a: clone(base), b: num(newExp) };
        return smooth({ t: "mul", a: num(k), b: { t: "mul", a: p, b: d(base, v) } });
      }
      if (isNum(base) || isENode(base)) {
        // 指数法则：(a^u)' = a^u * ln(a) * u'（a = e 时 ln(a) = 1）
        const lnA = isENode(base) ? n1() : { t: "fn", name: "ln", arg: num(base.v) };
        return smooth({ t: "mul", a: { t: "mul", a: clone(n), b: lnA }, b: d(exp, v) });
      }
      // 一般式（对数求导）：(u^w)' = u^w * (w' * ln u + w * u'/u)
      const u = clone(base), w = clone(exp);
      const term1 = { t: "mul", a: d(exp, v), b: { t: "fn", name: "ln", arg: u } };
      const term2 = { t: "mul", a: w, b: { t: "mul", a: d(base, v), b: { t: "pow", a: clone(base), b: num(ri(-1)) } } };
      return smooth({ t: "mul", a: clone(n), b: { t: "add", a: term1, b: term2 } });
    }
    case "fn": {
      if (n.arg === null) return n0();
      const rule = DERIV_FN[n.name];
      if (!rule) throw new Error("不支持对函数 " + n.name + " 求导");
      const outer = rule(clone(n.arg));
      const inner = d(n.arg, v);
      if (isOneNode(inner)) return smooth(outer);
      return smooth({ t: "mul", a: outer, b: inner });
    }
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
}

const smooth = (n) => simplify(n);

  /* ==================== 增广矩阵求解 [A|b] ==================== */
  /* 最后一列当 b，其余列是系数矩阵；行数任意，列数至少 2。 */
  function augSolve(M){
    var s = shape(M);
    if (s[1] < 2) throw new Error("增广矩阵至少要有 2 列：最后一列当 b，前面是系数矩阵。现在只有 " + s[1] + " 列。");
    var rows = s[0], cols = s[1], n = cols - 1;
    var A = [], b = [], i, j;
    for (i = 0; i < rows; i++){
      var row = [];
      for (j = 0; j < n; j++) row.push(val(M[i][j]));
      A.push(row);
      b.push([val(M[i][n])]);
    }
    var red = rref(valMat(M));
    var rankA = rref(A).rank;
    var r = solve(A, b);
    var g = r.type === "none" ? { type: "none" } : generalSolution(A, b);
    return {
      RREF: red.R, m: rows, n: n, cols: cols,
      rankA: rankA, rankAug: red.rank, unknown: n,
      type: r.type, free: r.type === "infinite" ? r.free : 0,
      particular: r.type === "none" ? null : r.x,
      basis: g.basis || [],
      solution: g
    };
  }

/* ===== 符号引擎（从 src/calc-core.mjs 内联，微积分三页用的是同一份） ===== */
/* 上面这些函数（parse / simplify / toString / evalAt / Rat / powRat / makeProd ...）
   和后面的线代引擎在同一个闭包里；下面的 Calc 只是给符号值层一个统一入口。 */
var Calc = {
  parse: parse, simplify: simplify, str: toString, evalAt: evalAt,
  num: function(n, d){ return { t: "num", v: (d === undefined ? new Rat(BigInt(n)) : new Rat(BigInt(n), BigInt(d))) }; },
  makeProd: makeProd, ratOne: R1, ratZero: R0
};

  function bigAbs(x){ return x < 0n ? -x : x; }
  function bigGcd(a, b){ a = bigAbs(a); b = bigAbs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
  function isqrt(n){
    if (n < 0n) throw new Error("负数不能开平方");
    if (n < 2n) return n;
    var x = n, y = (x + 1n) / 2n;
    while (y < x) { x = y; y = (x + n / x) / 2n; }
    return x;
  }

        for (var j = 0; j < n; j++){

          var ar = roots[i].re - roots[j].re, ai = roots[i].im - roots[j].im;
          var q = dr * ar - di * ai, q2 = dr * ai + di * ar;
          dr = q; di = q2;
        }
        var den = dr * dr + di * di;
        if (den === 0) continue;
        var ur = (num.re * dr + num.im * di) / den;
        var ui = (num.im * dr - num.re * di) / den;
        roots[i] = { re: roots[i].re - ur, im: roots[i].im - ui };
        var mag = Math.sqrt(ur * ur + ui * ui);
        if (mag > maxd) maxd = mag;
      }
      if (maxd < 1e-15) break;
    }
    roots.forEach(function(r){
      if (Math.abs(r.re) < 1e-12) r.re = 0;
      if (Math.abs(r.im) < 1e-12) r.im = 0;
    });
    roots.sort(function(a, b){ return a.re !== b.re ? a.re - b.re : a.im - b.im; });
    return roots;
  }
  function eigen(A){
    var s = shape(A), n = s[0];
    if (n !== s[1]) throw new Error("特征值要求方阵");
    guardNumOnly(A);
    if (n === 1) return [{ re: A[0][0].toNumber(), im: 0, exact: A[0][0] }];
    if (n === 2){
      var a = A[0][0], b = A[0][1], c = A[1][0], d = A[1][1];
      var half = a.add(d).div(TWO);
      var disc = half.mul(half).sub(a.mul(d).sub(b.mul(c)));
      if (disc.sign() >= 0){
        var rn = perfectSqrt(disc.n), rd = perfectSqrt(disc.d);
        if (rn !== null && rd !== null){
          var sq = new Frac(rn, rd);
          return [
            { re: half.add(sq).toNumber(), im: 0, exact: half.add(sq) },
            { re: half.sub(sq).toNumber(), im: 0, exact: half.sub(sq) }
          ];
        }
      }
      var h = half.toNumber(), dd = disc.toNumber();
      if (dd >= 0){ var r0 = Math.sqrt(dd); return [{ re: h - r0, im: 0 }, { re: h + r0, im: 0 }]; }
      var r1 = Math.sqrt(-dd);
      return [{ re: h, im: -r1 }, { re: h, im: r1 }];
    }
    if (n > 4) throw new Error("特征值目前支持 1–4 阶");
    return durandKerner(charPoly(A));
  }

  return {
    Frac: Frac, F: F, ZERO: ZERO, ONE: ONE, TWO: TWO,
    shape: shape, matAdd: matAdd, matSub: matSub, matMul: matMul, scaleMat: scaleMat,
    transpose: transpose, trace: trace, det: det, rref: rref, ref: ref, rank: rank,
    inverse: inverse, solve: solve, eigen: eigen,
    nullspaceBasis: nullspaceBasis, colspaceBasis: colspaceBasis,
    generalSolution: generalSolution, rowSteps: rowSteps, eyeFrac: eyeFrac,
    /* 符号矩阵（字母当数用）与增广矩阵求解的新接口 */
    V: val, val: val, valMat: valMat, isSym: isSym, Sym: Sym, calc: Calc, augSolve: augSolve
  };
})();
/* ==== ENGINE END ==== */
</script>

<script>
(function(){
  "use strict";
  var L = LinAlg, F = L.F;

  var S = { dim: 3, dec: false, net: true };
  var GEO = { yaw: -0.62, pitch: 0.42, zoom: 1, spin: false };
  var AXES = [
    { v: [1, 0, 0], color: "#ff6b6b", label: "x" },
    { v: [0, 1, 0], color: "#51cf66", label: "y" },
    { v: [0, 0, 1], color: "#4dabf7", label: "z" }
  ];
  var C_X = "#ffd43b", C_TX = "#f06595", C_NET = "#4dabf7";

  function el(id){ return document.getElementById(id); }

  /* ---------- 输入网格 ---------- */
  function makeGrid(box, rows, cols, values){
    box.innerHTML = "";
    box.style.setProperty("--cols", cols);
    var inputs = [], r, c;
    for (r = 0; r < rows; r++){
      for (c = 0; c < cols; c++){
        var inp = document.createElement("input");
        inp.type = "text";
        inp.inputMode = "text";
        inp.setAttribute("autocomplete", "off");
        inp.placeholder = "0";
        inp.value = (values && values[r] && values[r][c] !== undefined) ? values[r][c] : "";
        inp.addEventListener("keydown", function(e){
          if (e.key !== "Enter") return;
          e.preventDefault();
          var idx = inputs.indexOf(this);
          var next = inputs[(idx + 1) % inputs.length];
          if (next){ next.focus(); if (next.select) next.select(); }
        });
        inp.addEventListener("input", refresh);
        box.appendChild(inp);
        inputs.push(inp);
      }
    }
    return inputs;
  }

  function readValues(box, rows, cols){
    var inputs = box.querySelectorAll("input"), out = [], i = 0, r, c;
    for (r = 0; r < rows; r++){
      var row = [];
      for (c = 0; c < cols; c++){ row.push(inputs[i] ? inputs[i].value : ""); i++; }
      out.push(row);
    }
    return out;
  }

  function readFracs(box, rows, cols){
    var vals = readValues(box, rows, cols), M = [], r, c;
    for (r = 0; r < rows; r++){
      var row = [];
      for (c = 0; c < cols; c++) row.push(F(vals[r][c]));
      M.push(row);
    }
    return M;
  }

  /* ---------- 数字渲染 ---------- */
  function fmtNum(x){
    if (!isFinite(x)) return String(x);
    if (Math.abs(x) < 1e-12) x = 0;
    var s = (Math.abs(x) >= 1e-6 || x === 0) ? x.toFixed(6) : x.toExponential(4);
    if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
    if (s === "-0") s = "0";
    return s;
  }
  function fracHTML(f){
    if (f.d === 1n) return String(f.n);
    var neg = f.n < 0n, n = neg ? -f.n : f.n;
    return (neg ? "−" : "") + '<span class="frac"><span class="fn">' + n + '</span><span class="fd">' + f.d + "</span></span>";
  }
  function cellHTML(f){ return S.dec ? fmtNum(f.toNumber()) : fracHTML(f); }
  function vecHTML(v){
    var h = '<div class="rgrid vec" style="--cols:1">';
    v.forEach(function(x){ h += '<div class="rcell">' + cellHTML(x) + "</div>"; });
    return h + "</div>";
  }
  function matHTML(M){
    var cols = M[0] ? M[0].length : 1;
    var h = '<div class="rgrid" style="--cols:' + cols + ';max-width:240px">';
    M.forEach(function(row){ row.forEach(function(x){ h += '<div class="rcell">' + cellHTML(x) + "</div>"; }); });
    return h + "</div>";
  }

  /* ---------- 主刷新：算 T(x)、写文字、画图 ---------- */
  var lastText = "";
  function refresh(){
    var n = S.dim;
    var A, x, Tx;
    try {
      A = readFracs(el("gridA"), n, n);
      x = readFracs(el("gridX"), n, 1);
      Tx = L.matMul(A, x);
    } catch (e){
      el("out").innerHTML = '<p class="msgerr">' + (e && e.message ? e.message : String(e)) + "</p>";
      return;
    }
    var rows = "";
    rows += '<div class="eqrow"><span class="eqlab">A =</span>' + matHTML(A) + "</div>";
    rows += '<div class="eqrow"><span class="eqlab">x =</span>' + vecHTML(x.map(function(r){ return r[0]; })) + "</div>";
    rows += '<div class="eqrow"><span class="eqlab">T(x) = A x =</span>' + vecHTML(Tx.map(function(r){ return r[0]; })) + "</div>";
    rows += '<p class="geoinfo" id="geoText"></p>';
    el("out").innerHTML = rows;

    lastText = "A = [" + A.map(function(r){ return r.map(function(v){ return v.toString(); }).join(", "); }).join("; ") + "]\n" +
      "x = (" + x.map(function(r){ return r[0].toString(); }).join(", ") + ")\n" +
      "T(x) = (" + Tx.map(function(r){ return r[0].toString(); }).join(", ") + ")";

    describe(A, x, Tx);
    draw();
    el("geoText").innerHTML = geoWords.join("<br>");
  }

  var geoWords = [];
  function describe(A, x, Tx){
    var n = S.dim, out = [];
    var det, rk, eig;
    try { det = L.det(A); rk = L.rank(A); } catch (e){ geoWords = ["矩阵不是方阵，无法作为线性变换。"]; return; }
    var dn = det.toNumber();
    var detTxt = S.dec ? fmtNum(dn) : fracHTML(det);

    // 数值矩阵（2 阶嵌进 xy 平面）
    var M = [[0,0,0],[0,0,0],[0,0,1]], r, c;
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) M[r][c] = A[r][c].toNumber();

    out.push("<b>T(x) = A x</b>　这是一个从 R" + n + " 到 R" + n + " 的线性变换：原点不动，直线还是直线，网格保持等距。");
    out.push("<b>det A</b> = " + detTxt + "　<b>|det A|</b> = " + (S.dec ? fmtNum(Math.abs(dn)) : fracHTML(dn < 0 ? det.neg() : det)) + "　<b>rank A</b> = " + rk);

    if (rk === 0) out.push("这是<b>零变换</b>：整个空间被压到原点。");
    else if (rk < n) out.push("空间被压扁成 " + rk + " 维：体积归零、不可逆，" + (n - rk) + " 个方向被压成零向量。");
    else out.push("空间<b>没有塌缩</b>：每个点的像唯一，可逆；体积按 " + (S.dec ? fmtNum(Math.abs(dn)) : "|det A|") + " 倍变化。");
    if (rk === n) out.push(dn > 0 ? "定向保持不变（右手系还是右手系）。" : "定向被<b>翻转</b>了（镜像，左右手互换）。");

    // 识别常见变换
    var isI = true, isZero = true, isDiag = true, isSym = true, k = [];
    for (r = 0; r < n; r++){
      k.push(M[r][r]);
      for (c = 0; c < n; c++){
        if (Math.abs(M[r][c] - (r === c ? 1 : 0)) > 1e-9) isI = false;
        if (Math.abs(M[r][c]) > 1e-9) isZero = false;
        if (r !== c && Math.abs(M[r][c]) > 1e-9){ isDiag = false; isSym = false; }
        if (c > r && Math.abs(M[r][c] - M[c][r]) > 1e-9) isSym = false;
      }
    }
    if (isI) out.push("这就是<b>恒等变换</b>：什么都不动。");
    else if (isZero) out.push("这是<b>零矩阵</b>。");
    else if (isDiag && n === 3) out.push("这是<b>沿坐标轴分别缩放</b>：x 方向 " + fmtNum(k[0]) + " 倍、y 方向 " + fmtNum(k[1]) + " 倍、z 方向 " + fmtNum(k[2]) + " 倍。");
    else if (isDiag && n === 2) out.push("这是<b>沿坐标轴分别缩放</b>：x 方向 " + fmtNum(k[0]) + " 倍、y 方向 " + fmtNum(k[1]) + " 倍。");
    if (isDiag && k.length > 1 && Math.abs(k[1] - k[0]) > 1e-9) out.push("两个方向缩放倍数不同 → 它会<b>把圆拉成椭圆</b>（各方向拉伸不一样）。");

    // 正交性：AᵀA = I ?
    var Mt = [], M2 = [], i, j, m;
    for (r = 0; r < n; r++){ var trow = []; for (c = 0; c < n; c++) trow.push(M[c][r]); Mt.push(trow); }
    for (r = 0; r < n; r++){ var prow = []; for (c = 0; c < n; c++){ var s = 0; for (m = 0; m < n; m++) s += Mt[r][m] * M[m][c]; prow.push(s); } M2.push(prow); }
    var orth = true;
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) if (Math.abs(M2[r][c] - (r === c ? 1 : 0)) > 1e-9) orth = false;
    if (orth){
      if (isI) out.push("列向量两两垂直且长度为 1 —— 这是<b>正交变换</b>（恒等）。");
      else if (dn > 0) out.push("列向量两两垂直、长度为 1，且 det > 0 —— 这是<b>旋转</b>：长度和夹角都不变，只有方向在转。");
      else out.push("列向量两两垂直、长度为 1，且 det < 0 —— 这是<b>镜像反射</b>：长度不变，但左右手互换。");
    } else {
      out.push("列向量不是两两垂直 → 它<b>不只是旋转</b>，还带拉伸或剪切（角度会被改变）。");
    }

    // 特征值：只被拉伸的方向
    try {
      eig = L.eigen(A);
      var real = eig.filter(function(e){ return Math.abs(e.im) < 1e-9; });
      if (real.length && !isI){
        var parts = real.map(function(e){ return fmtNum(e.re); });
        out.push("实的特征值 λ = " + parts.join("、") + " → 沿这些<b>特征方向</b>，向量只被拉长/压短 λ 倍，方向不变。");
      } else if (!real.length){
        out.push("没有实特征值 → 每个方向都被转过去了（像旋转那样）。");
      }
    } catch (e) {}

    // 核：被压成零的方向
    try {
      var ns = L.nullspaceBasis(A);
      if (ns.dim > 0){
        var vs = ns.basis.map(function(v){ return "(" + v.map(function(q){ return (S.dec ? fmtNum(q.toNumber()) : q.toString()); }).join(", ") + ")"; });
        out.push("被压成<b>零向量</b>的方向：" + vs.join("、") + "（这些点整个被“压没”了）。");
      }
    } catch (e) {}

    // 这条具体的 x
    out.push("你输入的这个 x 被送到 <b>T(x) = (" + Tx.map(function(row){ return S.dec ? fmtNum(row[0].toNumber()) : row[0].toString(); }).join(", ") + ")</b>。");
    geoWords = out;
  }

  /* ---------- 3D 画布 ---------- */
  function canvasCtx(){
    var cv = el("geo");
    if (!cv) return null;
    var w = cv.clientWidth || 600, h = cv.clientHeight || 330;
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    return { ctx: cv.getContext("2d"), w: w, h: h, dpr: dpr };
  }
  function project(p, w, h){
    var cy = Math.cos(GEO.yaw), sy = Math.sin(GEO.yaw);
    var x1 = p[0] * cy - p[1] * sy;
    var y1 = p[0] * sy + p[1] * cy;
    var cp = Math.cos(GEO.pitch), sp = Math.sin(GEO.pitch);
    var depth = y1 * cp - p[2] * sp;
    var up = y1 * sp + p[2] * cp;
    var scale = (Math.min(w, h) / 6.2) * GEO.zoom;
    return { x: w / 2 + x1 * scale, y: h / 2 - up * scale + h * 0.12, d: depth };
  }
  function applyM(M, p){
    return [M[0][0]*p[0] + M[0][1]*p[1] + M[0][2]*p[2],
            M[1][0]*p[0] + M[1][1]*p[1] + M[1][2]*p[2],
            M[2][0]*p[0] + M[2][1]*p[1] + M[2][2]*p[2]];
  }
  function boxOf(abc){
    var a = abc[0], b = abc[1], c = abc[2];
    function add(u, v){ return [u[0]+v[0], u[1]+v[1], u[2]+v[2]]; }
    var o = [0,0,0], ab = add(a,b), ac = add(a,c), bc = add(b,c), abc3 = add(ab,c);
    return {
      faces: [[o,a,ab,b],[c,ac,abc3,bc],[o,a,ac,c],[b,ab,abc3,bc],[o,b,bc,c],[a,ab,abc3,ac]],
      edges: [[o,a],[o,b],[o,c],[a,ab],[a,ac],[b,ab],[b,bc],[c,ac],[c,bc],[ab,abc3],[ac,abc3],[bc,abc3]]
    };
  }

  function draw(){
    var g = canvasCtx(); if (!g) return;
    var ctx = g.ctx, w = g.w, h = g.h, i;
    var cs = getComputedStyle(document.documentElement);
    var dim = (cs.getPropertyValue("--fg-dim") || "").trim() || "#8892a6";
    var accent = (cs.getPropertyValue("--accent-line") || "").trim() || "#4dabf7";
    ctx.setTransform(g.dpr, 0, 0, g.dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    function P(p){ return project(p, w, h); }
    function seg(p1, p2, color, width, dash, alpha){
      var A2 = P(p1), B = P(p2);
      ctx.save();
      if (alpha !== undefined) ctx.globalAlpha = alpha;
      ctx.strokeStyle = color; ctx.lineWidth = width || 1;
      if (dash) ctx.setLineDash(dash);
      ctx.beginPath(); ctx.moveTo(A2.x, A2.y); ctx.lineTo(B.x, B.y); ctx.stroke();
      ctx.restore();
    }
    function arrow(p1, p2, color, width){
      var A2 = P(p1), B = P(p2);
      var ang = Math.atan2(B.y - A2.y, B.x - A2.x), len = 11;
      ctx.save();
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width || 2.6;
      ctx.beginPath(); ctx.moveTo(A2.x, A2.y); ctx.lineTo(B.x, B.y); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(B.x, B.y);
      ctx.lineTo(B.x - len * Math.cos(ang - 0.42), B.y - len * Math.sin(ang - 0.42));
      ctx.lineTo(B.x - len * Math.cos(ang + 0.42), B.y - len * Math.sin(ang + 0.42));
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    function poly(pts, color, alpha){
      ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
      ctx.beginPath();
      pts.forEach(function(p, k){ var q = P(p); if (k === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y); });
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    var n = S.dim, M = [[0,0,0],[0,0,0],[0,0,1]], r, c;
    var Af = null;
    try { Af = readFracs(el("gridA"), n, n); } catch (e) {}
    if (Af) for (r = 0; r < n; r++) for (c = 0; c < n; c++) M[r][c] = Af[r][c].toNumber();

    // 网格：原来的虚线 + 变换后的实线
    if (S.net){
      for (i = -2; i <= 2; i++){
        seg([i,-2,0],[i,2,0], dim, 1, [2,5], 0.5);
        seg([-2,i,0],[2,i,0], dim, 1, [2,5], 0.5);
      }
      for (i = -2; i <= 2; i++){
        seg(applyM(M,[i,-2,0]), applyM(M,[i,2,0]), C_NET, 1.4, null, 0.5);
        seg(applyM(M,[-2,i,0]), applyM(M,[2,i,0]), C_NET, 1.4, null, 0.5);
      }
    }

    // 坐标轴
    for (i = 0; i < AXES.length; i++){
      var ax = AXES[i], v = ax.v, tip = [v[0]*2.5, v[1]*2.5, v[2]*2.5];
      arrow([0,0,0], tip, ax.color, 1.8);
      var q = P(tip);
      ctx.save(); ctx.fillStyle = ax.color;
      ctx.font = "600 13px system-ui,-apple-system,sans-serif";
      ctx.fillText(ax.label, q.x + 7, q.y + 5); ctx.restore();
    }

    // 单位立方体 → 它的像（平行六面体）
    var boxU = boxOf([[1,0,0],[0,1,0],[0,0,1]]);
    for (i = 0; i < boxU.edges.length; i++) seg(boxU.edges[i][0], boxU.edges[i][1], dim, 1, [3,3], 0.75);
    var cols = [applyM(M,[1,0,0]), applyM(M,[0,1,0]), applyM(M,[0,0,1])];
    var boxT = boxOf(cols);
    var sorted = boxT.faces.map(function(f){
      var d = 0, m;
      for (m = 0; m < f.length; m++) d += P(f[m]).d;
      return { f: f, d: d / f.length };
    }).sort(function(p, q){ return q.d - p.d; });
    sorted.forEach(function(it){ poly(it.f, accent, 0.13); });
    for (i = 0; i < boxT.edges.length; i++) seg(boxT.edges[i][0], boxT.edges[i][1], accent, 1.8);

    // 这条 x 与它的像
    var xv = null, tv = null;
    try {
      var xf = readFracs(el("gridX"), n, 1);
      xv = [xf[0][0].toNumber(), xf[1][0].toNumber(), (n === 3 ? xf[2][0].toNumber() : 0)];
      tv = applyM(M, xv);
    } catch (e) {}
    if (xv){
      arrow([0,0,0], xv, C_X, 3);
      arrow([0,0,0], tv, C_TX, 3);
    }
  }

  /* ---------- 交互 ---------- */
  var cv = el("geo");
  if (cv){
    var drag = false, lx = 0, ly = 0;
    cv.addEventListener("pointerdown", function(e){ drag = true; lx = e.clientX; ly = e.clientY; cv.classList.add("dragging"); try { cv.setPointerCapture(e.pointerId); } catch (err) {} });
    cv.addEventListener("pointermove", function(e){
      if (!drag) return;
      GEO.yaw += (e.clientX - lx) * 0.0085;
      GEO.pitch += (e.clientY - ly) * 0.0085;
      if (GEO.pitch > 1.45) GEO.pitch = 1.45;
      if (GEO.pitch < -1.45) GEO.pitch = -1.45;
      lx = e.clientX; ly = e.clientY;
      draw();
    });
    function stop(){ drag = false; cv.classList.remove("dragging"); }
    cv.addEventListener("pointerup", stop);
    cv.addEventListener("pointercancel", stop);
    cv.addEventListener("wheel", function(e){
      e.preventDefault();
      GEO.zoom = Math.max(0.5, Math.min(2.4, GEO.zoom * (e.deltaY > 0 ? 0.94 : 1.06)));
      draw();
    }, { passive: false });

    el("geoReset").addEventListener("click", function(){ GEO.yaw = -0.62; GEO.pitch = 0.42; GEO.zoom = 1; draw(); });
    el("geoSpin").addEventListener("click", function(){
      GEO.spin = !GEO.spin;
      el("geoSpin").textContent = GEO.spin ? "停止旋转" : "自动旋转";
      if (GEO.spin) loop();
    });
    function loop(){
      if (!GEO.spin) return;
      GEO.yaw += 0.011;
      draw();
      requestAnimationFrame(loop);
    }
    el("geoNet").addEventListener("click", function(){
      S.net = !S.net;
      el("geoNet").textContent = "网格：" + (S.net ? "开" : "关");
      draw();
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".chip[id^='dim']"), function(b){
    b.addEventListener("click", function(){
      S.dim = b.id === "dim2" ? 2 : 3;
      el("dim2").classList.toggle("on", S.dim === 2);
      el("dim3").classList.toggle("on", S.dim === 3);
      rebuild();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-fill]"), function(b){
    b.addEventListener("click", function(){
      var kind = b.getAttribute("data-fill"), n = S.dim, vals = [], r, c;
      for (r = 0; r < n; r++){
        var row = [];
        for (c = 0; c < n; c++){
          if (kind === "clear") row.push("");
          else if (kind === "zero") row.push("0");
          else if (kind === "eye") row.push(r === c ? "1" : "0");
          else row.push(String(Math.floor(Math.random() * 9) - 4));
        }
        vals.push(row);
      }
      makeGrid(el("gridA"), n, n, vals);
      refresh();
    });
  });

  el("xReset").addEventListener("click", function(){
    var n = S.dim, vals = [], r;
    for (r = 0; r < n; r++) vals.push([r === 0 ? "1" : "0"]);
    makeGrid(el("gridX"), n, 1, vals);
    refresh();
  });

  el("dec").addEventListener("click", function(){
    S.dec = !S.dec;
    el("dec").textContent = S.dec ? "分数" : "小数";
    refresh();
  });
  el("copy").addEventListener("click", function(){
    var t = lastText + "\n" + geoWords.map(function(s){ return s.replace(/<[^>]+>/g, ""); }).join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ flash("已复制"); }, function(){ flash("复制失败"); });
    } else { flash("不支持复制"); }
  });
  function flash(t){
    var b = el("copy");
    b.textContent = t;
    setTimeout(function(){ b.textContent = "复制"; }, 1200);
  }

  var THEME = {
    glass: { color: "#080c18", bar: "black-translucent" },
    light: { color: "#f2f2f7", bar: "default" },
    brutal: { color: "#fdf1dd", bar: "default" },
    ark: { color: "#0b0b0c", bar: "black-translucent" },
    neon: { color: "#07060f", bar: "black-translucent" },
    mono: { color: "#000000", bar: "black-translucent" }
  };
  function applySkin(s){
    document.documentElement.setAttribute("data-skin", s);
    Array.prototype.forEach.call(document.querySelectorAll("#skins button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-skin-set") === s);
    });
    try { localStorage.setItem("la-skin-v2", s); } catch (e) {}
    var T = THEME[s] || THEME.light;
    var mc = document.querySelector('meta[name="theme-color"]');
    if (mc) mc.setAttribute("content", T.color);
    var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (sb) sb.setAttribute("content", T.bar);
    draw();
  }
  Array.prototype.forEach.call(document.querySelectorAll("#skins button"), function(b){
    b.addEventListener("click", function(){ applySkin(b.getAttribute("data-skin-set")); });
  });
  window.addEventListener("resize", draw);

  function rebuild(){
    var n = S.dim, r, c, keep = [];
    for (r = 0; r < n; r++){
      var row = [];
      for (c = 0; c < n; c++) row.push(r === c ? "1" : "0");
      keep.push(row);
    }
    makeGrid(el("gridA"), n, n, keep);
    var xv = [];
    for (r = 0; r < n; r++) xv.push([r === 0 ? "1" : "0"]);
    makeGrid(el("gridX"), n, 1, xv);
    refresh();
  }

  rebuild();
  var SKINS = ["glass", "light", "brutal", "ark", "neon", "mono"], saved = "light";
  try {
    var q = new URLSearchParams(location.search).get("skin");
    saved = q || localStorage.getItem("la-skin-v2") || "light";
  } catch (e) {}
  if (SKINS.indexOf(saved) < 0) saved = "light";
  applySkin(saved);
})();
</script>
</body>
</html>
