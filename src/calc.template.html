<!doctype html>
<html lang="zh-CN" data-skin="ark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>__PAGE_TITLE__ · 蒲瓜的计算器</title>
<style>
:root{ --radius:18px; --card-bw:1px; --input-bw:1px; --blur:none; --shadow:none; --skin-bw:0; --track:rgba(130,130,140,.16); --danger:#ff6b6b; }
:root[data-skin="glass"]{
  --bg:#080c18;
  --bg-image:radial-gradient(880px 520px at 10% -10%, rgba(94,234,212,.20), transparent 62%), radial-gradient(820px 520px at 102% 2%, rgba(129,140,248,.26), transparent 64%), radial-gradient(700px 460px at 50% 112%, rgba(236,72,153,.14), transparent 62%);
  --fg:#e9efff; --fg-dim:rgba(233,239,255,.52);
  --card:rgba(255,255,255,.055); --card-border:rgba(255,255,255,.13);
  --blur:blur(18px); --shadow:0 12px 34px rgba(0,0,0,.34);
  --input-bg:rgba(255,255,255,.06); --input-border:rgba(255,255,255,.12);
  --chip:rgba(255,255,255,.06); --chip-border:rgba(255,255,255,.12);
  --chip-on-bg:linear-gradient(135deg,#5eead4,#818cf8); --chip-on-fg:#08101f; --chip-on-shadow:0 6px 18px rgba(129,140,248,.35);
  --accent-line:rgba(129,140,248,.85); --focus-ring:rgba(129,140,248,.22);
  --btn-bg:linear-gradient(135deg,#5eead4,#818cf8); --btn-fg:#07101d; --btn-shadow:0 10px 26px rgba(129,140,248,.32);
  --mark:linear-gradient(135deg,#5eead4,#818cf8); --mark-fg:#08101f; --logo-shadow:0 6px 18px rgba(129,140,248,.35);
  --ok:#5eead4;
}
:root[data-skin="light"]{
  --bg:#f2f2f7; --bg-image:none; --fg:#101014; --fg-dim:#8a8a92;
  --card:#ffffff; --card-border:rgba(0,0,0,.06); --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  --track:#e6e6ec; --input-bg:#f5f5f8; --input-border:rgba(0,0,0,.07);
  --chip:#ececf1; --chip-border:transparent; --chip-on-bg:#0a84ff; --chip-on-fg:#ffffff; --chip-on-shadow:0 6px 16px rgba(10,132,255,.30);
  --accent-line:#0a84ff; --focus-ring:rgba(10,132,255,.16);
  --btn-bg:linear-gradient(135deg,#0a84ff,#0060df); --btn-fg:#ffffff; --btn-shadow:0 10px 24px rgba(10,132,255,.28);
  --mark:linear-gradient(135deg,#0a84ff,#5e5ce6); --mark-fg:#ffffff; --logo-shadow:0 6px 16px rgba(10,132,255,.30); --danger:#e5484d;
  --ok:#0a84ff;
}
:root[data-skin="brutal"]{
  --bg:#fdf1dd; --bg-image:none; --fg:#141414; --fg-dim:#6f6656;
  --card:#fffdf8; --card-border:#141414; --card-bw:2px; --input-bw:2px; --radius:14px; --skin-bw:2px;
  --shadow:6px 6px 0 #141414; --track:#fffdf8; --input-bg:#ffffff; --input-border:#141414;
  --chip:#ffffff; --chip-border:#141414; --chip-on-bg:#ffd23f; --chip-on-fg:#141414; --chip-on-shadow:3px 3px 0 #141414;
  --accent-line:#141414; --focus-ring:rgba(255,210,63,.55);
  --btn-bg:#ff5c4d; --btn-fg:#141414; --btn-shadow:4px 4px 0 #141414;
  --mark:#ffd23f; --mark-fg:#141414; --logo-shadow:none; --danger:#c22f22; --ok:#141414;
}
/* ==================== 新增皮肤：方舟 / 霓虹 / 终端 ==================== */
/* 方舟：深黑底、直角、1px 细亮边、亮黄点缀、轻微斜纹（军事科技感） */
:root[data-skin="ark"]{
  --bg:#ffffff; --bg-image:repeating-linear-gradient(135deg, rgba(17,17,17,.022) 0 10px, transparent 10px 20px);
  --fg:#111213; --fg-dim:#6b7280;
  --card:#ffffff; --card-border:#d5d9de; --card-bw:1px; --radius:2px; --skin-bw:1px;
  --shadow:0 1px 2px rgba(17,17,17,.05); --track:#f1f3f5;
  --chip:#f6f7f9; --chip-border:#c9ced4;
  --chip-on-bg:#ffe600; --chip-on-fg:#111213;
  --mark:#111213; --mark-fg:#ffe600; --logo-shadow:none;
  --input-bg:#f4f5f7; --input-border:#111213; --input-bw:1px;
  --btn-bg:#111213; --btn-fg:#ffffff; --btn-shadow:none;
  --focus-ring:#ffe600; --accent-line:#111213; --chip-on-shadow:none; --danger:#d92d20; --blur:none;
}
/* 霓虹：深紫黑底 + 青/品红辉光 */
:root[data-skin="neon"]{
  --bg:#07060f;
  --bg-image:radial-gradient(1100px 560px at 18% -8%, rgba(0,229,255,.12), transparent 62%), radial-gradient(900px 500px at 100% 0%, rgba(255,62,165,.10), transparent 58%);
  --fg:#eaf7ff; --fg-dim:#8ea6c8;
  --card:rgba(18,13,34,.86); --card-border:#312a63; --card-bw:1px; --radius:16px; --skin-bw:1px;
  --shadow:0 0 26px rgba(0,229,255,.10); --track:#0d0a1c;
  --chip:rgba(24,18,44,.85); --chip-border:#3a3170;
  --chip-on-bg:#00e5ff; --chip-on-fg:#04060f;
  --mark:#00e5ff; --mark-fg:#04060f; --logo-shadow:0 0 18px rgba(0,229,255,.45);
}
/* 终端：纯黑 + 绿字 + 等宽 + 扫描线 */
:root[data-skin="mono"]{
  --bg:#000000; --bg-image:repeating-linear-gradient(0deg, rgba(57,255,138,.05) 0 1px, transparent 1px 3px);
  --fg:#39ff8a; --fg-dim:#1f8a4c;
  --card:#050805; --card-border:#1f6b3d; --card-bw:1px; --radius:0px; --skin-bw:1px;
  --shadow:none; --track:#020402;
  --chip:#040a06; --chip-border:#1f6b3d;
  --chip-on-bg:#39ff8a; --chip-on-fg:#000000;
  --mark:#39ff8a; --mark-fg:#000000; --logo-shadow:none;
}
.skins{flex-wrap:wrap;justify-content:flex-end}
/* 方舟的直角卡片：左侧亮条 + 右上角标 */
:root[data-skin="ark"] .card{position:relative;overflow:hidden}
:root[data-skin="ark"] .card::before{content:"";position:absolute;left:0;top:9px;width:3px;height:22px;background:var(--fg)}
:root[data-skin="ark"] .chip.on,:root[data-skin="ark"] .tabs .on{box-shadow:none;font-weight:700;letter-spacing:.02em;border-color:#111213}
:root[data-skin="ark"] .tabs .tag{color:#111213;background:transparent;border-radius:0;padding:0;opacity:.6;font-weight:400}
/* 霓虹的发光选中态 */
:root[data-skin="neon"] .chip.on,:root[data-skin="neon"] .tabs .on{box-shadow:0 0 16px rgba(0,229,255,.45)}
/* 终端用等宽字体 */
:root[data-skin="mono"] body{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
:root[data-skin="mono"] .tabs .on{box-shadow:0 0 12px rgba(57,255,138,.35)}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 15px max(30px,env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;transition:background .25s ease,color .25s ease}
body::before{content:"";position:fixed;inset:0;background-image:var(--bg-image);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--mark);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--mark-fg);flex:0 0 auto;box-shadow:var(--logo-shadow);font-style:italic}
.brandName{font-size:12.5px;color:var(--fg-dim);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skins{display:flex;gap:3px;padding:3px;background:var(--track);border-radius:999px;border:var(--skin-bw) solid var(--card-border)}
.skins button{border:0;background:transparent;color:var(--fg-dim);font:inherit;font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;transition:.18s}
.skins button.on{background:var(--chip-on-bg);color:var(--chip-on-fg);font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--track);border:1px solid var(--card-border);border-radius:15px}
.tabs a,.tabs span{flex:1 1 calc(25% - 4px);text-align:center;padding:10px 6px;border-radius:11px;font-size:13px;text-decoration:none;color:var(--fg-dim);transition:.18s;white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs .on{background:var(--chip-on-bg);color:var(--chip-on-fg);font-weight:600;box-shadow:var(--chip-on-shadow)}
.tabs .tag{font-size:10.5px;opacity:.75;margin-left:3px}
.hero{text-align:center;padding:4px 2px 0}
.heroTitle{margin:0;font-size:23px;font-weight:800;letter-spacing:.005em;line-height:1.32}
.heroSub{margin:7px 0 0;font-size:12.5px;color:var(--fg-dim);letter-spacing:.08em}
.card{background:var(--card);border:var(--card-bw) solid var(--card-border);border-radius:var(--radius);padding:13px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.chead{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.mtag{width:28px;height:28px;border-radius:9px;background:var(--mark);color:var(--mark-fg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;font-style:italic}
.rtitle{font-size:13px;font-weight:600}
.note{font-size:11.5px;color:var(--fg-dim)}
.tools{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.tools button{border:1px solid var(--input-border);background:var(--chip);color:var(--fg);font:inherit;font-size:12px;padding:5px 9px;border-radius:8px;cursor:pointer}
.tools button:active{transform:translateY(1px)}
.fxin{width:100%;padding:13px 12px;font:inherit;font-size:17px;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--input-bg);border:var(--input-bw) solid var(--input-border);border-radius:12px;outline:none;transition:.16s}
.fxin:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--focus-ring)}
.glabel{font-size:11px;color:var(--fg-dim);letter-spacing:.12em;margin:12px 0 7px}
.glabel:first-child{margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{border:1px solid var(--chip-border);background:var(--chip);color:var(--fg);font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:transparent;font-weight:600;box-shadow:var(--chip-on-shadow)}
.chip.big{font-size:14.5px;padding:12px 16px;font-weight:650;border-color:var(--accent-line);font-variant-numeric:tabular-nums}
.chip sup{font-size:.68em;vertical-align:super;line-height:0;letter-spacing:.02em}
.kbox{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-dim)}
.kbox input{width:74px;padding:8px 9px;font:inherit;font-size:13.5px;text-align:center;color:var(--fg);background:var(--input-bg);border:var(--input-bw) solid var(--input-border);border-radius:9px;outline:none;font-variant-numeric:tabular-nums}
.kbox input:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--focus-ring)}
.syms{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.syms button{min-width:42px;border:1px solid var(--input-border);background:var(--chip);color:var(--fg);font:inherit;font-size:14.5px;padding:8px 10px;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums}
.syms button:active{transform:translateY(1px)}
.syms button.fn{font-size:13px;padding:8px 11px}
.runbtn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:var(--btn-bg);color:var(--btn-fg);font:inherit;font-size:16px;font-weight:700;letter-spacing:.14em;cursor:pointer;box-shadow:var(--btn-shadow)}
.runbtn:active{transform:translateY(1px)}
.geo{display:block;width:100%;height:290px;border-radius:12px;background:var(--input-bg);border:var(--input-bw) solid var(--input-border);touch-action:none}
.geoinfo{font-size:12.5px;color:var(--fg-dim);margin:10px 0 0;line-height:1.85}
.msgerr{font-size:13px;color:var(--danger);margin:8px 0;line-height:1.55}
.res{font-size:14px;line-height:1.75;margin:0 0 10px}
.res b{color:var(--fg)}
.bigval{font-size:19px;font-weight:700;letter-spacing:.01em}
.tagline{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;margin-right:8px;vertical-align:1px}
.tagline.ok{background:var(--chip-on-bg);color:var(--chip-on-fg)}
.tagline.no{background:var(--danger);color:#fff}
.steps{margin:10px 0 0;padding:0;list-style:none;counter-reset:st}
.steps li{position:relative;padding:0 0 0 30px;margin:0 0 9px;font-size:13px;color:var(--fg-dim);line-height:1.65}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--chip);border:1px solid var(--input-border);color:var(--fg);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.steps li b{color:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;word-break:break-word}
.calcbox{background:var(--input-bg);border:1px solid var(--input-border);border-radius:12px;padding:11px;margin-bottom:10px}
.calclab{font-size:11px;color:var(--fg-dim);letter-spacing:.1em;margin-bottom:6px}
.foot{font-size:11.5px;color:var(--fg-dim);text-align:center;margin:4px 0 0;line-height:1.7}
/* ===== 动效层 ===== */
@media (prefers-reduced-motion: no-preference){
  @keyframes dshRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes dshFade{from{opacity:0}to{opacity:1}}
  @keyframes dshPop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
  .hero,.toprow,.tabs,.skins,.heroTitle{animation:dshFade .3s ease both}
  .card,.pick{animation:dshRise .44s cubic-bezier(.22,.9,.3,1) both}
  .card:nth-of-type(2){animation-delay:.06s}
  .card:nth-of-type(3){animation-delay:.12s}
  .card:nth-of-type(4){animation-delay:.18s}
  .card:nth-of-type(5){animation-delay:.22s}
  .picks .pick:nth-child(1){animation-delay:.02s}
  .picks .pick:nth-child(2){animation-delay:.05s}
  .picks .pick:nth-child(3){animation-delay:.08s}
  .picks .pick:nth-child(4){animation-delay:.11s}
  .picks .pick:nth-child(5){animation-delay:.14s}
  .picks .pick:nth-child(6){animation-delay:.17s}
  .picks .pick:nth-child(7){animation-delay:.2s}
  .res,.stepbox,.rgrid,.calclab,.formula,.legend,.msgbox{animation:dshPop .26s ease both}
  body,.card,.chip,.tabs,.tabs span,.skins button,.pick{transition:background-color .32s ease,color .32s ease,border-color .32s ease}
  .chip:active,.run:active,.kk:active,.st:active,.skins button:active,.pick:active{transform:scale(.955);transition:transform .09s ease}
  .chip:hover,.run:hover,.tabs a:hover{transform:translateY(-1px)}
  html.dsh-leaving body{opacity:0;transform:translateY(-8px);transition:opacity .17s ease,transform .17s ease}
  .keypad:not([hidden]){animation:dshPop .2s ease both}
}
html{scroll-behavior:smooth}
/* ===== 高级感细节层 ===== */
/* 1. 排版：更紧的标题字距、抗锯齿、数字等宽 */
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.heroTitle{letter-spacing:-.022em}
.heroSub{letter-spacing:.1em;opacity:.85}
h1,h2,h3,.ptitle,.rtitle,.chead b,.chips .chip{letter-spacing:-.008em}
.rcell,.res,.bigval,.val,.num,.ctag,input,table,.formula{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.glabel,.calclab,.note,.limit,.tag,.chip i,.ptag{letter-spacing:.03em}
/* 2. 吸顶磨砂导航 + 发丝渐变分隔线 */
.tabs{position:sticky;top:8px;z-index:30;backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px)}
.tabs::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(128,128,128,.35),transparent)}
.tabs .on{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 10px -5px rgba(0,0,0,.45)}
/* 3. 卡片：发丝描边 + 两层柔和投影，悬停微抬 */
.card{position:relative;box-shadow:0 1px 2px rgba(16,18,20,.045),0 12px 32px -20px rgba(16,18,20,.38)}
.card:hover{box-shadow:0 1px 2px rgba(16,18,20,.05),0 18px 44px -22px rgba(16,18,20,.42)}
/* 4. 主按钮：顶部光泽 + 分层投影，按下回弹更深 */
.run{background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 46%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 6px rgba(16,18,20,.16),0 14px 30px -16px rgba(16,18,20,.55)}
.run:hover{filter:brightness(1.04)}
.run:active{filter:brightness(.98);box-shadow:inset 0 2px 6px rgba(16,18,20,.22)}
/* 5. 选中芯片 / 当前页：内高光，像是被"点亮" */
.chip.on,.tabs .on,.skins button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 8px -4px rgba(0,0,0,.4)}
/* 6. 结果区与输入区在质感上区分开：结果矩阵用更淡的发丝边 */
.rgrid .rcell{border-color:rgba(128,128,128,.24)}
/* 7. 键盘可达性：焦点环（鼠标点击不出现，只有 Tab 时显示） */
:where(a,button,input,select,textarea):focus-visible{outline:2px solid var(--mark,#f5e400);outline-offset:2px}
/* 8. 选中文字与滚动条收敛 */
::selection{background:var(--mark,#f5e400);color:var(--mark-fg,#111213)}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(128,128,128,.32);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.5);background-clip:content-box}
/* 9. 标题区收一条发丝渐变短线，视觉有个落点 */
.hero{position:relative}
.hero::after{content:"";display:block;width:68px;height:2px;margin:16px auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--mark,#f5e400),transparent);opacity:.9}
/* ===== 字体栈 ===== */
body{font-family:"HarmonyOS Sans SC","HarmonyOS Sans","Noto Sans SC","Source Han Sans SC","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;font-optical-sizing:auto}
.heroTitle,.ptitle,.chead b,.chips .chip,.run{font-weight:800;font-synthesis-weight:none}
.rcell,.res,.bigval,.val,.formula,.ctag{font-family:"HarmonyOS Sans","Noto Sans SC","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1 class="heroTitle">蒲瓜的计算器</h1>
    <p class="heroSub">由 Deepseek 制作</p>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" id="logo">∫</span>
      <span class="brandName" id="tagline"></span>
    </div>
    <div class="skins" id="skins">
      <button data-skin-set="glass">玻璃</button>
      <button data-skin-set="light">极简</button>
      <button data-skin-set="brutal">粗野</button>

      <button data-skin-set="ark" class="on">方舟</button>

      <button data-skin-set="neon">霓虹</button>

      <button data-skin-set="mono">终端</button>
    </div>
  </header>

  <nav class="tabs" id="nav" aria-label="页面切换"></nav>

  <section class="card">
    <div class="chead">
      <span class="mtag">f</span>
      <span class="note">输入函数：sin cos tan csc sec cot、asin acos atan、sinh cosh tanh、ln exp sqrt abs，以及 pi、e；可以写 2x 这种隐式乘法</span>
      <div class="tools"><button id="fxClear">清空</button></div>
    </div>
    <input id="fx" class="fxin" value="sin(x)/x" autocomplete="off" spellcheck="false" inputmode="text">
    <div class="syms" id="syms"></div>
    <div class="chips" style="margin-top:10px" id="examples"></div>
    <p class="geoinfo" id="fxinfo"></p>
  </section>

  <section class="card">
    <div class="chead"><span class="rtitle" id="opsTitle">运算</span><div class="tools"><button id="copy">复制结果</button></div></div>
    <div id="opsArea"></div>
    <p class="geoinfo" id="ophint"></p>
    <button class="runbtn" id="calcBtn">计 算</button>
  </section>

  <section class="card">
    <div class="chead"><span class="rtitle">结果与化简过程</span></div>
    <div id="out"></div>
  </section>

  <section class="card">
    <div class="chead">
      <span class="rtitle">函数图像</span>
      <div class="tools">
        <button id="plotFit">自动取景</button>
        <button id="plotA">以 a 为中心</button>
        <button id="plotDeriv">导数曲线</button>
      </div>
    </div>
    <canvas id="plot" class="geo"></canvas>
    <p class="geoinfo" id="plotinfo"></p>
  </section>

  <nav class="tabs" id="nav2" aria-label="页面切换"></nav>

  <p class="foot">全部计算都在本机浏览器里完成，不上传任何数据。<br>极限用直接代入 → 洛必达 → 数值逼近的顺序判定，并如实给出判定过程。</p>
</div>

<script>
/* ==== CALC ENGINE START ==== */
__CALC_ENGINE__
/* ==== CALC ENGINE END ==== */
</script>

<script>
(function(){
  "use strict";
  var C = Calc;
  var PAGE_ID = "__PAGE_ID__";

  /* ---------- 页面与导航配置（三页共用） ---------- */
  var PAGES = {
    limits: { title: "极限", logo: "lim", tagline: "极限 · 左右极限 · 化简过程", opsTitle: "极限运算",
      needs: ["a"],
      groups: [
        { label: "求极限 · x → a", ops: ["limBoth", "limLeft", "limRight"] },
        { label: "x 趋于无穷", ops: ["limPosInf", "limNegInf"] }
      ] },
    deriv: { title: "微分", logo: "d/dx", tagline: "导数 · 切线 · 泰勒展开", opsTitle: "求导与展开",
      needs: ["a", "order"],
      groups: [
        { label: "导数", ops: ["d1", "d2"] },
        { label: "泰勒展开", ops: ["taylor"] }
      ] },
    integral: { title: "积分", logo: "∫", tagline: "原函数 · 定积分 · 面积", opsTitle: "积分运算",
      needs: ["fromto"],
      groups: [
        { label: "不定积分", ops: ["integ"] },
        { label: "定积分", ops: ["defint"] }
      ] }
  };
  var NAV = [
    { id: "home", label: "首页", href: "index.html" },
    { id: "algebra", label: "矩阵", href: "algebra.html" },
    { id: "transform", label: "变换", href: "transform.html" },
    { id: "limits", label: "极限", href: "limits.html" },
    { id: "deriv", label: "微分", href: "deriv.html" },
    { id: "integral", label: "积分", href: "integral.html" },
    { id: "graph", label: "图像", href: "graph.html" },
    { id: "stats", label: "概率", href: "stats.html" }
  ];
  var OPDEF = {
    limBoth:   { label: "极限", hint: "求 lim f(x)（x → a）。两侧不一致时会分别写出左极限与右极限。" },
    limLeft:   { label: "左极限", hint: "只求 x 从左侧趋近 a 时的极限。" },
    limRight:  { label: "右极限", hint: "只求 x 从右侧趋近 a 时的极限。" },
    limPosInf: { label: "x → +∞", hint: "求 x 趋于正无穷时的极限；判定过程会写清用了什么方法。" },
    limNegInf: { label: "x → −∞", hint: "求 x 趋于负无穷时的极限。" },
    d1:        { label: "一阶导 f′", hint: "求一阶导数 f′(x)，并给出 x = a 处的取值与切线斜率。" },
    d2:        { label: "二阶导 f″", hint: "求二阶导数 f″(x)。" },
    taylor:    { label: "泰勒展开", hint: "在 x = a 处按指定阶数做泰勒展开（阶数默认 5）。" },
    integ:     { label: "不定积分 ∫f dx", hint: "求原函数（+ C）；找不到初等原函数会如实说明。" },
    defint:    { label: "定积分", hint: "在「从 … 到 …」区间上求定积分；优先精确值，否则数值积分。上下限可以写 inf / -inf，算无穷区间的反常积分（如 0 到 inf）。" }
  };

  function el(id){ return document.getElementById(id); }
  function num(v){ var n = parseFloat(String(v).replace(/，/g, ",")); return isFinite(n) ? n : NaN; }

  /* ---------- 渲染导航与运算区 ---------- */
  function navHTML(){
    var h = "";
    NAV.forEach(function(n){
      h += (n.id === PAGE_ID)
        ? '<span class="on">' + n.label + '<span class="tag">当前</span></span>'
        : '<a href="' + n.href + '">' + n.label + "</a>";
    });
    return h;
  }
  function renderChrome(){
    var p = PAGES[PAGE_ID];
    document.title = p.title + " · 蒲瓜的计算器";
    el("nav").innerHTML = navHTML();
    el("nav2").innerHTML = navHTML();
    el("logo").textContent = p.logo;
    el("tagline").textContent = p.tagline;
    el("opsTitle").textContent = p.opsTitle;

    var h = "";
    if (p.needs.indexOf("a") >= 0){
      h += '<div class="chips"><label class="kbox">a = <input id="limA" value="0" autocomplete="off" title="填数字，或写 inf / -inf"></label>';
      if (p.needs.indexOf("order") >= 0) h += '<label class="kbox">泰勒阶数 <input id="order" value="5" autocomplete="off"></label>';
      h += "</div>";
    } else if (p.needs.indexOf("order") >= 0){
      h += '<div class="chips"><label class="kbox">泰勒阶数 <input id="order" value="5" autocomplete="off"></label></div>';
    }
    if (p.needs.indexOf("fromto") >= 0){
      h += '<div class="chips"><label class="kbox">从 <input id="intA" value="0" autocomplete="off"></label>' +
           '<label class="kbox">到 <input id="intB" value="1" autocomplete="off"></label></div>';
    }
    p.groups.forEach(function(g, gi){
      if (g.label) h += '<div class="glabel">' + g.label + "</div>";
      h += '<div class="chips">';
      g.ops.forEach(function(op){
        h += '<button class="chip big' + (gi === 0 && g.ops[0] === op ? " on" : "") + '" data-op="' + op + '">' + OPDEF[op].label + "</button>";
      });
      h += "</div>";
    });
    el("opsArea").innerHTML = h;
  }
  renderChrome();   // 先把导航与运算区注入 DOM，后面的事件绑定才有对象可绑

  var S = { dec: false, op: PAGES[PAGE_ID].groups[0].ops[0] };
  var lastReport = "";

  /* ---------- 数字/文本格式化 ---------- */
  function fmt(x, digits){
    if (x === Infinity) return "+∞";
    if (x === -Infinity) return "−∞";
    if (typeof x !== "number" || isNaN(x)) return "不存在";
    if (Math.abs(x) < 1e-12) x = 0;
    var d = digits === undefined ? 8 : digits;
    var s = (x === 0 || (Math.abs(x) >= 1e-4 && Math.abs(x) < 1e7)) ? x.toFixed(Math.min(d, 10)) : x.toExponential(6);
    if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
    if (s === "-0") s = "0";
    return s.replace("-", "−");
  }
  function sup(d){
    var map = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹" };
    return String(d).split("").map(function(ch){ return map[ch] || ch; }).join("");
  }
  function pretty(str){
    return String(str)
      .replace(/\s*\*\s*/g, "·")
      .replace(/\^\(([^()]*)\)/g, function(m, d){ return supText(d); })
      .replace(/\^([0-9]+)/g, function(m, d){ return sup(d); })
      .replace(/sqrt\(/g, "√(")
      .replace(/abs\(/g, "|")
      .replace(/pi/g, "π")
      .replace(/-/g, "−");
  }
  function supText(s){
    // 把 2、3、-x^2 这类指数整体转成上标写法
    var map = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻", "+": "⁺", "x": "ˣ", "y": "ʸ", "n": "ⁿ" };
    var out = "", i, ch;
    for (i = 0; i < s.length; i++){
      ch = s.charAt(i);
      out += map[ch] || ch;
    }
    return out;
  }

  /* ---------- 解析当前函数 ---------- */
  function current(){
    var src = el("fx").value;
    if (!src.trim()) return { err: "请先输入一个函数，例如 sin(x)/x" };
    try {
      var node = C.simplify(C.parse(src));
      return { node: node, src: src };
    } catch (e){
      return { err: e && e.message ? e.message : String(e) };
    }
  }
  function preview(){
    var c = current();
    if (c.err){ el("fxinfo").innerHTML = '<span style="color:var(--danger)">' + c.err + "</span>"; return null; }
    el("fxinfo").innerHTML = "识别为：<b>" + pretty(C.str(c.node)) + "</b>";
    return c.node;
  }

  /* ---------- 输出块 ---------- */
  function show(html){ el("out").innerHTML = html; }
  function stepsHTML(steps){
    if (!steps || !steps.length) return "";
    var h = '<ul class="steps">';
    steps.forEach(function(s){ h += "<li>" + s.desc + "</li>"; });
    return h + "</ul>";
  }
  function boxHTML(label, body){
    return '<div class="calcbox"><div class="calclab">' + label + '</div><div class="mono">' + body + "</div></div>";
  }

  /* ---------- 极限 ---------- */
  /* 把一个输入框（a、积分上下限）变成「引擎能吃的东西」：
     数字、inf / -inf，或者含 pi、e 的表达式（引擎的 limit / definiteIntegral 直接接受表达式字符串）。
     返回 { a: 给引擎的值, num: 数值（画图用）, text: 显示文字 } 或 { bad: 中文提示 }。 */
  function readPoint(box, label){
    var raw = box ? String(box.value).trim() : "0";
    if (raw === "") raw = "0";
    if (/^(inf|infinity|\+inf|\+∞|∞)$/i.test(raw)) return { a: "inf", num: Infinity, text: "+∞" };
    if (/^(-inf|-infinity|-∞)$/i.test(raw)) return { a: "-inf", num: -Infinity, text: "−∞" };
    var v = num(raw);
    if (!isNaN(v)) return { a: v, num: v, text: fmt(v, 8) };
    try {
      if (/x/.test(raw)) throw new Error("含 x");
      var vv = C.evalAt(C.parse(raw.replace(/π/g, "pi")), 0);
      if (typeof vv === "number" && isFinite(vv)) return { a: raw.replace(/π/g, "pi"), num: vv, text: pretty(raw.replace(/π/g, "pi")) };
      throw new Error("算不出有限值");
    } catch (e){
      return { bad: (label || "这个值") + "要填数字、inf，或含 pi / e 的表达式（例如 pi/2、2*pi、1/3）" };
    }
  }
  function readA(){
    var p = readPoint(el("limA"), "a");
    return p.bad ? NaN : p.a;
  }
  function runLimit(side){
    var node = preview(); if (!node) return;
    var pt = readPoint(el("limA"), "a");
    if (pt.bad){ show('<p class="msgerr">' + pt.bad + "</p>"); return; }
    var a = pt.a;
    var r;
    try { r = C.limit(node, a, { side: side || "both" }); }
    catch (e){ show('<p class="msgerr">' + (e.message || e) + "</p>"); return; }

    var aText = pt.text;
    var h = "";
    if (side === "left" || side === "right"){
      var one = side === "left" ? r.left : r.right;
      var lbl = side === "left" ? "左极限" : "右极限";
      h += '<p class="res"><b>' + lbl + "　lim<sub>x→" + aText + (side === "left" ? "⁻" : "⁺") + "</sub> f(x)</b><br>";
      if (one && one.kind === "infinite") h += '<span class="bigval">' + (one.value > 0 ? "+∞" : "−∞") + "</span>　（" + lbl + "发散到无穷，" + lbl + "不存在）";
      else if (one && typeof one.value === "number") h += '<span class="bigval">' + (one.exact ? one.exact : fmt(one.value)) + "</span>" + (one.exact ? "　（精确值）" : "　（数值判定）");
      else h += '<span class="bigval">不存在</span>';
      h += "</p>";
    } else {
      var ok = r.exists;
      h += '<p class="res"><span class="tagline ' + (ok ? "ok" : "no") + '">' + (ok ? "极限存在" : "极限" + (r.kind === "infinite" ? "为无穷（不存在）" : "不存在")) + "</span>";
      h += "lim<sub>x→" + aText + "</sub> f(x) = ";
      if (ok && r.exact) h += '<span class="bigval">' + r.exact + "</span>　（精确值）";
      else if (ok && typeof r.value === "number") h += '<span class="bigval">' + fmt(r.value) + "</span>　（数值判定）";
      else if (r.kind === "infinite") h += '<span class="bigval">' + ((r.left && r.left.value > 0) || (r.right && r.right.value > 0) ? "+∞" : "−∞") + "</span>";
      else h += '<span class="bigval">不存在</span>';
      h += "</p>";
      var lTxt = r.left && r.left.kind === "infinite" ? (r.left.value > 0 ? "+∞" : "−∞") : (r.left && typeof r.left.value === "number" ? (r.left.exact || fmt(r.left.value)) : "不存在");
      var rTxt = r.right && r.right.kind === "infinite" ? (r.right.value > 0 ? "+∞" : "−∞") : (r.right && typeof r.right.value === "number" ? (r.right.exact || fmt(r.right.value)) : "不存在");
      h += '<p class="res">左极限 = <b>' + lTxt + "</b>　　右极限 = <b>" + rTxt + "</b>";
      if (!ok && r.kind !== "infinite") h += "　→ 两侧不相等（或振荡）";
      h += "</p>";
    }
    h += '<div class="calclab" style="margin-top:14px">化简与判定过程</div>' + stepsHTML(r.steps);
    show(h);
    lastReport = "lim x→" + aText + " f(x)：" + (r.exists ? (r.exact || fmt(r.value)) : "不存在");
    PLOT.overlay = { type: "limit", a: typeof a === "number" ? a : (a === "inf" ? 20 : -20), L: r.exists ? r.value : null };
    PLOT.label = "lim<sub>x→" + aText + "</sub> f(x)" + (r.exists ? " = " + (r.exact || fmt(r.value)) : " 不存在");
    if (a === "inf"){ PLOT.xmin = -2; PLOT.xmax = 20; autoY(); }
    else if (a === "-inf"){ PLOT.xmin = -20; PLOT.xmax = 2; autoY(); }
    else plotWindowAround(isFinite(pt.num) ? pt.num : 0);
    plotDraw();
  }

  /* ---------- 导数 ---------- */
  function safeEval(node, x){
    try { var v = C.evalAt(node, x); return typeof v === "number" && isFinite(v) ? v : NaN; }
    catch (e){ return NaN; }
  }
  function runDeriv(order){
    var node = preview(); if (!node) return;
    var d1 = C.deriv(node), d2 = order === 2 ? C.deriv(d1) : null;
    var h = boxHTML("f(x)", pretty(C.str(node)));
    h += boxHTML(order === 2 ? "二阶导 f″(x)" : "一阶导 f′(x)", pretty(C.str(order === 2 ? d2 : d1)));
    if (order === 2) h += boxHTML("（顺带）一阶导 f′(x)", pretty(C.str(d1)));
    var ptd = readPoint(el("limA"), "a");
    var a = ptd.bad ? NaN : ptd.num;
    if (!isNaN(a)){
      var s1 = safeEval(node, a), s2 = safeEval(d1, a);
      h += '<p class="res">在 x = ' + fmt(a, 6) + " 处：f = <b>" + fmt(s1) + "</b>，切线斜率 f′ = <b>" + fmt(s2) + "</b></p>";
      h += '<p class="res">切线方程：y = ' + fmt(s2) + "(x − " + fmt(a, 6) + ") + " + fmt(s1) + "</p>";
      PLOT.overlay = { type: "tangent", a: a, k: s2, y0: s1 };
      PLOT.label = "x = " + fmt(a, 4) + " 处的切线，斜率 " + fmt(s2);
      plotWindowAround(a);
    }
    show(h);
    lastReport = "f′(x) = " + C.str(d1) + (d2 ? "\nf″(x) = " + C.str(d2) : "");
    plotDraw();
  }

  /* ---------- 泰勒 ---------- */
  function runTaylor(){
    var node = preview(); if (!node) return;
    var ptt = readPoint(el("limA"), "a");
    var a = ptt.bad ? 0 : ptt.num;
    var order = Math.max(1, Math.min(12, Math.round(num(el("order") ? el("order").value : 5) || 5)));
    var t;
    try { t = C.taylor(node, a, order); }
    catch (e){ show('<p class="msgerr">' + (e.message || e) + "</p>"); return; }
    var h = '<p class="res">在 x = ' + fmt(a, 6) + " 处展开到 " + order + " 阶：</p>";
    h += boxHTML("泰勒多项式", pretty(t.text));
    if (t.terms && t.terms.length){
      h += '<div class="calclab" style="margin-top:12px">逐项系数</div><ul class="steps">';
      t.terms.forEach(function(term){
        h += "<li>" + (term.power === 0 ? "常数项" : "x" + sup(term.power) + " 项") + "系数 <b>" + term.coefText + "</b></li>";
      });
      h += "</ul>";
    }
    show(h);
    lastReport = "泰勒展开：" + t.text;
  }

  /* ---------- 积分 ---------- */
  function runInteg(){
    var node = preview(); if (!node) return;
    var r = C.integrate(node);
    var h = boxHTML("f(x)", pretty(C.str(node)));
    if (r.ok){
      h += boxHTML("原函数 ∫f(x)dx", pretty(r.text));
      h += '<p class="res">把上面这个原函数求导，应该回到 f(x)。</p>';
    } else {
      h += '<p class="res">这个函数<b>找不到初等原函数</b>（' + (r.reason || "不在支持表内") + "）。<br>定积分仍然可以用数值方法算，去「积分」页的定积分试试。</p>";
    }
    show(h);
    lastReport = r.ok ? "∫f(x)dx = " + r.text : "∫f(x)dx：找不到初等原函数";
  }
  function runDefint(){
    var node = preview(); if (!node) return;
    var pa = readPoint(el("intA"), "积分下限"), pb = readPoint(el("intB"), "积分上限");
    if (pa.bad || pb.bad){ show('<p class="msgerr">' + (pa.bad || pb.bad) + "</p>"); return; }
    var r = C.definiteIntegral(node, pa.a, pb.a);
    var an = pa.num, bn = pb.num;
    var h = boxHTML("积分区间", "从 " + pa.text + " 到 " + pb.text);
    var shown = r.exact ? pretty(r.exact) : (r.divergent ? "发散" : fmt(r.numeric));
    var kind = r.exact ? "　（精确值）"
      : r.divergent ? "　（广义积分发散）"
      : r.improper ? "　（瑕积分·收敛，数值结果）"
      : "　（数值积分）";
    h += '<p class="res">∫<sub>' + pa.text + "</sub><sup>" + pb.text + "</sup> f(x) dx = <b class=\"bigval\">" + shown + "</b>" + kind + "</p>";
    if (r.note) h += '<p class="res" style="color:var(--fg-dim)">' + r.note + "</p>";
    if (r.exact) h += '<p class="res">数值核对：' + r.approxText + "</p>";
    show(h);
    lastReport = "∫ from " + pa.a + " to " + pb.a + " = " + (r.exact || (r.divergent ? "发散" : r.numeric));
    PLOT.overlay = { type: "area", a: an, b: bn, node: node };
    PLOT.label = "阴影面积 = " + (r.exact ? pretty(r.exact) : (r.divergent ? "发散" : fmt(r.numeric)));
    /* 无穷区间画不出阴影，取有限的一段当示意窗口 */
    var anP = isFinite(an) ? an : (isFinite(bn) ? bn - 8 : -8);
    var bnP = isFinite(bn) ? bn : (isFinite(an) ? an + 8 : 8);
    var lo = Math.min(anP, bnP), hi = Math.max(anP, bnP), pad = Math.max((hi - lo) * 0.8, 1);
    PLOT.xmin = lo - pad; PLOT.xmax = hi + pad;
    autoY();
    plotDraw();
  }

  /* ---------- 画图 ---------- */
  var PLOT = { xmin: -6, xmax: 6, ymin: -3, ymax: 3, node: null, overlay: null, label: "", showDeriv: false };
  function plotWindowAround(a){ PLOT.xmin = a - 6; PLOT.xmax = a + 6; autoY(); }
  function autoY(){
    if (!PLOT.node) return;
    var lo = Infinity, hi = -Infinity, i, x, v;
    for (i = 0; i <= 400; i++){
      x = PLOT.xmin + (PLOT.xmax - PLOT.xmin) * i / 400;
      v = safeEval(PLOT.node, x);
      if (isFinite(v)){ if (v < lo) lo = v; if (v > hi) hi = v; }
    }
    if (!isFinite(lo) || !isFinite(hi) || lo === hi){ PLOT.ymin = -3; PLOT.ymax = 3; return; }
    var span = hi - lo, mid = (hi + lo) / 2;
    if (span < 1e-6) span = 2;
    span = Math.min(span, 60);
    PLOT.ymin = mid - span * 0.7;
    PLOT.ymax = mid + span * 0.7;
  }
  function niceStep(raw){
    var p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
  }
  function plotDraw(){
    var cv = el("plot"); if (!cv) return;
    var w = cv.clientWidth || 600, hgt = cv.clientHeight || 290, dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(hgt * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr); }
    var g = cv.getContext("2d");
    var cs = getComputedStyle(document.documentElement);
    var dim = (cs.getPropertyValue("--fg-dim") || "").trim() || "#888";
    var accent = (cs.getPropertyValue("--accent-line") || "").trim() || "#0a84ff";
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, hgt);
    var pad = 6;
    var X = function(x){ return pad + (x - PLOT.xmin) / (PLOT.xmax - PLOT.xmin) * (w - pad * 2); };
    var Y = function(y){ return hgt - pad - (y - PLOT.ymin) / (PLOT.ymax - PLOT.ymin) * (hgt - pad * 2); };

    g.save();
    g.strokeStyle = dim; g.globalAlpha = 0.18; g.lineWidth = 1;
    var stepX = niceStep((PLOT.xmax - PLOT.xmin) / 8), stepY = niceStep((PLOT.ymax - PLOT.ymin) / 5), t;
    for (t = Math.ceil(PLOT.xmin / stepX) * stepX; t <= PLOT.xmax; t += stepX){ g.beginPath(); g.moveTo(X(t), pad); g.lineTo(X(t), hgt - pad); g.stroke(); }
    for (t = Math.ceil(PLOT.ymin / stepY) * stepY; t <= PLOT.ymax; t += stepY){ g.beginPath(); g.moveTo(pad, Y(t)); g.lineTo(w - pad, Y(t)); g.stroke(); }
    g.restore();

    g.save();
    g.strokeStyle = dim; g.globalAlpha = 0.75; g.lineWidth = 1.4;
    if (PLOT.ymin <= 0 && PLOT.ymax >= 0){ g.beginPath(); g.moveTo(pad, Y(0)); g.lineTo(w - pad, Y(0)); g.stroke(); }
    if (PLOT.xmin <= 0 && PLOT.xmax >= 0){ g.beginPath(); g.moveTo(X(0), pad); g.lineTo(X(0), hgt - pad); g.stroke(); }
    g.globalAlpha = 1; g.fillStyle = dim; g.font = "11px system-ui,sans-serif";
    g.fillText("x", w - pad - 12, Y(0) - 6);
    g.fillText("y", X(0) + 6, pad + 12);
    g.restore();

    if (PLOT.overlay && PLOT.overlay.type === "area" && PLOT.node){
      var a = Math.min(PLOT.overlay.a, PLOT.overlay.b), b = Math.max(PLOT.overlay.a, PLOT.overlay.b);
      g.save(); g.globalAlpha = 0.22; g.fillStyle = accent;
      g.beginPath(); g.moveTo(X(a), Y(0));
      var i2, x2, v2, first = true;
      for (i2 = 0; i2 <= 300; i2++){
        x2 = a + (b - a) * i2 / 300; v2 = safeEval(PLOT.node, x2);
        if (!isFinite(v2)) continue;
        if (first){ g.lineTo(X(x2), Y(v2)); first = false; } else g.lineTo(X(x2), Y(v2));
      }
      g.lineTo(X(b), Y(0)); g.closePath(); g.fill(); g.restore();
    }

    if (PLOT.node){
      g.save();
      g.strokeStyle = accent; g.lineWidth = 2.4; g.lineJoin = "round";
      g.beginPath();
      var started = false, i3, x3, v3, px, py;
      for (i3 = 0; i3 <= 900; i3++){
        x3 = PLOT.xmin + (PLOT.xmax - PLOT.xmin) * i3 / 900;
        v3 = safeEval(PLOT.node, x3);
        if (!isFinite(v3) || v3 < PLOT.ymin - (PLOT.ymax - PLOT.ymin) || v3 > PLOT.ymax + (PLOT.ymax - PLOT.ymin)){ started = false; continue; }
        px = X(x3); py = Y(v3);
        if (!started){ g.moveTo(px, py); started = true; } else g.lineTo(px, py);
      }
      g.stroke(); g.restore();
    }

    /* 导数曲线（开关打开时叠加，粉色） */
    if (PLOT.showDeriv && PLOT.node){
      var dn = null;
      try { dn = C.deriv(PLOT.node); } catch (e){ dn = null; }
      if (dn){
        g.save();
        g.strokeStyle = "#f06595"; g.lineWidth = 2; g.lineJoin = "round";
        g.beginPath();
        var st2 = false, i4, x4, v4, qx, qy, span2 = PLOT.ymax - PLOT.ymin;
        for (i4 = 0; i4 <= 900; i4++){
          x4 = PLOT.xmin + (PLOT.xmax - PLOT.xmin) * i4 / 900;
          v4 = safeEval(dn, x4);
          if (!isFinite(v4) || v4 < PLOT.ymin - span2 || v4 > PLOT.ymax + span2){ st2 = false; continue; }
          qx = X(x4); qy = Y(v4);
          if (!st2){ g.moveTo(qx, qy); st2 = true; } else g.lineTo(qx, qy);
        }
        g.stroke(); g.restore();
      }
    }
    if (PLOT.overlay && PLOT.overlay.type === "tangent" && isFinite(PLOT.overlay.k)){
      var o = PLOT.overlay;
      g.save(); g.strokeStyle = "#f06595"; g.lineWidth = 2; g.setLineDash([6, 5]);
      g.beginPath();
      g.moveTo(X(PLOT.xmin), Y(o.y0 + o.k * (PLOT.xmin - o.a)));
      g.lineTo(X(PLOT.xmax), Y(o.y0 + o.k * (PLOT.xmax - o.a)));
      g.stroke();
      g.setLineDash([]); g.fillStyle = "#f06595";
      g.beginPath(); g.arc(X(o.a), Y(o.y0), 4.5, 0, 6.284); g.fill();
      g.restore();
    }

    if (PLOT.overlay && PLOT.overlay.type === "limit" && typeof PLOT.overlay.L === "number" && isFinite(PLOT.overlay.L)){
      var o2 = PLOT.overlay;
      g.save();
      g.strokeStyle = "#f06595"; g.lineWidth = 1.6; g.setLineDash([5, 4]);
      g.beginPath(); g.moveTo(X(o2.a), Y(o2.L)); g.lineTo(X(o2.a), Y(PLOT.ymin <= 0 && PLOT.ymax >= 0 ? 0 : PLOT.ymin)); g.stroke();
      g.beginPath(); g.moveTo(X(o2.a), Y(o2.L)); g.lineTo(X(PLOT.xmin <= 0 && PLOT.xmax >= 0 ? 0 : PLOT.xmin), Y(o2.L)); g.stroke();
      g.setLineDash([]); g.fillStyle = "#f06595";
      g.beginPath(); g.arc(X(o2.a), Y(o2.L), 5.5, 0, 6.284); g.fill();
      g.restore();
    }

    el("plotinfo").innerHTML = (PLOT.label || "算完之后，这里会标出极限点 / 切线 / 面积。")
      + (PLOT.showDeriv ? '<br><span style="color:#f06595">粉色曲线是 f′(x)</span>' : "");
  }

  /* ---------- 运算选择：先选，再按「计算」 ---------- */
  function selectOp(op){
    S.op = op;
    Array.prototype.forEach.call(document.querySelectorAll("[data-op]"), function(x){
      x.classList.toggle("on", x.getAttribute("data-op") === op);
    });
    var info = OPDEF[op];
    el("ophint").textContent = info ? info.hint : "";
  }
  function runCalc(){
    var op = S.op;
    if (op === "limBoth") runLimit("both");
    else if (op === "limLeft") runLimit("left");
    else if (op === "limRight") runLimit("right");
    else if (op === "limPosInf"){ if (el("limA")) el("limA").value = "inf"; runLimit("both"); }
    else if (op === "limNegInf"){ if (el("limA")) el("limA").value = "-inf"; runLimit("both"); }
    else if (op === "d1") runDeriv(1);
    else if (op === "d2") runDeriv(2);
    else if (op === "taylor") runTaylor();
    else if (op === "integ") runInteg();
    else if (op === "defint") runDefint();
  }
  // 事件委托：运算按钮是 renderChrome() 之后才注入的，
  // 直接给按钮绑事件会绑在空集合上（这正是之前的 bug），所以绑在容器上。
  el("opsArea").addEventListener("click", function(e){
    var node = e.target;
    while (node && node !== this && !(node.getAttribute && node.getAttribute("data-op"))) node = node.parentNode;
    if (node && node !== this && node.getAttribute) selectOp(node.getAttribute("data-op"));
  });
  el("calcBtn").addEventListener("click", runCalc);

  /* ---------- 输入框下面的符号面板 ---------- */
  var SYMS = [
    { t: "x", v: "x" }, { t: "+", v: "+" }, { t: "−", v: "-" }, { t: "×", v: "*" }, { t: "÷", v: "/" },
    { t: "^", v: "^" }, { t: "(", v: "(" }, { t: ")", v: ")" }, { t: "x²", v: "^2" },
    { t: "π", v: "pi" }, { t: "e", v: "e" }, { t: "e^x", v: "e^" },
    { t: "sin", v: "sin(", fn: true }, { t: "cos", v: "cos(", fn: true }, { t: "tan", v: "tan(", fn: true },
    { t: "csc", v: "csc(", fn: true }, { t: "sec", v: "sec(", fn: true }, { t: "cot", v: "cot(", fn: true },
    { t: "arcsin", v: "asin(", fn: true }, { t: "arccos", v: "acos(", fn: true }, { t: "arctan", v: "atan(", fn: true },
    { t: "ln", v: "ln(", fn: true }, { t: "√", v: "sqrt(", fn: true }, { t: "|x|", v: "abs(", fn: true }
  ];
  SYMS.forEach(function(s){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = s.t;
    if (s.fn) b.className = "fn";
    b.addEventListener("click", function(){ insertSym(s.v); });
    el("syms").appendChild(b);
  });
  function insertSym(v){
    var inp = el("fx"), s = inp.selectionStart, e = inp.selectionEnd, val = inp.value;
    if (typeof s !== "number"){ inp.value = val + v; s = val.length; }
    else inp.value = val.slice(0, s) + v + val.slice(e);
    var caret = s + v.length;
    inp.focus();
    try { inp.setSelectionRange(caret, caret); } catch (err) {}
    var n = preview();
    PLOT.node = n;
    if (n){ autoY(); plotDraw(); }
  }

  /* ---------- 例子（按钮上显示好看的写法，点进去插入可解析的原始写法） ---------- */
  var EXAMPLES = [
    { src: "sin(x)/x",        label: "sin x / x" },
    { src: "(x^2-1)/(x-1)",   label: "(x<sup>2</sup>−1)/(x−1)" },
    { src: "(1-cos(x))/x^2",  label: "(1−cos x)/x<sup>2</sup>" },
    { src: "1/x",             label: "1/x" },
    { src: "abs(x)/x",        label: "|x|/x" },
    { src: "x*sin(1/x)",      label: "x·sin(1/x)" },
    { src: "x^2",             label: "x<sup>2</sup>" },
    { src: "x^2*e^x",         label: "x<sup>2</sup>·e<sup>x</sup>" },
    { src: "e^(-x^2)",        label: "e<sup>−x<sup>2</sup></sup>" },
    { src: "1/(1+x^2)",       label: "1/(1+x<sup>2</sup>)" },
    { src: "ln(x)",           label: "ln x" },
    { src: "x*cot(x)",        label: "x·cot x" }
  ];
  EXAMPLES.forEach(function(s){
    var b = document.createElement("button");
    b.className = "chip"; b.innerHTML = s.label;
    b.title = s.src;
    b.addEventListener("click", function(){
      el("fx").value = s.src;
      var n = preview();
      PLOT.node = n; PLOT.overlay = null; PLOT.label = "";
      if (n){ PLOT.xmin = -6; PLOT.xmax = 6; autoY(); plotDraw(); }
    });
    el("examples").appendChild(b);
  });

  el("fx").addEventListener("input", function(){
    var n = preview();
    PLOT.node = n;
    if (n){ autoY(); plotDraw(); }
  });
  el("fx").addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); runCalc(); } });
  el("fxClear").addEventListener("click", function(){
    el("fx").value = ""; el("fxinfo").textContent = ""; show("");
    PLOT.node = null; PLOT.overlay = null; PLOT.label = ""; plotDraw();
  });
  document.addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;
    var id = e.target && e.target.id;
    if (id === "limA" || id === "order" || id === "intA" || id === "intB"){ e.preventDefault(); runCalc(); }
  });

  el("plotFit").addEventListener("click", function(){ PLOT.xmin = -6; PLOT.xmax = 6; autoY(); plotDraw(); });
  el("plotDeriv").addEventListener("click", function(){
    PLOT.showDeriv = !PLOT.showDeriv;
    this.textContent = PLOT.showDeriv ? "导数曲线：开" : "导数曲线";
    this.style.fontWeight = PLOT.showDeriv ? "600" : "";
    plotDraw();
  });
  el("plotA").addEventListener("click", function(){ var p = readPoint(el("limA"), "a"); plotWindowAround(p.bad || !isFinite(p.num) ? 0 : p.num); plotDraw(); });
  el("copy").addEventListener("click", function(){
    var txt = lastReport || (el("out").textContent || "").trim();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ flash("已复制"); }, function(){ flash("复制失败"); });
    } else flash("不支持复制");
  });
  function flash(t){ var b = el("copy"); b.textContent = t; setTimeout(function(){ b.textContent = "复制结果"; }, 1200); }

  /* ---------- 皮肤 ---------- */
  var THEME = {
    glass: { color: "#080c18", bar: "black-translucent" },
    light: { color: "#f2f2f7", bar: "default" },
    brutal: { color: "#fdf1dd", bar: "default" },
    ark: { color: "#0b0b0c", bar: "black-translucent" },
    neon: { color: "#07060f", bar: "black-translucent" },
    mono: { color: "#000000", bar: "black-translucent" }
  };
  function applySkin(s){
    document.documentElement.setAttribute("data-skin", s);
    Array.prototype.forEach.call(document.querySelectorAll("#skins button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-skin-set") === s);
    });
    try { localStorage.setItem("la-skin-v3", s); } catch (e) {}
    var T = THEME[s] || THEME.light;
    var mc = document.querySelector('meta[name="theme-color"]');
    if (mc) mc.setAttribute("content", T.color);
    var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (sb) sb.setAttribute("content", T.bar);
    plotDraw();
  }
  Array.prototype.forEach.call(document.querySelectorAll("#skins button"), function(b){
    b.addEventListener("click", function(){ applySkin(b.getAttribute("data-skin-set")); });
  });
  window.addEventListener("resize", plotDraw);

  /* ---------- 启动 ---------- */
  var SKINS = ["glass", "light", "brutal", "ark", "neon", "mono"], saved = "light";
  try {
    var q = new URLSearchParams(location.search).get("skin");
    saved = q || localStorage.getItem("la-skin-v3") || "ark";
  } catch (e) {}
  if (SKINS.indexOf(saved) < 0) saved = "ark";
  applySkin(saved);

  selectOp(PAGES[PAGE_ID].groups[0].ops[0]);
  PLOT.node = preview();
  autoY();
  plotDraw();
})();

/* ===== 动效层 JS ===== */
(function(){
  var root = document.documentElement;
  root.classList.remove("dsh-leaving");
  window.addEventListener("pageshow", function(){ root.classList.remove("dsh-leaving"); });
  document.addEventListener("click", function(e){
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!a) return;
    if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var href = a.getAttribute("href") || "";
    if (href.indexOf(".html") < 0) return;
    if (/^[a-z]+:/i.test(href) || a.target === "_blank") return;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    e.preventDefault();
    root.classList.add("dsh-leaving");
    setTimeout(function(){ location.href = href; }, 165);
  }, true);
})();
</script>
</body>
