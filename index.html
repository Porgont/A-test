<!doctype html>
<html lang="zh-CN" data-skin="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080c18">
<title>线代计算器</title>
<style>
:root{
  --radius:18px; --card-bw:1px; --input-bw:1px; --blur:none; --shadow:none; --skin-bw:0;
  --track:rgba(130,130,140,.16);
  --danger:#ff6b6b;
}
:root[data-skin="glass"]{
  --bg:#080c18;
  --bg-image:
    radial-gradient(880px 520px at 10% -10%, rgba(94,234,212,.20), transparent 62%),
    radial-gradient(820px 520px at 102% 2%, rgba(129,140,248,.26), transparent 64%),
    radial-gradient(700px 460px at 50% 112%, rgba(236,72,153,.14), transparent 62%);
  --fg:#e9efff; --fg-dim:rgba(233,239,255,.52);
  --card:rgba(255,255,255,.055); --card-border:rgba(255,255,255,.13);
  --blur:blur(18px); --shadow:0 12px 34px rgba(0,0,0,.34);
  --input-bg:rgba(255,255,255,.06); --input-border:rgba(255,255,255,.12);
  --chip:rgba(255,255,255,.06); --chip-border:rgba(255,255,255,.12);
  --chip-on-bg:linear-gradient(135deg,#5eead4,#818cf8); --chip-on-fg:#08101f;
  --chip-on-shadow:0 6px 18px rgba(129,140,248,.35);
  --accent-line:rgba(129,140,248,.85); --focus-ring:rgba(129,140,248,.22);
  --btn-bg:linear-gradient(135deg,#5eead4,#818cf8); --btn-fg:#07101d;
  --btn-shadow:0 10px 26px rgba(129,140,248,.32);
  --mark:linear-gradient(135deg,#5eead4,#818cf8); --mark-fg:#08101f;
  --logo-shadow:0 6px 18px rgba(129,140,248,.35);
}
:root[data-skin="light"]{
  --bg:#f2f2f7; --bg-image:none;
  --fg:#101014; --fg-dim:#8a8a92;
  --card:#ffffff; --card-border:rgba(0,0,0,.06);
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  --track:#e6e6ec;
  --input-bg:#f5f5f8; --input-border:rgba(0,0,0,.07);
  --chip:#ececf1; --chip-border:transparent;
  --chip-on-bg:#0a84ff; --chip-on-fg:#ffffff;
  --chip-on-shadow:0 6px 16px rgba(10,132,255,.30);
  --accent-line:#0a84ff; --focus-ring:rgba(10,132,255,.16);
  --btn-bg:linear-gradient(135deg,#0a84ff,#0060df); --btn-fg:#ffffff;
  --btn-shadow:0 10px 24px rgba(10,132,255,.28);
  --mark:linear-gradient(135deg,#0a84ff,#5e5ce6); --mark-fg:#ffffff;
  --logo-shadow:0 6px 16px rgba(10,132,255,.30);
  --danger:#e5484d;
}
:root[data-skin="brutal"]{
  --bg:#fdf1dd; --bg-image:none;
  --fg:#141414; --fg-dim:#6f6656;
  --card:#fffdf8; --card-border:#141414; --card-bw:2px; --input-bw:2px; --radius:14px; --skin-bw:2px;
  --shadow:6px 6px 0 #141414; --track:#fffdf8;
  --input-bg:#ffffff; --input-border:#141414;
  --chip:#ffffff; --chip-border:#141414;
  --chip-on-bg:#ffd23f; --chip-on-fg:#141414; --chip-on-shadow:3px 3px 0 #141414;
  --accent-line:#141414; --focus-ring:rgba(255,210,63,.55);
  --btn-bg:#ff5c4d; --btn-fg:#141414; --btn-shadow:4px 4px 0 #141414;
  --mark:#ffd23f; --mark-fg:#141414; --logo-shadow:none;
  --danger:#c22f22;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 15px max(30px,env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  transition:background .25s ease,color .25s ease;
}
body::before{content:"";position:fixed;inset:0;background-image:var(--bg-image);pointer-events:none;z-index:0}
[hidden]{display:none !important}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--mark);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:var(--mark-fg);flex:0 0 auto;box-shadow:var(--logo-shadow)}
h1{font-size:17px;margin:0;letter-spacing:.01em}
.sub{margin:2px 0 0;font-size:11.5px;color:var(--fg-dim);letter-spacing:.04em}
.skins{display:flex;gap:3px;padding:3px;background:var(--track);border-radius:999px;border:var(--skin-bw) solid var(--card-border)}
.skins button{border:0;background:transparent;color:var(--fg-dim);font:inherit;font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;transition:.18s}
.skins button.on{background:var(--chip-on-bg);color:var(--chip-on-fg);font-weight:600}
.card{background:var(--card);border:var(--card-bw) solid var(--card-border);border-radius:var(--radius);padding:13px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow);transition:opacity .2s ease}
.card.idle{opacity:.42}
.chead{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.mtag{width:28px;height:28px;border-radius:9px;background:var(--mark);color:var(--mark-fg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto}
.dims{display:flex;align-items:center;gap:6px}
.dim{display:flex;align-items:center;gap:2px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:9px;padding:1px}
.dim b{min-width:18px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.st{border:0;background:transparent;color:var(--fg-dim);font:inherit;font-size:15px;line-height:1;width:24px;height:26px;border-radius:7px;cursor:pointer}
.st:active{background:var(--chip)}
.x{color:var(--fg-dim);font-size:12px}
.tools{margin-left:auto;display:flex;gap:5px}
.tools button{border:1px solid var(--input-border);background:var(--chip);color:var(--fg);font:inherit;font-size:12px;padding:5px 9px;border-radius:8px;cursor:pointer;transition:.16s}
.tools button:active{transform:translateY(1px)}
.note{font-size:11.5px;color:var(--fg-dim)}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:7px}
.grid input{width:100%;min-width:0;padding:10px 4px;text-align:center;font:inherit;font-size:15.5px;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--input-bg);border:var(--input-bw) solid var(--input-border);border-radius:10px;outline:none;transition:.16s}
.grid input::placeholder{color:var(--fg-dim);opacity:.55}
.grid input:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--focus-ring)}
.glabel{font-size:11px;color:var(--fg-dim);letter-spacing:.12em;margin:2px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{border:1px solid var(--chip-border);background:var(--chip);color:var(--fg);font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;cursor:pointer;transition:.16s}
.chip:active{transform:translateY(1px)}
.chip.on{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:transparent;font-weight:600;box-shadow:var(--chip-on-shadow)}
.kbox{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--fg-dim);border:1px solid var(--input-border);border-radius:999px;padding:4px 10px}
.kbox input{width:52px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:13px;outline:none}
.hint{font-size:12px;color:var(--fg-dim);margin:0 0 10px;min-height:15px}
.run{width:100%;border:0;border-radius:13px;padding:14px;background:var(--btn-bg);color:var(--btn-fg);font:inherit;font-size:15px;font-weight:650;letter-spacing:.16em;cursor:pointer;box-shadow:var(--btn-shadow);transition:transform .12s ease}
.run:active{transform:translateY(1px)}
.rtitle{font-size:13px;font-weight:600;letter-spacing:.02em}
#out{min-height:52px}
.empty{color:var(--fg-dim);font-size:13px;margin:14px 0;text-align:center}
.rgrid{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:6px}
.rgrid.vec{max-width:160px}
.rcell{background:var(--input-bg);border:1px solid var(--input-border);border-radius:9px;padding:9px 3px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums;word-break:break-all}
.scalar{font-size:27px;font-weight:700;text-align:center;padding:12px 0;font-variant-numeric:tabular-nums}
.roots{display:flex;flex-direction:column;gap:8px}
.root{display:flex;align-items:center;gap:10px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 12px;font-size:16px;font-variant-numeric:tabular-nums}
.root .idx{font-size:12px;color:var(--fg-dim);min-width:22px}
.msg{font-size:13px;color:var(--fg-dim);margin:6px 0}
.msgerr{font-size:13px;color:var(--danger);margin:8px 0;line-height:1.55}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.06;font-size:.9em;margin:0 1px}
.frac .fd{border-top:1.4px solid currentColor;padding:0 .2em}
.frac .fn{padding:0 .2em}
.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
.foot{font-size:11.5px;color:var(--fg-dim);text-align:center;margin:4px 0 0;line-height:1.6}
@media (max-width:420px){h1{font-size:16px}.sub{display:none}.chip{font-size:12.5px;padding:7px 11px}.card{padding:11px}}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <span class="logo">Σ</span>
      <div><h1>线代计算器</h1><p class="sub">矩阵 · 方程组 · 特征值</p></div>
    </div>
    <div class="skins" id="skins">
      <button data-skin-set="glass" class="on">玻璃</button>
      <button data-skin-set="light">极简</button>
      <button data-skin-set="brutal">粗野</button>
    </div>
  </header>

  <section class="card" id="cardA">
    <div class="chead">
      <span class="mtag">A</span>
      <div class="dims">
        <div class="dim"><button class="st" data-k="A" data-axis="r" data-d="-1">−</button><b id="dA-r">3</b><button class="st" data-k="A" data-axis="r" data-d="1">+</button></div>
        <span class="x">×</span>
        <div class="dim"><button class="st" data-k="A" data-axis="c" data-d="-1">−</button><b id="dA-c">3</b><button class="st" data-k="A" data-axis="c" data-d="1">+</button></div>
      </div>
      <div class="tools">
        <button data-fill="A:eye">I</button>
        <button data-fill="A:zero">0</button>
        <button data-fill="A:rand">随机</button>
      </div>
    </div>
    <div class="grid" id="gridA" style="--cols:3"></div>
  </section>

  <section class="card idle" id="cardB">
    <div class="chead">
      <span class="mtag">B</span>
      <div class="dims">
        <div class="dim"><button class="st" data-k="B" data-axis="r" data-d="-1">−</button><b id="dB-r">3</b><button class="st" data-k="B" data-axis="r" data-d="1">+</button></div>
        <span class="x">×</span>
        <div class="dim"><button class="st" data-k="B" data-axis="c" data-d="-1">−</button><b id="dB-c">3</b><button class="st" data-k="B" data-axis="c" data-d="1">+</button></div>
      </div>
      <span class="note" id="noteB"></span>
      <div class="tools">
        <button data-fill="B:eye">I</button>
        <button data-fill="B:zero">0</button>
        <button data-fill="B:rand">随机</button>
      </div>
    </div>
    <div class="grid" id="gridB" style="--cols:3"></div>
  </section>

  <section class="card">
    <div class="glabel">基本运算</div>
    <div class="chips" id="g1">
      <button class="chip on" data-op="add">A + B</button>
      <button class="chip" data-op="sub">A − B</button>
      <button class="chip" data-op="mul">A × B</button>
      <button class="chip" data-op="kA">k · A</button>
      <label class="kbox" id="kbox" hidden>k = <input id="kval" value="2" inputmode="text" autocomplete="off"></label>
    </div>
    <div class="glabel">单个矩阵</div>
    <div class="chips" id="g2">
      <button class="chip" data-op="trans">Aᵀ</button>
      <button class="chip" data-op="det">det A</button>
      <button class="chip" data-op="inv">A⁻¹</button>
      <button class="chip" data-op="rank">rank A</button>
      <button class="chip" data-op="trace">tr A</button>
      <button class="chip" data-op="rref">RREF A</button>
    </div>
    <div class="glabel">方程与特征</div>
    <div class="chips" id="g3">
      <button class="chip" data-op="solve">解 Ax = b</button>
      <button class="chip" data-op="eig">特征值 A</button>
    </div>
    <p class="hint" id="ophint"></p>
    <button class="run" id="run">计 算</button>
  </section>

  <section class="card">
    <div class="chead">
      <span class="rtitle" id="rlabel">结果</span>
      <div class="tools">
        <button id="dec">小数</button>
        <button id="copy">复制</button>
      </div>
    </div>
    <div id="out"><p class="empty">选一个运算，然后点「计算」。</p></div>
  </section>

  <p class="foot">输入支持分数，例如 −3/4、1.25；结果默认给精确分数。</p>
</div>

<script>
/* ==== ENGINE START ==== */
const LinAlg = (function(){
  "use strict";
  var ZERO = null, ONE = null, TWO = null;

  function bigAbs(x){ return x < 0n ? -x : x; }
  function bigGcd(a, b){ a = bigAbs(a); b = bigAbs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
  function isqrt(n){
    if (n < 0n) throw new Error("负数不能开平方");
    if (n < 2n) return n;
    var x = n, y = (x + 1n) / 2n;
    while (y < x) { x = y; y = (x + n / x) / 2n; }
    return x;
  }
  function perfectSqrt(n){ if (n < 0n) return null; var r = isqrt(n); return r * r === n ? r : null; }

  function parseDecimal(s){
    s = String(s).trim();
    var m = /^([+-]?)(\d*)(?:\.(\d*))?(?:[eE]([+-]?\d+))?$/.exec(s);
    if (!m || (m[2] === "" && (m[3] === undefined || m[3] === ""))) throw new Error("无法解析数字：" + s);
    var sign = m[1] === "-" ? -1n : 1n;
    var ip = m[2] || "0";
    var fp = m[3] || "";
    var ex = m[4] ? parseInt(m[4], 10) : 0;
    var num = BigInt(ip + fp) * sign;
    var den = 10n ** BigInt(fp.length);
    if (ex > 0) num *= 10n ** BigInt(ex);
    else if (ex < 0) den *= 10n ** BigInt(-ex);
    return new Frac(num, den);
  }

  function F(x){
    if (x instanceof Frac) return x;
    if (typeof x === "bigint") return new Frac(x);
    if (typeof x === "number"){
      if (!isFinite(x)) throw new Error("无效数字");
      return parseDecimal(String(x));
    }
    if (typeof x === "string"){
      var s = x.trim().replace(/\s+/g, "").replace(/−/g, "-").replace(/／/g, "/");
      if (s === "" || s === "+" || s === "-") return ZERO;
      if (s.indexOf("/") >= 0){
        var parts = s.split("/");
        if (parts.length !== 2 || parts[0] === "" || parts[1] === "") throw new Error("分数格式不对：" + x);
        var a = F(parts[0]), b = F(parts[1]);
        if (b.n === 0n) throw new Error("分母不能为 0");
        return new Frac(a.n * b.d, a.d * b.n);
      }
      return parseDecimal(s);
    }
    throw new Error("无效数字");
  }

  function Frac(n, d){
    n = BigInt(n);
    d = (d === undefined) ? 1n : BigInt(d);
    if (d === 0n) throw new Error("分母不能为 0");
    if (d < 0n) { n = -n; d = -d; }
    var g = bigGcd(n, d);
    if (g > 1n) { n /= g; d /= g; }
    this.n = n; this.d = d;
  }
  Frac.prototype.add = function(o){ o = F(o); return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); };
  Frac.prototype.sub = function(o){ o = F(o); return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); };
  Frac.prototype.mul = function(o){ o = F(o); return new Frac(this.n * o.n, this.d * o.d); };
  Frac.prototype.div = function(o){
    o = F(o);
    if (o.n === 0n) throw new Error("不能除以 0");
    return new Frac(this.n * o.d, this.d * o.n);
  };
  Frac.prototype.neg = function(){ return new Frac(-this.n, this.d); };
  Frac.prototype.inv = function(){ if (this.n === 0n) throw new Error("0 没有倒数"); return new Frac(this.d, this.n); };
  Frac.prototype.isZero = function(){ return this.n === 0n; };
  Frac.prototype.sign = function(){ return this.n < 0n ? -1 : (this.n > 0n ? 1 : 0); };
  Frac.prototype.eq = function(o){ o = F(o); return this.n === o.n && this.d === o.d; };
  Frac.prototype.toNumber = function(){ return Number(this.n) / Number(this.d); };
  Frac.prototype.toString = function(){ return this.d === 1n ? String(this.n) : (this.n + "/" + this.d); };

  ZERO = new Frac(0n); ONE = new Frac(1n); TWO = new Frac(2n);

  function shape(M){
    if (!Array.isArray(M) || M.length === 0) throw new Error("矩阵不能为空");
    var c = M[0].length;
    for (var i = 0; i < M.length; i++){
      if (!Array.isArray(M[i]) || M[i].length !== c) throw new Error("矩阵每一行的列数要相同");
    }
    return [M.length, c];
  }
  function clone(M){ return M.map(function(r){ return r.slice(); }); }
  function sameShape(a, b){ return a[0] === b[0] && a[1] === b[1]; }
  function sizeStr(s){ return s[0] + "×" + s[1]; }

  function matAdd(A, B){
    var sa = shape(A), sb = shape(B);
    if (!sameShape(sa, sb)) throw new Error("尺寸不同：" + sizeStr(sa) + " 与 " + sizeStr(sb));
    return A.map(function(r, i){ return r.map(function(v, j){ return v.add(B[i][j]); }); });
  }
  function matSub(A, B){
    var sa = shape(A), sb = shape(B);
    if (!sameShape(sa, sb)) throw new Error("尺寸不同：" + sizeStr(sa) + " 与 " + sizeStr(sb));
    return A.map(function(r, i){ return r.map(function(v, j){ return v.sub(B[i][j]); }); });
  }
  function matMul(A, B){
    var sa = shape(A), sb = shape(B);
    if (sa[1] !== sb[0]) throw new Error("A 的列数（" + sa[1] + "）要等于 B 的行数（" + sb[0] + "）");
    var R = [];
    for (var i = 0; i < sa[0]; i++){
      var row = [];
      for (var j = 0; j < sb[1]; j++){
        var s = ZERO;
        for (var k = 0; k < sa[1]; k++) s = s.add(A[i][k].mul(B[k][j]));
        row.push(s);
      }
      R.push(row);
    }
    return R;
  }
  function scaleMat(A, k){ k = F(k); return A.map(function(r){ return r.map(function(v){ return v.mul(k); }); }); }
  function transpose(A){
    var s = shape(A), R = [];
    for (var j = 0; j < s[1]; j++){
      var row = [];
      for (var i = 0; i < s[0]; i++) row.push(A[i][j]);
      R.push(row);
    }
    return R;
  }
  function trace(A){
    var s = shape(A);
    if (s[0] !== s[1]) throw new Error("迹要求方阵");
    var t = ZERO;
    for (var i = 0; i < s[0]; i++) t = t.add(A[i][i]);
    return t;
  }
  function det(M){
    var s = shape(M), n = s[0];
    if (n !== s[1]) throw new Error("行列式要求方阵");
    if (n === 1) return M[0][0];
    var A = clone(M), sign = 1n, prev = ONE;
    for (var k = 0; k < n - 1; k++){
      if (A[k][k].isZero()){
        var p = -1;
        for (var i = k + 1; i < n; i++) if (!A[i][k].isZero()) { p = i; break; }
        if (p < 0) return ZERO;
        var t = A[k]; A[k] = A[p]; A[p] = t;
        sign = -sign;
      }
      for (var r = k + 1; r < n; r++){
        for (var c = k + 1; c < n; c++){
          A[r][c] = A[r][c].mul(A[k][k]).sub(A[r][k].mul(A[k][c])).div(prev);
        }
      }
      prev = A[k][k];
    }
    var d = A[n - 1][n - 1];
    return sign < 0n ? d.neg() : d;
  }
  function rref(M){
    var A = clone(M), s = shape(A), rows = s[0], cols = s[1];
    var r = 0, pivots = [];
    for (var c = 0; c < cols && r < rows; c++){
      var p = -1;
      for (var i = r; i < rows; i++) if (!A[i][c].isZero()) { p = i; break; }
      if (p < 0) continue;
      var t = A[r]; A[r] = A[p]; A[p] = t;
      var pv = A[r][c];
      for (var j = 0; j < cols; j++) A[r][j] = A[r][j].div(pv);
      for (var i2 = 0; i2 < rows; i2++){
        if (i2 === r) continue;
        var f = A[i2][c];
        if (f.isZero()) continue;
        for (var j2 = 0; j2 < cols; j2++) A[i2][j2] = A[i2][j2].sub(f.mul(A[r][j2]));
      }
      pivots.push(c);
      r++;
    }
    return { R: A, rank: r, pivots: pivots };
  }
  function rank(M){ return rref(M).rank; }
  function inverse(M){
    var s = shape(M), n = s[0];
    if (n !== s[1]) throw new Error("求逆要求方阵");
    var A = clone(M), I = [];
    for (var i = 0; i < n; i++){
      var row = [];
      for (var j = 0; j < n; j++) row.push(i === j ? ONE : ZERO);
      I.push(row);
    }
    for (var c = 0; c < n; c++){
      var p = -1;
      for (var i2 = c; i2 < n; i2++) if (!A[i2][c].isZero()) { p = i2; break; }
      if (p < 0) throw new Error("矩阵不可逆（行列式为 0）");
      if (p !== c){
        var t = A[c]; A[c] = A[p]; A[p] = t;
        var t2 = I[c]; I[c] = I[p]; I[p] = t2;
      }
      var pv = A[c][c];
      for (var j = 0; j < n; j++){ A[c][j] = A[c][j].div(pv); I[c][j] = I[c][j].div(pv); }
      for (var i3 = 0; i3 < n; i3++){
        if (i3 === c) continue;
        var f = A[i3][c];
        if (f.isZero()) continue;
        for (var j3 = 0; j3 < n; j3++){
          A[i3][j3] = A[i3][j3].sub(f.mul(A[c][j3]));
          I[i3][j3] = I[i3][j3].sub(f.mul(I[c][j3]));
        }
      }
    }
    return I;
  }
  function solve(A, b){
    var s = shape(A);
    shape(b);
    if (b[0].length !== 1) throw new Error("b 要是一列（列数 1）");
    if (b.length !== s[0]) throw new Error("b 的行数要等于 A 的行数（" + s[0] + "）");
    var cols = s[1];
    var aug = A.map(function(r, i){ return r.concat([b[i][0]]); });
    var res = rref(aug), R = res.R, piv = res.pivots, rk = res.rank;
    for (var i = 0; i < R.length; i++){
      var zero = true;
      for (var j = 0; j < cols; j++) if (!R[i][j].isZero()) { zero = false; break; }
      if (zero && !R[i][cols].isZero()) return { type: "none" };
    }
    var x = [];
    for (var j2 = 0; j2 < cols; j2++) x.push(ZERO);
    piv.forEach(function(c, idx){ x[c] = R[idx][cols]; });
    if (rk < cols) return { type: "infinite", free: cols - rk, x: x };
    return { type: "unique", x: x };
  }

  function numMat(A){ return A.map(function(r){ return r.map(function(v){ return v.toNumber(); }); }); }
  function idNum(n){ var M = []; for (var i = 0; i < n; i++){ var r = []; for (var j = 0; j < n; j++) r.push(i === j ? 1 : 0); M.push(r); } return M; }
  function mulNum(A, B){
    var n = A.length, m = B[0].length, k = B.length, R = [];
    for (var i = 0; i < n; i++){
      var r = [];
      for (var j = 0; j < m; j++){ var s = 0; for (var t = 0; t < k; t++) s += A[i][t] * B[t][j]; r.push(s); }
      R.push(r);
    }
    return R;
  }
  function charPoly(A){
    var n = A.length, M = numMat(A), Mk = idNum(n), coef = [];
    for (var k = 1; k <= n; k++){
      Mk = mulNum(M, Mk);
      var tr = 0;
      for (var i = 0; i < n; i++) tr += Mk[i][i];
      var ck = -tr / k;
      coef.push(ck);
      for (var i2 = 0; i2 < n; i2++) Mk[i2][i2] += ck;
    }
    return coef;
  }
  function durandKerner(coef){
    var n = coef.length;
    if (n === 0) return [];
    var p = [1].concat(coef);
    function evalP(z){
      var vr = p[0], vi = 0;
      for (var i = 1; i < p.length; i++){
        var nr = vr * z.re - vi * z.im + p[i];
        var ni = vr * z.im + vi * z.re;
        vr = nr; vi = ni;
      }
      return { re: vr, im: vi };
    }
    var cur = { re: 1, im: 0 }, seed = { re: 0.4, im: 0.9 }, roots = [];
    for (var k = 0; k < n; k++){
      roots.push({ re: cur.re, im: cur.im });
      var nr = cur.re * seed.re - cur.im * seed.im;
      var ni = cur.re * seed.im + cur.im * seed.re;
      cur = { re: nr, im: ni };
    }
    for (var iter = 0; iter < 400; iter++){
      var maxd = 0;
      for (var i = 0; i < n; i++){
        var num = evalP(roots[i]);
        var dr = 1, di = 0;
        for (var j = 0; j < n; j++){
          if (j === i) continue;
          var ar = roots[i].re - roots[j].re, ai = roots[i].im - roots[j].im;
          var q = dr * ar - di * ai, q2 = dr * ai + di * ar;
          dr = q; di = q2;
        }
        var den = dr * dr + di * di;
        if (den === 0) continue;
        var ur = (num.re * dr + num.im * di) / den;
        var ui = (num.im * dr - num.re * di) / den;
        roots[i] = { re: roots[i].re - ur, im: roots[i].im - ui };
        var mag = Math.sqrt(ur * ur + ui * ui);
        if (mag > maxd) maxd = mag;
      }
      if (maxd < 1e-15) break;
    }
    roots.forEach(function(r){
      if (Math.abs(r.re) < 1e-12) r.re = 0;
      if (Math.abs(r.im) < 1e-12) r.im = 0;
    });
    roots.sort(function(a, b){ return a.re !== b.re ? a.re - b.re : a.im - b.im; });
    return roots;
  }
  function eigen(A){
    var s = shape(A), n = s[0];
    if (n !== s[1]) throw new Error("特征值要求方阵");
    if (n === 1) return [{ re: A[0][0].toNumber(), im: 0, exact: A[0][0] }];
    if (n === 2){
      var a = A[0][0], b = A[0][1], c = A[1][0], d = A[1][1];
      var half = a.add(d).div(TWO);
      var disc = half.mul(half).sub(a.mul(d).sub(b.mul(c)));
      if (disc.sign() >= 0){
        var rn = perfectSqrt(disc.n), rd = perfectSqrt(disc.d);
        if (rn !== null && rd !== null){
          var sq = new Frac(rn, rd);
          return [
            { re: half.add(sq).toNumber(), im: 0, exact: half.add(sq) },
            { re: half.sub(sq).toNumber(), im: 0, exact: half.sub(sq) }
          ];
        }
      }
      var h = half.toNumber(), dd = disc.toNumber();
      if (dd >= 0){ var r0 = Math.sqrt(dd); return [{ re: h - r0, im: 0 }, { re: h + r0, im: 0 }]; }
      var r1 = Math.sqrt(-dd);
      return [{ re: h, im: -r1 }, { re: h, im: r1 }];
    }
    if (n > 4) throw new Error("特征值目前支持 1–4 阶");
    return durandKerner(charPoly(A));
  }

  return {
    Frac: Frac, F: F, ZERO: ZERO, ONE: ONE, TWO: TWO,
    shape: shape, matAdd: matAdd, matSub: matSub, matMul: matMul, scaleMat: scaleMat,
    transpose: transpose, trace: trace, det: det, rref: rref, rank: rank,
    inverse: inverse, solve: solve, eigen: eigen
  };
})();
/* ==== ENGINE END ==== */
</script>

<script>
(function(){
  "use strict";
  var L = LinAlg, F = L.F;

  var OPS = {
    add:   { label: "A + B", needB: true,  hint: "A 与 B 的行数、列数都要相同" },
    sub:   { label: "A − B", needB: true,  hint: "A 与 B 的行数、列数都要相同" },
    mul:   { label: "A × B", needB: true,  hint: "A 的列数要等于 B 的行数" },
    kA:    { label: "k · A", needB: false, hint: "k 填在右侧的小输入框里，可以是分数" },
    trans: { label: "Aᵀ",    needB: false, hint: "转置：行列互换" },
    det:   { label: "det A", needB: false, hint: "要求方阵" },
    inv:   { label: "A⁻¹",   needB: false, hint: "要求方阵，且行列式不为 0" },
    rank:  { label: "rank A", needB: false, hint: "矩阵的秩" },
    trace: { label: "tr A",  needB: false, hint: "要求方阵" },
    rref:  { label: "RREF A", needB: false, hint: "最简行阶梯形" },
    solve: { label: "Ax = b 的解", needB: true, hint: "把 B 做成只有 1 列，当作 b 向量" },
    eig:   { label: "A 的特征值", needB: false, hint: "要求方阵；2 阶给精确解，3–4 阶为数值解" }
  };

  var S = { A: { r: 3, c: 3 }, B: { r: 3, c: 3 }, op: "add", dec: false };
  var last = null;

  function el(id){ return document.getElementById(id); }
  function grid(k){ return el("grid" + k); }
  function ins(k){ return Array.prototype.slice.call(grid(k).querySelectorAll("input")); }

  function capture(k){
    var s = S[k], list = ins(k), out = [], i = 0;
    for (var y = 0; y < s.r; y++){
      var row = [];
      for (var x = 0; x < s.c; x++){ var node = list[i]; i++; row.push(node ? node.value : ""); }
      out.push(row);
    }
    grid(k)._vals = out;
    return out;
  }
  function build(k){
    var s = S[k], box = grid(k), vals = box._vals || [];
    box.innerHTML = "";
    box.style.setProperty("--cols", s.c);
    for (var y = 0; y < s.r; y++){
      for (var x = 0; x < s.c; x++){
        var inp = document.createElement("input");
        inp.type = "text";
        inp.inputMode = "text";
        inp.setAttribute("autocomplete", "off");
        inp.setAttribute("autocapitalize", "off");
        inp.spellcheck = false;
        inp.placeholder = "0";
        if (vals[y] && vals[y][x] !== undefined) inp.value = vals[y][x];
        inp.addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); run(); } });
        box.appendChild(inp);
      }
    }
    el("d" + k + "-r").textContent = s.r;
    el("d" + k + "-c").textContent = s.c;
  }
  function resize(k, axis, d){
    capture(k);
    var s = S[k], next = (axis === "r" ? s.r : s.c) + d;
    if (next < 1 || next > 6) return;
    if (axis === "r") s.r = next; else s.c = next;
    build(k);
  }
  function fill(k, kind){
    capture(k);
    var s = S[k], rows = [];
    for (var y = 0; y < s.r; y++){
      var row = [];
      for (var x = 0; x < s.c; x++){
        if (kind === "zero") row.push("0");
        else if (kind === "eye") row.push(y === x ? "1" : "0");
        else row.push(String(Math.floor(Math.random() * 11) - 5));
      }
      rows.push(row);
    }
    grid(k)._vals = rows;
    build(k);
  }
  function readMatrix(k){
    var s = S[k], list = ins(k), M = [], i = 0;
    for (var y = 0; y < s.r; y++){
      var row = [];
      for (var x = 0; x < s.c; x++){ var node = list[i]; i++; row.push(F(node ? node.value : "")); }
      M.push(row);
    }
    return M;
  }

  function fmtNum(x){
    if (!isFinite(x)) return String(x);
    if (Math.abs(x) < 1e-12) x = 0;
    var s = (Math.abs(x) >= 1e-6 || x === 0) ? x.toFixed(6) : x.toExponential(4);
    if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
    if (s === "-0") s = "0";
    return s;
  }
  function fracHTML(f){
    if (f.d === 1n) return String(f.n);
    var neg = f.n < 0n, n = neg ? -f.n : f.n;
    return (neg ? "−" : "") + '<span class="frac"><span class="fn">' + n + '</span><span class="fd">' + f.d + "</span></span>";
  }
  function cellHTML(f){ return S.dec ? fmtNum(f.toNumber()) : fracHTML(f); }
  function blockHTML(b){
    if (b.type === "matrix"){
      var c = b.data[0] ? b.data[0].length : 1;
      var h = '<div class="rgrid" style="--cols:' + c + '">';
      b.data.forEach(function(row){ row.forEach(function(v){ h += '<div class="rcell">' + cellHTML(v) + "</div>"; }); });
      return h + "</div>";
    }
    if (b.type === "vector"){
      var h2 = '<div class="rgrid vec" style="--cols:1">';
      b.data.forEach(function(v){ h2 += '<div class="rcell">' + cellHTML(v) + "</div>"; });
      return h2 + "</div>";
    }
    if (b.type === "scalar") return '<div class="scalar">' + cellHTML(b.data) + "</div>";
    if (b.type === "roots"){
      var h3 = '<div class="roots">';
      b.data.forEach(function(r, i){ h3 += '<div class="root"><span class="idx">λ' + (i + 1) + '</span>' + rootHTML(r) + "</div>"; });
      return h3 + "</div>";
    }
    return '<p class="' + (b.danger ? "msgerr" : "msg") + '">' + b.text + "</p>";
  }
  function rootHTML(r){
    if (r.exact && !S.dec) return fracHTML(r.exact);
    if (Math.abs(r.im) < 1e-9) return fmtNum(r.re);
    return fmtNum(r.re) + (r.im < 0 ? " − " : " + ") + fmtNum(Math.abs(r.im)) + "i";
  }
  function show(res){
    last = res;
    el("rlabel").textContent = res.label;
    var out = el("out");
    out.innerHTML = res.blocks.map(blockHTML).join("");
    out.classList.remove("pop");
    void out.offsetWidth;
    out.classList.add("pop");
  }
  function fail(msg){
    last = null;
    el("rlabel").textContent = OPS[S.op].label;
    el("out").innerHTML = '<p class="msgerr">' + msg + "</p>";
  }

  function run(){
    try{
      var op = S.op, o = OPS[op];
      var A = readMatrix("A");
      var B = o.needB ? readMatrix("B") : null;
      var res;
      if (op === "add") res = { label: "A + B", blocks: [{ type: "matrix", data: L.matAdd(A, B) }] };
      else if (op === "sub") res = { label: "A − B", blocks: [{ type: "matrix", data: L.matSub(A, B) }] };
      else if (op === "mul") res = { label: "A × B", blocks: [{ type: "matrix", data: L.matMul(A, B) }] };
      else if (op === "kA"){
        var k = F(el("kval").value);
        res = { label: k.toString() + " · A", blocks: [{ type: "matrix", data: L.scaleMat(A, k) }] };
      }
      else if (op === "trans") res = { label: "Aᵀ", blocks: [{ type: "matrix", data: L.transpose(A) }] };
      else if (op === "det") res = { label: "det A", blocks: [{ type: "scalar", data: L.det(A) }] };
      else if (op === "inv") res = { label: "A⁻¹", blocks: [{ type: "matrix", data: L.inverse(A) }] };
      else if (op === "rank") res = { label: "rank A", blocks: [{ type: "scalar", data: F(L.rank(A)) }] };
      else if (op === "trace") res = { label: "tr A", blocks: [{ type: "scalar", data: L.trace(A) }] };
      else if (op === "rref") res = { label: "RREF A", blocks: [{ type: "matrix", data: L.rref(A).R }] };
      else if (op === "solve"){
        var r = L.solve(A, B);
        if (r.type === "none") res = { label: "Ax = b", blocks: [{ type: "text", text: "无解：方程互相矛盾。", danger: true }] };
        else if (r.type === "infinite") res = { label: "Ax = b", blocks: [{ type: "text", text: "无穷多解，自由变量 " + r.free + " 个。下面是一个特解：" }, { type: "vector", data: r.x }] };
        else res = { label: "x", blocks: [{ type: "vector", data: r.x }] };
      }
      else if (op === "eig") res = { label: "A 的特征值", blocks: [{ type: "roots", data: L.eigen(A) }] };
      else throw new Error("未知运算");
      show(res);
    } catch (err){
      fail(err && err.message ? err.message : String(err));
    }
  }

  function copyOut(){
    if (!last){ flash("还没结果"); return; }
    var txt = last.label + "\n" + last.blocks.map(function(b){
      if (b.type === "matrix") return b.data.map(function(r){ return "[ " + r.map(function(v){ return v.toString(); }).join(", ") + " ]"; }).join("\n");
      if (b.type === "vector") return b.data.map(function(v){ return v.toString(); }).join("\n");
      if (b.type === "scalar") return b.data.toString();
      if (b.type === "roots") return b.data.map(function(r, i){
        var t = r.exact ? r.exact.toString() : fmtNum(r.re) + (Math.abs(r.im) > 1e-9 ? (r.im < 0 ? " - " : " + ") + fmtNum(Math.abs(r.im)) + "i" : "");
        return "λ" + (i + 1) + " = " + t;
      }).join("\n");
      return b.text;
    }).join("\n\n");
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ flash("已复制"); }, function(){ flash("复制失败"); });
    } else {
      flash("不支持复制");
    }
  }
  function flash(t){
    var b = el("copy");
    b.textContent = t;
    setTimeout(function(){ b.textContent = "复制"; }, 1200);
  }

  function setOp(op){
    S.op = op;
    Array.prototype.forEach.call(document.querySelectorAll(".chip[data-op]"), function(b){
      b.classList.toggle("on", b.getAttribute("data-op") === op);
    });
    el("kbox").hidden = op !== "kA";
    el("ophint").textContent = OPS[op].hint || "";
    el("cardB").classList.toggle("idle", !OPS[op].needB);
    el("noteB").textContent = op === "solve" ? "当作 b，需要 1 列" : "";
  }

  function applySkin(s){
    document.documentElement.setAttribute("data-skin", s);
    Array.prototype.forEach.call(document.querySelectorAll("#skins button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-skin-set") === s);
    });
    try { localStorage.setItem("la-skin", s); } catch (e) {}
  }

  Array.prototype.forEach.call(document.querySelectorAll(".st"), function(b){
    b.addEventListener("click", function(){
      resize(b.getAttribute("data-k"), b.getAttribute("data-axis"), parseInt(b.getAttribute("data-d"), 10));
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-fill]"), function(b){
    b.addEventListener("click", function(){
      var parts = b.getAttribute("data-fill").split(":");
      fill(parts[0], parts[1]);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-op]"), function(b){
    b.addEventListener("click", function(){ setOp(b.getAttribute("data-op")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("#skins button"), function(b){
    b.addEventListener("click", function(){ applySkin(b.getAttribute("data-skin-set")); });
  });
  el("run").addEventListener("click", run);
  el("copy").addEventListener("click", copyOut);
  el("dec").addEventListener("click", function(){
    S.dec = !S.dec;
    el("dec").textContent = S.dec ? "分数" : "小数";
    if (last) show(last);
  });
  el("kval").addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); run(); } });

  build("A");
  build("B");
  setOp("add");
  var SKINS = ["glass", "light", "brutal"];
  var saved = "glass";
  try {
    var q = new URLSearchParams(location.search).get("skin");
    saved = q || localStorage.getItem("la-skin") || "glass";
  } catch (e) {}
  if (SKINS.indexOf(saved) < 0) saved = "glass";
  applySkin(saved);
})();
</script>
</body>
</html>
