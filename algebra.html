<html lang="zh-CN" data-skin="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>蒲瓜的计算器</title>
<style>
:root{
  --radius:18px; --card-bw:1px; --input-bw:1px; --blur:none; --shadow:none; --skin-bw:0;
  --track:rgba(130,130,140,.16);
  --danger:#ff6b6b;
}
:root[data-skin="glass"]{
  --bg:#080c18;
  --bg-image:
    radial-gradient(880px 520px at 10% -10%, rgba(94,234,212,.20), transparent 62%),
    radial-gradient(820px 520px at 102% 2%, rgba(129,140,248,.26), transparent 64%),
    radial-gradient(700px 460px at 50% 112%, rgba(236,72,153,.14), transparent 62%);
  --fg:#e9efff; --fg-dim:rgba(233,239,255,.52);
  --card:rgba(255,255,255,.055); --card-border:rgba(255,255,255,.13);
  --blur:blur(18px); --shadow:0 12px 34px rgba(0,0,0,.34);
  --input-bg:rgba(255,255,255,.06); --input-border:rgba(255,255,255,.12);
  --chip:rgba(255,255,255,.06); --chip-border:rgba(255,255,255,.12);
  --chip-on-bg:linear-gradient(135deg,#5eead4,#818cf8); --chip-on-fg:#08101f;
  --chip-on-shadow:0 6px 18px rgba(129,140,248,.35);
  --accent-line:rgba(129,140,248,.85); --focus-ring:rgba(129,140,248,.22);
  --btn-bg:linear-gradient(135deg,#5eead4,#818cf8); --btn-fg:#07101d;
  --btn-shadow:0 10px 26px rgba(129,140,248,.32);
  --mark:linear-gradient(135deg,#5eead4,#818cf8); --mark-fg:#08101f;
  --logo-shadow:0 6px 18px rgba(129,140,248,.35);
}
:root[data-skin="light"]{
  --bg:#f2f2f7; --bg-image:none;
  --fg:#101014; --fg-dim:#8a8a92;
  --card:#ffffff; --card-border:rgba(0,0,0,.06);
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  --track:#e6e6ec;
  --input-bg:#f5f5f8; --input-border:rgba(0,0,0,.07);
  --chip:#ececf1; --chip-border:transparent;
  --chip-on-bg:#0a84ff; --chip-on-fg:#ffffff;
  --chip-on-shadow:0 6px 16px rgba(10,132,255,.30);
  --accent-line:#0a84ff; --focus-ring:rgba(10,132,255,.16);
  --btn-bg:linear-gradient(135deg,#0a84ff,#0060df); --btn-fg:#ffffff;
  --btn-shadow:0 10px 24px rgba(10,132,255,.28);
  --mark:linear-gradient(135deg,#0a84ff,#5e5ce6); --mark-fg:#ffffff;
  --logo-shadow:0 6px 16px rgba(10,132,255,.30);
  --danger:#e5484d;
}
:root[data-skin="brutal"]{
  --bg:#fdf1dd; --bg-image:none;
  --fg:#141414; --fg-dim:#6f6656;
  --card:#fffdf8; --card-border:#141414; --card-bw:2px; --input-bw:2px; --radius:14px; --skin-bw:2px;
  --shadow:6px 6px 0 #141414; --track:#fffdf8;
  --input-bg:#ffffff; --input-border:#141414;
  --chip:#ffffff; --chip-border:#141414;
  --chip-on-bg:#ffd23f; --chip-on-fg:#141414; --chip-on-shadow:3px 3px 0 #141414;
  --accent-line:#141414; --focus-ring:rgba(255,210,63,.55);
  --btn-bg:#ff5c4d; --btn-fg:#141414; --btn-shadow:4px 4px 0 #141414;
  --mark:#ffd23f; --mark-fg:#141414; --logo-shadow:none;
  --danger:#c22f22;
}
/* ==================== 新增皮肤：方舟 / 霓虹 / 终端 ==================== */
/* 方舟：深黑底、直角、1px 细亮边、亮黄点缀、轻微斜纹（军事科技感） */
:root[data-skin="ark"]{
  --bg:#ffffff; --bg-image:repeating-linear-gradient(135deg, rgba(17,17,17,.022) 0 10px, transparent 10px 20px);
  --fg:#111213; --fg-dim:#6b7280;
  --card:#ffffff; --card-border:#d5d9de; --card-bw:1px; --radius:2px; --skin-bw:1px;
  --shadow:0 1px 2px rgba(17,17,17,.05); --track:#f1f3f5;
  --chip:#f6f7f9; --chip-border:#c9ced4;
  --chip-on-bg:#ffe600; --chip-on-fg:#111213;
  --mark:#111213; --mark-fg:#ffe600; --logo-shadow:none;
}
/* 霓虹：深紫黑底 + 青/品红辉光 */
:root[data-skin="neon"]{
  --bg:#07060f;
  --bg-image:radial-gradient(1100px 560px at 18% -8%, rgba(0,229,255,.12), transparent 62%), radial-gradient(900px 500px at 100% 0%, rgba(255,62,165,.10), transparent 58%);
  --fg:#eaf7ff; --fg-dim:#8ea6c8;
  --card:rgba(18,13,34,.86); --card-border:#312a63; --card-bw:1px; --radius:16px; --skin-bw:1px;
  --shadow:0 0 26px rgba(0,229,255,.10); --track:#0d0a1c;
  --chip:rgba(24,18,44,.85); --chip-border:#3a3170;
  --chip-on-bg:#00e5ff; --chip-on-fg:#04060f;
  --mark:#00e5ff; --mark-fg:#04060f; --logo-shadow:0 0 18px rgba(0,229,255,.45);
}
/* 终端：纯黑 + 绿字 + 等宽 + 扫描线 */
:root[data-skin="mono"]{
  --bg:#000000; --bg-image:repeating-linear-gradient(0deg, rgba(57,255,138,.05) 0 1px, transparent 1px 3px);
  --fg:#39ff8a; --fg-dim:#1f8a4c;
  --card:#050805; --card-border:#1f6b3d; --card-bw:1px; --radius:0px; --skin-bw:1px;
  --shadow:none; --track:#020402;
  --chip:#040a06; --chip-border:#1f6b3d;
  --chip-on-bg:#39ff8a; --chip-on-fg:#000000;
  --mark:#39ff8a; --mark-fg:#000000; --logo-shadow:none;
}
.skins{flex-wrap:wrap;justify-content:flex-end}
/* 方舟的直角卡片：左侧亮条 + 右上角标 */
:root[data-skin="ark"] .card{position:relative;overflow:hidden}
:root[data-skin="ark"] .card::before{content:"";position:absolute;left:0;top:9px;width:3px;height:22px;background:var(--fg)}
:root[data-skin="ark"] .chip.on,:root[data-skin="ark"] .tabs .on{box-shadow:none;font-weight:700;letter-spacing:.02em;border-color:#111213}
:root[data-skin="ark"] .tabs .tag{color:#111213;background:transparent;border-radius:0;padding:0;opacity:.6;font-weight:400}
/* 霓虹的发光选中态 */
:root[data-skin="neon"] .chip.on,:root[data-skin="neon"] .tabs .on{box-shadow:0 0 16px rgba(0,229,255,.45)}
/* 终端用等宽字体 */
:root[data-skin="mono"] body{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
:root[data-skin="mono"] .tabs .on{box-shadow:0 0 12px rgba(57,255,138,.35)}

/* 方舟：深黑底、直角、1px 细亮边、亮黄点缀、轻微斜纹（军事科技感） */

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 15px max(30px,env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  transition:background .25s ease,color .25s ease;
}
body::before{content:"";position:fixed;inset:0;background-image:var(--bg-image);pointer-events:none;z-index:0}
[hidden]{display:none !important}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--mark);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:var(--mark-fg);flex:0 0 auto;box-shadow:var(--logo-shadow)}
h1{font-size:17px;margin:0;letter-spacing:.01em}
.sub{margin:2px 0 0;font-size:11.5px;color:var(--fg-dim);letter-spacing:.04em}
.hero{text-align:center;padding:4px 2px 0}
.heroTitle{margin:0;font-size:23px;font-weight:800;letter-spacing:.005em;line-height:1.32}
.heroSub{margin:7px 0 0;font-size:12.5px;color:var(--fg-dim);letter-spacing:.08em}
.brandName{font-size:12.5px;color:var(--fg-dim);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skins{display:flex;gap:3px;padding:3px;background:var(--track);border-radius:999px;border:var(--skin-bw) solid var(--card-border)}
.skins button{border:0;background:transparent;color:var(--fg-dim);font:inherit;font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;transition:.18s}
.skins button.on{background:var(--chip-on-bg);color:var(--chip-on-fg);font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--track);border:1px solid var(--card-border);border-radius:15px}
.tabs a,.tabs span{flex:1 1 calc(25% - 4px);text-align:center;padding:10px 6px;border-radius:11px;font-size:13px;text-decoration:none;color:var(--fg-dim);transition:.18s;white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs .on{background:var(--chip-on-bg);color:var(--chip-on-fg);font-weight:600;box-shadow:var(--chip-on-shadow)}
.tabs .tag{font-size:11px;opacity:.75;margin-left:4px}
.card{background:var(--card);border:var(--card-bw) solid var(--card-border);border-radius:var(--radius);padding:13px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow);transition:opacity .2s ease}
.card.idle{opacity:.42}
.chead{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.mtag{width:28px;height:28px;border-radius:9px;background:var(--mark);color:var(--mark-fg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto}
.dims{display:flex;align-items:center;gap:6px}
.dim{display:flex;align-items:center;gap:2px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:9px;padding:1px}
.dim b{min-width:18px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.st{border:0;background:transparent;color:var(--fg-dim);font:inherit;font-size:15px;line-height:1;width:24px;height:26px;border-radius:7px;cursor:pointer}
.st:active{background:var(--chip)}
.x{color:var(--fg-dim);font-size:12px}
.tools{margin-left:auto;display:flex;gap:5px}
.tools button{border:1px solid var(--input-border);background:var(--chip);color:var(--fg);font:inherit;font-size:12px;padding:5px 9px;border-radius:8px;cursor:pointer;transition:.16s}
.tools button:active{transform:translateY(1px)}
.note{font-size:11.5px;color:var(--fg-dim)}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:7px}
.grid input{width:100%;min-width:0;padding:10px 4px;text-align:center;font:inherit;font-size:15.5px;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--input-bg);border:var(--input-bw) solid var(--input-border);border-radius:10px;outline:none;transition:.16s}
.grid input::placeholder{color:var(--fg-dim);opacity:.55}
.grid input:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--focus-ring)}
.glabel{font-size:11px;color:var(--fg-dim);letter-spacing:.12em;margin:2px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{border:1px solid var(--chip-border);background:var(--chip);color:var(--fg);font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;cursor:pointer;transition:.16s}
.chip:active{transform:translateY(1px)}
.chip.on{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:transparent;font-weight:600;box-shadow:var(--chip-on-shadow)}
.chip i{font-style:normal;font-size:11px;opacity:.68;margin-left:5px;font-weight:400}
.chip.on i{opacity:.8}
.chip.big{font-size:14.5px;padding:12px 17px;font-weight:650;border-color:var(--accent-line)}
.chip.big i{font-size:12px;opacity:.85}
.chip.big.on i{opacity:.9}
.kbox{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--fg-dim);border:1px solid var(--input-border);border-radius:999px;padding:4px 10px}
.kbox input{width:52px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:13px;outline:none}
.hint{font-size:12px;color:var(--fg-dim);margin:0 0 10px;min-height:15px}
.run{width:100%;border:0;border-radius:13px;padding:14px;background:var(--btn-bg);color:var(--btn-fg);font:inherit;font-size:15px;font-weight:650;letter-spacing:.16em;cursor:pointer;box-shadow:var(--btn-shadow);transition:transform .12s ease}
.run:active{transform:translateY(1px)}
.rtitle{font-size:13px;font-weight:600;letter-spacing:.02em}
#out{min-height:52px}
.empty{color:var(--fg-dim);font-size:13px;margin:14px 0;text-align:center}
.rgrid{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:6px}
.rgrid.big{margin-top:8px;gap:8px}
.rgrid.big .rcell{font-size:20px;padding:15px 5px;border-width:2px;font-weight:600}
/* 手机上的页内数字条：聚焦某个格子时出现，点它不会把焦点/系统键盘抢走 */
.keypad{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.keypad[hidden]{display:none}
.keypad .kk{flex:1 1 calc(14.28% - 4px);min-width:34px;padding:9px 0;border-radius:9px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--fg);font:inherit;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.keypad .kk:active{background:var(--chip-on-bg);color:var(--chip-on-fg)}
.rcell{background:var(--input-bg);border:1px solid var(--input-border);border-radius:9px;padding:9px 3px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums;word-break:break-all}
.scalar{font-size:27px;font-weight:700;text-align:center;padding:12px 0;font-variant-numeric:tabular-nums}
.roots{display:flex;flex-direction:column;gap:8px}
.root{display:flex;align-items:center;gap:10px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 12px;font-size:16px;font-variant-numeric:tabular-nums}
.root .idx{font-size:12px;color:var(--fg-dim);min-width:22px}
.msg{font-size:13px;color:var(--fg-dim);margin:6px 0}
.msgerr{font-size:13px;color:var(--danger);margin:8px 0;line-height:1.55}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.06;font-size:.9em;margin:0 1px}
.frac .fd{border-top:1.4px solid currentColor;padding:0 .2em}
.frac .fn{padding:0 .2em}
.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
.foot{font-size:11.5px;color:var(--fg-dim);text-align:center;margin:4px 0 0;line-height:1.6}
.geo{display:block;width:100%;height:300px;border-radius:12px;background:var(--input-bg);border:var(--input-bw) solid var(--input-border);touch-action:none;cursor:grab}
.geo.dragging{cursor:grabbing}
.geoinfo{font-size:12px;color:var(--fg-dim);margin:10px 0 0;line-height:1.8}
.geoinfo b{color:var(--fg);font-weight:600}
.stepbox{background:var(--input-bg);border:1px solid var(--input-border);border-radius:12px;padding:11px;margin-bottom:10px}
.stepline{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepno{background:var(--chip-on-bg);color:var(--chip-on-fg);font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.stepmats{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.matwrap{display:flex;flex-direction:column;gap:5px}
.matlab{font-size:11px;color:var(--fg-dim)}
.matwrap .rgrid{max-width:240px}
.vlist{display:flex;flex-direction:column;gap:9px}
.vrow{display:flex;align-items:center;gap:10px}
.vrow .idx{font-size:12px;color:var(--fg-dim);min-width:22px}
.gsline{display:flex;flex-wrap:wrap;align-items:center;gap:9px;row-gap:12px;padding:2px 0}
.gslab{font-size:17px;font-weight:600}
.gsop{font-size:14px;color:var(--fg-dim);white-space:nowrap}
.gsline .rgrid.vec{max-width:110px}
.gsnote{font-size:12px;color:var(--fg-dim);margin-top:10px;line-height:1.75}
@media (max-width:420px){h1{font-size:16px}.sub{display:none}.chip{font-size:12.5px;padding:7px 11px}.card{padding:11px}}
</style>
</head>

<script>
/* ==== ENGINE START ==== */
const LinAlg = (function(){
  "use strict";
  var ZERO = null, ONE = null, TWO = null;

  /* ==================== 符号值层（把 Calc 包装成一个「数」） ==================== */
  /* 一个值只有两种形态：
       - Frac（精确有理数，和以前完全一样）
       - Sym （符号表达式，内部是内置符号引擎 Calc 的 AST）
     矩阵里每个格子都可以是其中一种；下面的 vAdd/vMul/... 负责两种形态的混合运算。 */

  var SYM_FUNCS = ["sin", "cos", "tan", "cot", "sec", "csc", "asin", "acos", "atan",
    "sinh", "cosh", "tanh", "ln", "log", "exp", "sqrt", "abs"];
  var SYM_MSG_RREF = "行化简需要判断主元是否为零，暂不支持；符号行列式和四则运算是支持的。";
  var SYM_MSG_INV = "符号矩阵不能做精确除法，所以无法求逆；符号行列式和四则运算是支持的。";
  var SYM_MSG_NUM = "这个运算要求矩阵里全是数字；符号矩阵只支持加减、乘法、数乘、转置、迹和行列式。";
  var SYM_MSG_DET = "符号矩阵的行列式不能做精确除法，暂不支持；符号行列式和四则运算是支持的。";

  function symOf(expr){ return new Sym(expr, Calc.str(expr)); }
  /* 符号节点的子节点只能是 AST 节点或 Sym；Frac / 数字要先变成 {t:"num"} 节点。 */
  function sExpr(x){
    if (isSym(x)) return x.expr;
    if (x instanceof Frac) return Calc.num(x.n, x.d);
    if (typeof x === "number") return Calc.num(x);
    if (typeof x === "bigint") return Calc.num(x);
    return val(x).expr;
  }
  function Sym(expr, text){ this.expr = expr; this.text = text; }
  Sym.prototype.isZero = function(){ return this.expr.t === "num" && this.expr.v.isZero; };
  Sym.prototype.isOne = function(){ return this.expr.t === "num" && this.expr.v.isOne; };
  Sym.prototype.sign = function(){
    if (this.expr.t !== "num") throw new Error("符号表达式「" + this.text + "」没有确定的正负号，" + SYM_MSG_RREF);
    return this.expr.v.sign;
  };
  Sym.prototype.neg = function(){ return symOf(Calc.simplify({ t: "neg", a: this.expr })); };
  Sym.prototype.add = function(o){ return symOf(Calc.simplify({ t: "add", a: this.expr, b: sExpr(o) })); };
  Sym.prototype.sub = function(o){ return symOf(Calc.simplify({ t: "add", a: this.expr, b: { t: "neg", a: sExpr(o) } })); };
  Sym.prototype.mul = function(o){ return symOf(Calc.simplify({ t: "mul", a: this.expr, b: sExpr(o) })); };
  /* 符号除法：不真正做除法，化成乘以 -1 次幂（Calc 会把分母打印成 1/x 这类写法）。 */
  Sym.prototype.div = function(o){
    if (o.isZero()) throw new Error("不能除以 0");
    return symOf(Calc.simplify({ t: "mul", a: this.expr, b: { t: "pow", a: sExpr(o), b: Calc.num(-1) } }));
  };
  Sym.prototype.toString = function(){ return this.text; };
  Sym.prototype.toNumber = function(){ throw new Error("符号表达式「" + this.text + "」没有数值，" + SYM_MSG_NUM); };
  Sym.prototype.isSym = true;   /* 标记位：注意别把 isSym() 这个函数名盖掉 */

  function isSym(v){ return !!(v && v.isSym === true); }
  function symVars(n, out){
    out = out || [];
    if (!n || typeof n !== "object") return out;
    if (n.t === "var"){ if (out.indexOf(n.name) < 0) out.push(n.name); return out; }
    if (n.t === "neg") { symVars(n.a, out); return out; }
    if (n.t === "add" || n.t === "mul" || n.t === "pow"){ symVars(n.a, out); symVars(n.b, out); return out; }
    if (n.t === "fn" && n.arg) symVars(n.arg, out);
    return out;
  }
  function symName(v, dflt){
    var vs = symVars(v.expr === undefined ? v : v.expr);
    if (!vs.length) return dflt || "变量";
    if (vs.length === 1) return vs[0];
    return vs.slice(0, 3).join("、") + " 等 " + vs.length + " 个符号";
  }
  /* 还没变成「值」的原始输入（字符串、数字）→ true；已经是 Frac 或 Sym → false。 */
  function needsVal(n){ return !(n instanceof Frac) && !isSym(n); }
  /* 整个矩阵都是数字（没有符号）→ true；只要有一个符号就 → false。 */
  function allNums(M){
    for (var i = 0; i < M.length; i++){
      for (var j = 0; j < M[i].length; j++){ if (isSym(M[i][j])) return false; }
    }
    return true;
  }
  function symGuard(M, tail){
    for (var i = 0; i < M.length; i++){
      for (var j = 0; j < M[i].length; j++){
        if (isSym(M[i][j])) return "矩阵里有符号 " + symName(M[i][j]) + "，" + tail;
      }
    }
    return null;
  }
  function guardRowMap(M){ var m = symGuard(M, SYM_MSG_RREF); if (m) throw new Error(m); return M; }
  function guardNoDiv(M){ var m = symGuard(M, SYM_MSG_INV); if (m) throw new Error(m); return M; }
  function guardNumOnly(M){ var m = symGuard(M, SYM_MSG_NUM); if (m) throw new Error(m); return M; }
  function guardDet(M){ var m = symGuard(M, SYM_MSG_DET); if (m) throw new Error(m); return M; }

  function symOK(n){
    if (!n || typeof n !== "object") return false;
    if (n.t === "num" || n.t === "var") return true;
    if (n.t === "neg") return symOK(n.a);
    if (n.t === "add" || n.t === "mul" || n.t === "pow") return symOK(n.a) && symOK(n.b);
    return false;
  }

  /* ---------- 值构造：数字尽量保持 Frac，带字母的才变成 Sym ---------- */

  /* 把用户输入的空格、各种减号、幂号、百分号之外的写法规范化。
     注意：只补上「数字后面直接跟字母」的乘号（2a → 2*a），
     并保留 Calc 本来就支持的隐式乘法（a(b+1)、ab）。 */
  function prepSym(s){
    var t = String(s).replace(/\s+/g, "").replace(/−/g, "-").replace(/—/g, "-")
      .replace(/／/g, "/").replace(/×/g, "*").replace(/÷/g, "/").replace(/\*\*/g, "^");
    t = t.replace(/([0-9])([A-Za-z(])/g, "$1*$2");
    t = t.replace(/\)([0-9A-Za-z(])/g, ")*$1");
    return t;
  }
  /* 解析成数值；不是纯数字就返回 null。 */
  function numTry(s){
    if (s instanceof Frac) return s;
    if (typeof s === "bigint" || typeof s === "number") return F(s);
    if (typeof s !== "string") return null;
    try { return F(s); } catch (e){ return null; }
  }
  function buildSym(s){
    var t = prepSym(s);
    var node;
    try { node = Calc.simplify(Calc.parse(t)); }
    catch (e){ throw new Error("无法解析「" + String(s).trim() + "」：" + e.message); }
    var bad = null;
    (function scan(n){
      if (bad || !n || typeof n !== "object") return;
      if (n.t === "fn"){
        if (n.name === "pi" || n.name === "e") bad = "常量 " + n.name + " 不是精确数";
        else bad = "函数 " + n.name + "()";
        return;
      }
      if (n.t === "neg") { scan(n.a); return; }
      if (n.t === "add" || n.t === "mul" || n.t === "pow"){ scan(n.a); scan(n.b); }
    })(node);
    if (bad) throw new Error("矩阵格子里不能用" + bad + "；只支持数字、字母（a–z、A–Z，可多字母）、+ - * / ^ 和括号。");
    if (Calc.str(node).length > 160) throw new Error("这个符号表达式太长了，暂时算不动");
    return new Sym(node, Calc.str(node));
  }
  /* 用户输入的一个格子 → 值（支持 -3/4、1.25、a、2a、a+1、a*b、a^2、-k/2） */
  function val(x){
    if (x instanceof Frac || isSym(x)) return x;
    if (typeof x === "bigint") return F(x);
    if (typeof x === "number") return F(x);
    var n = numTry(x);
    if (n !== null) return n;
    return buildSym(x);
  }
  function valMat(M){
    shape(M);
    return M.map(function(r){ return r.map(function(v){ return val(v); }); });
  }

  /* ---------- 两种形态之间的四则运算 ---------- */

  /* 两种形态之间的四则运算：只要有一边是符号，两边都先升成符号值。 */
  function vAdd(x, y){ return (isSym(x) || isSym(y)) ? symOf(Calc.simplify({ t: "add", a: sExpr(x), b: sExpr(y) })) : x.add(y); }
  function vSub(x, y){ return (isSym(x) || isSym(y)) ? symOf(Calc.simplify({ t: "add", a: sExpr(x), b: { t: "neg", a: sExpr(y) } })) : x.sub(y); }
  function vMul(x, y){ return (isSym(x) || isSym(y)) ? symOf(Calc.simplify({ t: "mul", a: sExpr(x), b: sExpr(y) })) : x.mul(y); }
  function vNeg(x){ return isSym(x) ? x.neg() : x.neg(); }
  function cellNeg(x){ if (x === undefined || x === null || x === ZERO) return ZERO; return vNeg(x); }
  function vIsZero(x){ return isSym(x) ? x.isZero() : x.isZero(); }
  function vDetZero(x){ return (x === undefined || x === null) ? true : vIsZero(x); }
  function vStr(x){ return isSym(x) ? x.toString() : x.toString(); }
  function isNumVal(x){ return x instanceof Frac ? x : (x.expr.t === "num" ? x.expr.v : null); }
  function isOneVal(x){ if (x === undefined || x === null) return false; return x instanceof Frac ? (x.n === 1n && x.d === 1n) : x.isOne(); }

// 蒲瓜的计算器 · 符号微积分引擎
// 零依赖 ES module，只用 Node 内置能力（BigInt / Math），不联网、不装包。
//
// 导出：parse / simplify / toString / evalAt / deriv / taylor / limit /
//       integrate / definiteIntegral / Rat (精确有理数，便于外部复用)
//
// AST 节点形状固定：
//   { t:"num", v:Rat } | { t:"var", name:"x" } | { t:"neg", a } |
//   { t:"add", a, b }  | { t:"mul", a, b }     | { t:"pow", a, b } |
//   { t:"fn", name:"sin", arg }
//
// 内部约定：所有数值字面量与导数系数都用精确有理数（BigInt 分子/分母）表示，
// 因此 d/dx(x^3/3) 精确得到 x^2，不存在浮点退化。

/* ============================== 1. 精确有理数 ============================== */

function bigAbs(a) { return a < 0n ? -a : a; }

function bigGcd(a, b) {
  a = bigAbs(a); b = bigAbs(b);
  while (b) { const t = a % b; a = b; b = t; }
  return a;
}

/** 精确有理数：BigInt 分子 / BigInt 分母，分母恒正、自动约分。 */
class Rat {
  constructor(n, d = 1n) {
    n = BigInt(n); d = BigInt(d);
    if (d === 0n) throw new Error("有理数的分母不能为 0");
    if (d < 0n) { n = -n; d = -d; }
    const g = bigGcd(n, d) || 1n;
    this.n = n / g;
    this.d = d / g;
  }
  add(o) { return new Rat(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { return new Rat(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { return new Rat(this.n * o.n, this.d * o.d); }
  div(o) {
    if (o.n === 0n) throw new Error("有理数除以 0");
    return new Rat(this.n * o.d, this.d * o.n);
  }
  neg() { return new Rat(-this.n, this.d); }
  inv() {
    if (this.n === 0n) throw new Error("0 没有倒数");
    return new Rat(this.d, this.n);
  }
  abs() { return this.n < 0n ? this.neg() : this; }
  get isZero() { return this.n === 0n; }
  get isOne() { return this.n === 1n && this.d === 1n; }
  get isInt() { return this.d === 1n; }
  get sign() { return this.n < 0n ? -1 : (this.n > 0n ? 1 : 0); }
  eq(o) { return this.n === o.n && this.d === o.d; }
  cmp(o) { const l = this.n * o.d, r = o.n * this.d; return l < r ? -1 : (l > r ? 1 : 0); }
  toNumber() { return Number(this.n) / Number(this.d); }
  /** "3"、"1/6"、"-1/6" */
  toString() { return this.d === 1n ? this.n.toString() : this.n + "/" + this.d; }
}

const R0 = new Rat(0n);
const R1 = new Rat(1n);
const R2 = new Rat(2n);
const RHALF = new Rat(1n, 2n);
const RAT_CACHE = new Map();
/** 由整数构造有理数（带缓存，热路径友好）。 */
function ri(n) {
  n = BigInt(n);
  let v = RAT_CACHE.get(n);
  if (!v) { v = new Rat(n, 1n); RAT_CACHE.set(n, v); }
  return v;
}
function rn(n) { return new Rat(n); }

/**
 * 连分数有理重构：浮点数 x 若非常接近分母不大的有理数，就还原它。
 * 用于「数值判定的极限恰好是 1/2 这类精确值」的场景。
 */
function ratApprox(x, maxDen = 100000000n, eps = 1e-9) {
  if (!Number.isFinite(x)) return null;
  const neg = x < 0;
  const v = Math.abs(x);
  if (v > 1e15) return null;
  let h0 = 0n, h1 = 1n, k0 = 1n, k1 = 0n;
  let frac = v;
  for (let i = 0; i < 40; i++) {
    const a = Math.floor(frac);
    if (!Number.isFinite(a) || a < 0) break;
    const ab = BigInt(a);
    const h2 = ab * h1 + h0, k2 = ab * k1 + k0;
    if (k2 > maxDen) break;
    h0 = h1; h1 = h2; k0 = k1; k1 = k2;
    const cand = Number(h1) / Number(k1);
    if (Math.abs(cand - v) <= eps * Math.max(1, Math.abs(v))) {
      const r = new Rat(h1, k1);
      return neg ? r.neg() : r;
    }
    const next = frac - a;
    if (next < 1e-15) break;
    frac = 1 / next;
  }
  return null;
}

/* ============================== 2. 数值格式化 ============================== */

/** 一般数值 → 可读文本（给 limit.value、steps 展示用）。 */
function formatNumber(x) {
  if (typeof x !== "number") return String(x);
  if (Number.isNaN(x)) return "NaN";
  if (x === Infinity) return "+inf";
  if (x === -Infinity) return "-inf";
  if (Number.isInteger(x)) return String(x);
  const r = ratApprox(x, 1000000n, 1e-12);
  if (r && !r.isInt) return r.toString();
  return String(Number(x.toPrecision(12)));
}

/** 定积分数值的展示：只有能精确还原成简单分数时才写成分数，否则写十进制。 */
function numericText(x) {
  if (typeof x !== "number" || !Number.isFinite(x)) return formatNumber(x);
  if (Number.isInteger(x)) return String(x);
  const r = ratApprox(x, 10000n, 1e-13);
  if (r && !r.isInt) return r.toString();
  return String(Number(x.toPrecision(12)));
}

/* ============================== 3. AST 工具 ============================== */

const num = (v) => ({ t: "num", v: (v instanceof Rat ? v : rn(v)) });
const n0 = () => ({ t: "num", v: R0 });
const n1 = () => ({ t: "num", v: R1 });
const variable = (name) => ({ t: "var", name });
const isNum = (x) => x.t === "num";
const isZeroNode = (x) => x.t === "num" && x.v.isZero;
const isOneNode = (x) => x.t === "num" && x.v.isOne;
const PI_NODE = () => ({ t: "fn", name: "pi", arg: null });
const E_NODE = () => ({ t: "fn", name: "e", arg: null });

/** 是否是自然常数 e 这个节点。 */
function isENode(n) {
  return !!n && n.t === "fn" && n.name === "e" && n.arg === null;
}

/** 稳定结构键：结构等价的子树 → 同一字符串（用于排序/同类项合并）。 */
function key(n) {
  switch (n.t) {
    case "num": return "#" + n.v.toString();
    case "var": return "$" + n.name;
    case "neg": return "-(" + key(n.a) + ")";
    case "add": return "+(" + key(n.a) + "," + key(n.b) + ")";
    case "mul": return "*(" + key(n.a) + "," + key(n.b) + ")";
    case "pow": return "^(" + key(n.a) + "," + key(n.b) + ")";
    case "fn": return "@" + n.name + "(" + (n.arg ? key(n.arg) : "") + ")";
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
}

const CMP = (a, b) => (a < b ? -1 : (a > b ? 1 : 0));

/** 深拷贝。 */
function clone(n) {
  switch (n.t) {
    case "num": return { t: "num", v: n.v };
    case "var": return { t: "var", name: n.name };
    case "neg": return { t: "neg", a: clone(n.a) };
    case "add": return { t: "add", a: clone(n.a), b: clone(n.b) };
    case "mul": return { t: "mul", a: clone(n.a), b: clone(n.b) };
    case "pow": return { t: "pow", a: clone(n.a), b: clone(n.b) };
    case "fn": return { t: "fn", name: n.name, arg: n.arg ? clone(n.arg) : null };
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
}

function walk(n, f) {
  f(n);
  if (n.t === "neg") walk(n.a, f);
  else if (n.t === "add" || n.t === "mul" || n.t === "pow") { walk(n.a, f); walk(n.b, f); }
  else if (n.t === "fn" && n.arg) walk(n.arg, f);
}

/* ============================== 4. 词法分析 ============================== */

const FUNCS = new Set([
  "sin", "cos", "tan", "cot", "sec", "csc",
  "asin", "acos", "atan", "sinh", "cosh", "tanh",
  "ln", "log", "exp", "sqrt", "abs",
]);
const CONSTS = new Set(["pi", "e"]);

function tokenize(src) {
  if (typeof src !== "string") throw new Error("表达式必须是字符串");
  const s = src.replace(/\u03C0/g, " pi ").replace(/\u221E/g, " inf ").replace(/\*\*/g, "^");
  const out = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(s[i + 1] || ""))) {
      let j = i, seenDot = false;
      while (j < s.length && (/[0-9]/.test(s[j]) || (s[j] === "." && !seenDot))) {
        if (s[j] === ".") seenDot = true;
        j++;
      }
      if (s[j] === "e" || s[j] === "E") {
        let k = j + 1;
        if (s[k] === "+" || s[k] === "-") k++;
        if (/[0-9]/.test(s[k] || "")) { while (k < s.length && /[0-9]/.test(s[k])) k++; j = k; }
      }
      out.push({ k: "num", v: s.slice(i, j) });
      i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i;
      while (j < s.length && /[A-Za-z0-9_]/.test(s[j])) j++;
      out.push({ k: "name", v: s.slice(i, j) });
      i = j; continue;
    }
    if ("+-*/^(),".includes(c)) { out.push({ k: c }); i++; continue; }
    throw new Error("无法识别的字符「" + c + "」（位置 " + i + "）");
  }
  out.push({ k: "eof" });
  return out;
}

/* ============================== 5. 语法分析 ============================== */

/** 把十进制字面量精确转成有理数（不用 parseFloat，避免精度丢失）。 */
function decToRat(text) {
  let s = String(text);
  let exp = 0;
  const eIdx = s.search(/[eE]/);
  if (eIdx >= 0) {
    exp = parseInt(s.slice(eIdx + 1), 10);
    s = s.slice(0, eIdx);
  }
  let intPart = s, fracPart = "";
  const dot = s.indexOf(".");
  if (dot >= 0) { intPart = s.slice(0, dot); fracPart = s.slice(dot + 1); }
  if (intPart === "") intPart = "0";
  let n = BigInt(intPart || "0") * BigInt("1" + "0".repeat(fracPart.length)) + BigInt(fracPart || "0");
  let d = BigInt("1" + "0".repeat(fracPart.length));
  if (exp > 0) n *= BigInt("10") ** BigInt(exp);
  else if (exp < 0) d *= BigInt("10") ** BigInt(-exp);
  return new Rat(n, d);
}

/**
 * 解析字符串 → AST。
 * 支持隐式乘法（2x、3sin(x)、x(x+1)、2(x+1)）、^ 右结合、一元负号、括号。
 * 出错时 throw new Error(中文错误信息)。
 */
function parse(src) {
  const toks = tokenize(src);
  let pos = 0;
  const peek = () => toks[pos];
  const next = () => toks[pos++];
  const at = (k) => toks[pos].k === k;

  function expect(k, msg) {
    if (!at(k)) throw new Error("语法错误：" + msg + "，但读到" + describe(peek()));
    return next();
  }
  function describe(t) {
    if (!t || t.k === "eof") return "表达式结尾";
    if (t.k === "num") return "数字「" + t.v + "」";
    if (t.k === "name") return "「" + t.v + "」";
    return "「" + t.k + "」";
  }

  function parseExpr() {
    let left = parseMul();
    while (at("+") || at("-")) {
      const op = next().k;
      const right = parseMul();
      left = op === "+" ? { t: "add", a: left, b: right } : { t: "add", a: left, b: { t: "neg", a: right } };
    }
    return left;
  }

  // 乘法层：连续的「因子」自动视为相乘（隐式乘法）
  function parseMul() {
    let left = parseUnary();
    for (;;) {
      const t = peek();
      if (t.k === "num" || t.k === "name" || t.k === "(") {
        const right = parseUnary();
        left = { t: "mul", a: left, b: right };
      } else if (t.k === "*" || t.k === "/") {
        next();
        const right = parseUnary();
        left = t.k === "*"
          ? { t: "mul", a: left, b: right }
          : { t: "mul", a: left, b: { t: "pow", a: right, b: num(ri(-1)) } };
      } else break;
    }
    return left;
  }

  // 一元层：-x、+x，然后进入幂层
  function parseUnary() {
    if (at("-")) { next(); return { t: "neg", a: parseUnary() }; }
    if (at("+")) { next(); return parseUnary(); }
    return parsePower();
  }

  // 幂层：右结合，指数本身可以带一元负号（x^-1）
  function parsePower() {
    const base = parseAtom();
    if (at("^")) {
      next();
      const exp = parseUnary();
      return { t: "pow", a: base, b: exp };
    }
    return base;
  }

  function parseAtom() {
    const t = peek();
    if (t.k === "num") { next(); return { t: "num", v: decToRat(t.v) }; }
    if (t.k === "name") {
      next();
      const name = t.v;
      // 已登记的函数名后面跟括号 → 函数调用；其它名字后面跟括号 → 隐式乘法 x(x+1)
      if (FUNCS.has(name) && at("(")) {
        next();
        const arg = parseExpr();
        expect(")", "函数 " + name + " 缺少右括号「)」");
        return { t: "fn", name, arg };
      }
      if (CONSTS.has(name)) return name === "pi" ? PI_NODE() : E_NODE();
      if (FUNCS.has(name)) throw new Error("函数「" + name + "」缺少参数括号，请写成 " + name + "(x)");
      // 单字母名字后面跟括号 → 隐式乘法 x(x+1)；多字母名字 → 当作未知函数调用
      if (at("(") && name.length > 1) throw new Error("未知函数「" + name + "」");
      if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) return variable(name);
      throw new Error("无法识别的名称「" + name + "」");
    }
    if (t.k === "(") {
      next();
      const inner = parseExpr();
      if (!at(")")) throw new Error("括号没有闭合：缺少右括号「)」");
      next();
      return inner;
    }
    if (t.k === "eof") throw new Error("表达式不完整：结尾缺少内容");
    if (t.k === ")") throw new Error("表达式里出现了多余的右括号「)」");
    throw new Error("语法错误：这里不该出现" + describe(t));
  }

  const root = parseExpr();
  if (!at("eof")) throw new Error("表达式在" + describe(peek()) + "之后还有多余内容，请检查运算符是否写漏");
  return root;
}

/* ============================== 6. 化简 ============================== */

/** 把和式摊平成项列表。 */
function flattenSum(n, out = []) {
  if (n.t === "add") { flattenSum(n.a, out); flattenSum(n.b, out); return out; }
  out.push(n);
  return out;
}

/** 把积式摊平成因子列表（neg 也算系数 -1）。 */
function flattenProd(n, out = []) {
  if (n.t === "mul") { flattenProd(n.a, out); flattenProd(n.b, out); return out; }
  if (n.t === "neg") { flattenProd(n.a, out); out.unshift(num(ri(-1))); return out; }
  out.push(n);
  return out;
}

/** 取出项的数值系数与其余部分：2*x → {c:2, base:x}；-x → {c:-1, base:x}；5 → {c:5, base:null} */
function coeffOf(n) {
  const factors = flattenProd(n);
  let c = R1;
  const rest = [];
  for (const f of factors) {
    if (isNum(f)) c = c.mul(f.v);
    else rest.push(f);
  }
  if (rest.length === 0) return { c, base: null };
  let base = rest[0];
  for (let i = 1; i < rest.length; i++) base = { t: "mul", a: base, b: rest[i] };
  return { c, base };
}

const factKey = (b) => (b === null ? "#1" : key(b));

/** 单项乘积的规范化：合并数值系数、合并同底数幂、稳定排序。 */
function makeProd(factors) {
  let c = R1;
  const powers = []; // { base, exp: Rat | node | null }
  for (const f of factors) {
    if (isNum(f)) { c = c.mul(f.v); continue; }
    let base = f, exp = null;
    if (f.t === "pow") { base = f.a; exp = f.b; }
    if (base.t === "neg") { c = c.neg(); base = base.a; }
    // 只有「数字底数 + 数字指数」才能折进系数；2^x 这种指数是变量的必须保留
    if (base.t === "num" && exp !== null && isNum(exp)) {
      const folded = powRat(base.v, exp);
      if (folded) { c = c.mul(folded); continue; }
    }
    if (exp && isNum(exp) && exp.v.isZero) continue;
    if (exp && isNum(exp) && exp.v.isOne) exp = null;
    let merged = false;
    if (exp === null) {
      for (const p of powers) {
        if (key(p.base) !== key(base)) continue;
        if (p.exp === null) p.exp = ri(2);
        else if (p.exp instanceof Rat) p.exp = p.exp.add(R1);
        else continue;
        merged = true; break;
      }
    } else if (isNum(exp)) {
      for (const p of powers) {
        if (key(p.base) !== key(base)) continue;
        if (p.exp === null) p.exp = exp.v.add(R1);
        else if (p.exp instanceof Rat) p.exp = p.exp.add(exp.v);
        else continue;
        merged = true; break;
      }
    }
    if (!merged) powers.push({ base, exp: exp === null ? null : (isNum(exp) ? exp.v : exp) });
  }
  if (c.isZero) return n0();
  const list = [];
  for (const p of powers) {
    if (p.exp === null) list.push(p.base);
    else if (p.exp instanceof Rat) {
      if (p.exp.isZero) continue;
      if (p.exp.isOne) list.push(p.base);
      else list.push({ t: "pow", a: p.base, b: num(p.exp) });
    } else list.push({ t: "pow", a: p.base, b: p.exp });
  }
  for (const f of list) if (isNum(f) && f.v.isZero) return n0();
  list.sort(factorCmp);
  if (list.length === 0) return num(c);
  if (c.isOne) return list.length === 1 ? list[0] : buildMulList(list);
  if (c.eq(ri(-1))) {
    const body = list.length === 1 ? list[0] : buildMulList(list);
    return body.t === "num" ? num(c.mul(body.v)) : { t: "neg", a: body };
  }
  return buildMulList([num(c), ...list]);
}

function buildMulList(list) {
  let acc = list[0];
  for (let i = 1; i < list.length; i++) acc = { t: "mul", a: acc, b: list[i] };
  return acc;
}

/** 因子排序：数字 → 变量 → 幂 → 函数，同类按键排序，保证输出稳定。 */
function factorCmp(x, y) {
  const rank = (n) => {
    if (n.t === "num") return 0;
    if (n.t === "var") return 1;
    if (n.t === "pow") return 2;
    if (n.t === "fn") return 3;
    return 4;
  };
  const rx = rank(x), ry = rank(y);
  if (rx !== ry) return rx - ry;
  return CMP(key(x), key(y));
}

/** 项的排序（和式稳定输出）：按次数降序，再按键。 */
function termSortCmp(a, b) {
  const da = sortDeg(a), db = sortDeg(b);
  if (da !== db) return db - da;
  return CMP(key(a), key(b));
}
function sortDeg(n) {
  if (n.t === "pow" && isNum(n.b)) return Number(n.b.v.toNumber());
  if (n.t === "var") return 1;
  if (n.t === "num") return -1e9;
  if (n.t === "neg") return sortDeg(n.a);
  if (n.t === "mul") return Math.max(sortDeg(n.a), sortDeg(n.b));
  return 0;
}

/** 有理数底数的整数次幂（保持精确）。 */
function powRat(base, expNode) {
  if (!isNum(expNode)) return null;
  const e = expNode.v;
  if (e.isInt) {
    const k = e.n;
    if (k >= 0n) {
      if (k > 4096n) return null;
      return new Rat(base.n ** k, base.d ** k);
    }
    const kk = -k;
    if (kk > 4096n) return null;
    if (base.isZero) return null;
    return new Rat(base.d ** kk, base.n ** kk);
  }
  return null;
}

/**
 * 化简（含常数折叠、恒等式、合并同类项）。
 * 输出稳定：同样输入永远得到结构相同的输出。
 */
function simplify(node) {
  return simp(node, new Map());
}

function simp(n, cache) {
  if (!n || typeof n !== "object") throw new Error("simplify 收到非法节点");
  const k = key(n);
  if (cache.has(k)) return cache.get(k);
  const r = simpInner(n, cache);
  cache.set(k, r);
  return r;
}

function simpInner(n, cache) {
  switch (n.t) {
    case "num": return num(n.v);
    case "var": return variable(n.name);
    case "fn":
      if (n.arg === null) return { t: "fn", name: n.name, arg: null };
      return { t: "fn", name: n.name, arg: simp(n.arg, cache) };
    case "neg": {
      const a = simp(n.a, cache);
      if (isNum(a)) return num(a.v.neg());
      if (a.t === "neg") return a.a;
      return makeProd([num(ri(-1)), a]);
    }
    case "add": return simplifySum(flattenSum(n).map((t) => simp(t, cache)));
    case "mul": return makeProd(flattenProd(n).map((f) => simp(f, cache)));
    case "pow": {
      const a = simp(n.a, cache), b = simp(n.b, cache);
      return simpPow(a, b);
    }
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
}

function simpPow(a, b) {
  if (isNum(b)) {
    if (b.v.isZero) return n1();
    if (b.v.isOne) return a;
    if (isNum(a)) {
      const r = powRat(a.v, b);
      if (r) return num(r);
    }
  }
  // e^x 与 exp(x) 统一成 exp(x)，两种写法行为完全一致
  if (isENode(a)) return { t: "fn", name: "exp", arg: b };
  if (isNum(a) && a.v.isZero) return b.t === "num" && b.v.sign > 0 ? n0() : { t: "pow", a, b };
  if (isNum(a) && a.v.isOne) return n1();
  if (b.t === "num" && b.v.eq(ri(-1))) return { t: "pow", a, b };
  if (a.t === "pow" && isNum(a.b) && isNum(b)) {
    const e = a.b.v.mul(b.v);
    if (e.isOne) return a.a;
    if (e.isZero) return n1();
    return { t: "pow", a: a.a, b: num(e) };
  }
  return { t: "pow", a, b };
}

/** 和式化简：合并同类项 + 常数折叠 + 稳定排序。 */
function simplifySum(terms) {
  const groups = new Map();
  for (const t of terms) {
    const { c, base } = coeffOf(t);
    if (c.isZero) continue;
    const bk = factKey(base);
    const g = groups.get(bk);
    if (g) g.c = g.c.add(c);
    else groups.set(bk, { c, base });
  }
  const out = [];
  for (const g of [...groups.values()]) {
    if (g.c.isZero) continue;
    if (g.base === null) { out.push(num(g.c)); continue; }
    out.push(makeProd([num(g.c), g.base]));
  }
  if (out.length === 0) return n0();
  if (out.length === 1) return out[0];
  const nums = out.filter(isNum);
  const rest = out.filter((x) => !isNum(x));
  rest.sort(termSortCmp);
  const all = [...rest, ...nums]; // 常数项放最后，符合书写习惯
  let acc = all[0];
  for (let i = 1; i < all.length; i++) acc = { t: "add", a: acc, b: all[i] };
  return acc;
}

/* ============================== 7. 打印 ============================== */

const PREC_ADD = 1, PREC_MUL = 2, PREC_NEG = 3, PREC_POW = 4, PREC_ATOM = 5;

function prec(n) {
  switch (n.t) {
    case "add": return PREC_ADD;
    case "mul": return PREC_MUL;
    case "neg": return PREC_NEG;
    case "pow": return PREC_POW;
    default: return PREC_ATOM;
  }
}

/** 原子形状（数字/变量/函数调用/幂），打印时不需要额外括号。 */
function isAtomish(n) {
  return n.t === "num" || n.t === "var" || n.t === "fn" || n.t === "pow";
}

/** 负系数拆分：用于 a - b 的打印。返回其相反数（正系数形式），无负号则 null。 */
function negSplit(n) {
  if (n.t === "neg") return n.a;
  if (isNum(n) && n.v.sign < 0) return num(n.v.neg());
  if (n.t === "mul") {
    const { c, base } = coeffOf(n);
    if (base !== null && c.sign < 0) return makeProd([num(c.neg()), base]);
  }
  return null;
}

function fmt(n, parentPrec) {
  const p = prec(n);
  let s;
  switch (n.t) {
    case "num": s = n.v.toString(); break;
    case "var": s = n.name; break;
    case "fn": s = n.arg === null ? n.name : n.name + "(" + fmt(n.arg, 0) + ")"; break;
    case "neg": {
      s = prec(n.a) < PREC_MUL ? "-(" + fmt(n.a, 0) + ")" : "-" + fmt(n.a, PREC_NEG);
      break;
    }
    case "pow": {
      const basePrec = isAtomish(n.a) ? PREC_ATOM : PREC_MUL;
      let base = fmt(n.a, basePrec);
      if (isNum(n.a) && n.a.v.sign < 0) base = "(" + n.a.v.toString() + ")";
      // 负整数指数打印成分式，避免出现 x^2^-1 这种令人困惑的写法
      if (isNum(n.b) && n.b.v.isInt && n.b.v.sign < 0) {
        const m = n.b.v.neg();
        const denom = m.isOne ? base : base + "^" + m.toString();
        s = "1/" + (isAtomish(n.a) ? denom : "(" + denom + ")");
        break;
      }
      s = base + "^" + fmt(n.b, PREC_POW);
      break;
    }
    case "mul": s = fmtProduct(n); break;
    case "add": s = fmtSum(n); break;
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
  if (p < parentPrec) s = "(" + s + ")";
  return s;
}

function fmtSum(n) {
  const terms = flattenSum(n);
  let out = "";
  for (let i = 0; i < terms.length; i++) {
    const t = terms[i];
    if (i === 0) {
      out += fmtProduct(t);
    } else {
      const pos = negSplit(t);
      if (pos !== null) out += " - " + fmtProduct(pos);
      else out += " + " + fmtProduct(t);
    }
  }
  return out;
}

function fmtProduct(n) {
  if (n.t === "neg") return "-" + fmtProduct(n.a);
  if (n.t !== "mul") return fmt(n, PREC_MUL);
  const factors = flattenProd(n);
  let c = R1;
  const rest = [];
  for (const f of factors) {
    if (isNum(f)) c = c.mul(f.v);
    else rest.push(f);
  }
  if (rest.length === 0) return c.toString();
  rest.sort(factorCmp);
  const sign = c.sign < 0 ? "-" : "";
  const absC = c.abs();
  let head = "";
  if (absC.isOne) head = "";
  else if (absC.n === 1n && absC.d !== 1n) head = "";
  else head = absC.toString() + "*";

  if (head === "" && absC.n === 1n && absC.d !== 1n) body = body + "/" + absC.d.toString();

const FN_EVAL = {
  sin: Math.sin, cos: Math.cos, tan: Math.tan,
  asin: Math.asin, acos: Math.acos, atan: Math.atan,
  sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  sech: (x) => 1 / Math.cosh(x),
  coth: (x) => Math.cosh(x) / Math.sinh(x),
  ln: (x) => (x === 0 ? -Infinity : (x < 0 ? NaN : Math.log(x))),
  log: (x) => (x === 0 ? -Infinity : (x < 0 ? NaN : Math.log(x))),
  exp: Math.exp, sqrt: Math.sqrt, abs: Math.abs,

/** 代入数值：返回 number（可能 Infinity / NaN，不抛错）。 */
function evalAt(node, x, varName = "x") {
  return ev(node, { x, varName });

function ev(n, env) {
  switch (n.t) {
    case "num": return n.v.toNumber();
    case "var": return n.name === env.varName ? env.x : NaN;
    case "neg": return -ev(n.a, env);
    case "add": return ev(n.a, env) + ev(n.b, env);
    case "mul": return ev(n.a, env) * ev(n.b, env);
    case "pow": {
      const b = ev(n.a, env), e = ev(n.b, env);
      if (b === 0 && e === 0) return NaN;
      if (b < 0 && !Number.isInteger(e)) return NaN;
      return Math.pow(b, e);
    }
    case "fn": {
      if (n.arg === null) return n.name === "pi" ? Math.PI : Math.E;
      const a = ev(n.arg, env);
      if (n.name === "cot") return Math.cos(a) / Math.sin(a);
      if (n.name === "sec") return 1 / Math.cos(a);
      if (n.name === "csc") return 1 / Math.sin(a);
      const f = FN_EVAL[n.name];
      if (!f) throw new Error("未知函数：" + n.name);
      return f(a);
    }
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
}

/** 纯有理数求值：全部用 Rat 计算，除不尽（如 sin、sqrt）返回 null。 */
function evalRat(n, x, varName = "x") {
  switch (n.t) {
    case "num": return n.v;
    case "var": return n.name === varName ? x : null;
    case "neg": { const a = evalRat(n.a, x, varName); return a === null ? null : a.neg(); }
    case "add": {
      const a = evalRat(n.a, x, varName), b = evalRat(n.b, x, varName);
      return (a === null || b === null) ? null : a.add(b);
    }
    case "mul": {
      const a = evalRat(n.a, x, varName), b = evalRat(n.b, x, varName);
      return (a === null || b === null) ? null : a.mul(b);
    }
    case "pow": {
      const a = evalRat(n.a, x, varName), b = evalRat(n.b, x, varName);
      if (a === null || b === null || !b.isInt) return null;
      const k = b.n;
      if (k >= 0n) return new Rat(a.n ** k, a.d ** k);
      if (a.isZero) return null;
      const kk = -k;
      return new Rat(a.d ** kk, a.n ** kk);
    }
    default: return null;
  }
}

  exp: (a) => ({ t: "fn", name: "exp", arg: a }),

/**
 * 求导（结果已 simplify）。
 * 规则齐全：幂、积、商、链式、以及 a^b 的一般式（对数求导）。
 */
function deriv(node, varName = "x") {
  return d(node, varName);
}

function d(n, v) {
  switch (n.t) {
    case "num": return n0();
    case "var": return n.name === v ? n1() : n0();
    case "neg": return { t: "neg", a: d(n.a, v) };
    case "add": return smooth({ t: "add", a: d(n.a, v), b: d(n.b, v) });
    case "mul": {
      // 积法则：(uv)' = u'v + uv'
      const a = d(n.a, v), b = d(n.b, v);
      return smooth({
        t: "add",
        a: { t: "mul", a, b: clone(n.b) },
        b: { t: "mul", a: clone(n.a), b },
      });
    }
    case "pow": {
      const base = n.a, exp = n.b;
      if (isNum(exp)) {
        // 幂法则（含链式）：n * base^(n-1) * base'
        const k = exp.v;
        const newExp = k.sub(R1);
        const p = newExp.isZero ? clone(base) : { t: "pow", a: clone(base), b: num(newExp) };
        return smooth({ t: "mul", a: num(k), b: { t: "mul", a: p, b: d(base, v) } });
      }
      if (isNum(base) || isENode(base)) {
        // 指数法则：(a^u)' = a^u * ln(a) * u'（a = e 时 ln(a) = 1）
        const lnA = isENode(base) ? n1() : { t: "fn", name: "ln", arg: num(base.v) };
        return smooth({ t: "mul", a: { t: "mul", a: clone(n), b: lnA }, b: d(exp, v) });
      }
      // 一般式（对数求导）：(u^w)' = u^w * (w' * ln u + w * u'/u)
      const u = clone(base), w = clone(exp);
      const term1 = { t: "mul", a: d(exp, v), b: { t: "fn", name: "ln", arg: u } };
      const term2 = { t: "mul", a: w, b: { t: "mul", a: d(base, v), b: { t: "pow", a: clone(base), b: num(ri(-1)) } } };
      return smooth({ t: "mul", a: clone(n), b: { t: "add", a: term1, b: term2 } });
    }
    case "fn": {
      if (n.arg === null) return n0();
      const rule = DERIV_FN[n.name];
      if (!rule) throw new Error("不支持对函数 " + n.name + " 求导");
      const outer = rule(clone(n.arg));
      const inner = d(n.arg, v);
      if (isOneNode(inner)) return smooth(outer);
      return smooth({ t: "mul", a: outer, b: inner });
    }
    default: throw new Error("未知的 AST 节点类型：" + n.t);
  }
}

    return { basis: basis, dim: basis.length };
  }
  function eyeFrac(n){
    var M = [], i, j;
    for (i = 0; i < n; i++){ var r = []; for (j = 0; j < n; j++) r.push(i === j ? ONE : ZERO); M.push(r); }
    return M;
  }
  /* 值之间的除法与开方：数值走 Frac，出现无理数就升成符号值（例如 1/√3） */
  function vDiv(x, y){
    if (isSym(x) || isSym(y)) {
      return symOf(Calc.simplify({ t: "mul", a: sExpr(x), b: { t: "pow", a: sExpr(y), b: Calc.num(-1) } }));
    }
    return x.div(y);
  }
  function vSqrt(x){
    if (isSym(x)) return symOf(Calc.simplify({ t: "fn", name: "sqrt", arg: x.expr }));
    var n = x.n, d = x.d;
    if (n < 0n) return symOf(Calc.simplify({ t: "fn", name: "sqrt", arg: Calc.num(n, d) }));
    var sn = isqrt(n), sd = isqrt(d);
    if (sn * sn === n && sd * sd === d) return new Frac(sn, sd);
    /* 无理数（例如 1/√3）：升成符号值，直接用符号引擎的 sqrt 节点 */
    return symOf(Calc.simplify({ t: "fn", name: "sqrt", arg: Calc.num(n, d) }));
  }

  /* ---------- 矩阵的 n 次幂（n 为非负整数，方阵） ---------- */
  function matPow(M, k){
    var s = shape(M);
    if (s[0] !== s[1]) throw new Error("求幂要求方阵");
    if (typeof k !== "number" || !isFinite(k) || k < 0 || Math.floor(k) !== k) {
      throw new Error("幂次要是非负整数（例如 3）");
    }
    var R = eyeFrac(s[0]), B = clone(M), e = k;
    /* 快速幂：A^k = (A^2)^(k/2)…；k=0 时给单位阵 */
    while (e > 0){
      if (e % 2 === 1) R = matMul(R, B);
      e = Math.floor(e / 2);
      if (e > 0) B = matMul(B, B);
    }
    return R;
  }
  /* ---------- 施密特（Gram–Schmidt）正交化：把 A 的列向量组变成正交组 ---------- */
  function gramSchmidt(M){
    var s = shape(M), rows = s[0], cols = s[1], i, j, k;
    var alphas = [];
    for (j = 0; j < cols; j++){
      var a = [];
      for (i = 0; i < rows; i++) a.push(val(M[i][j]));
      alphas.push(a);
    }
    function dot(u, v){ var t = ZERO; for (var q = 0; q < u.length; q++) t = vAdd(t, vMul(u[q], v[q])); return t; }
    function vnorm2(u){ return dot(u, u); }
    var betas = [], steps = [], zeroCol = -1;
    for (k = 0; k < alphas.length; k++){
      var b = alphas[k].slice(), projs = [];
      for (j = 0; j < k; j++){
        if (vnorm2(betas[j]).isZero()) continue;
        var coef = vDiv(dot(alphas[k], betas[j]), vnorm2(betas[j]));
        var pv = betas[j].map(function(x){ return vMul(coef, x); });
        projs.push({ from: j + 1, coef: coef, vec: pv });
        for (i = 0; i < rows; i++) b[i] = vSub(b[i], pv[i]);
      }
      betas.push(b);
      steps.push({ index: k, alpha: alphas[k], beta: b, projs: projs, norm2: vnorm2(b) });
      if (vnorm2(b).isZero() && zeroCol < 0) zeroCol = k;
    }
    /* 单位化 */
    var es = betas.map(function(b, idx){
      var n2 = vnorm2(b);
      if (n2.isZero()) return b.map(function(){ return ZERO; });
      var len = vSqrt(n2);
      return b.map(function(x){ return vDiv(x, len); });
    });
    /* 原来这组向量线性相关吗？有零向量就说明相关 */
    return { alphas: alphas, betas: betas, es: es, steps: steps, dependent: zeroCol >= 0, firstZero: zeroCol };
  }
  function rowSteps(M){
    guardRowMap(M);
    var A = clone(M), s = shape(A), rows = s[0], cols = s[1];
    var E = eyeFrac(rows), steps = [], r = 0, i, j, c;
    function snap(kind, info, Ei){
      steps.push({ kind: kind, row: r, target: info.i, other: info.p, mult: info.mult, pivot: info.pivot, R: clone(A), Ei: Ei, E: clone(E) });
    }
    for (c = 0; c < cols && r < rows; c++){
      var p = -1;
      for (i = r; i < rows; i++) if (!A[i][c].isZero()) { p = i; break; }
      if (p < 0) continue;
      if (p !== r){
        var t1 = A[r]; A[r] = A[p]; A[p] = t1;
        var t2 = E[r]; E[r] = E[p]; E[p] = t2;
        var Esw = eyeFrac(rows), t3 = Esw[r]; Esw[r] = Esw[p]; Esw[p] = t3;
        snap("swap", { p: p }, Esw);
      }
      var pv = A[r][c];
      if (!(pv.n === 1n && pv.d === 1n)){
        for (j = 0; j < cols; j++) A[r][j] = A[r][j].div(pv);
        for (j = 0; j < rows; j++) E[r][j] = E[r][j].div(pv);
        var Esc = eyeFrac(rows); Esc[r][r] = ONE.div(pv);
        snap("scale", { pivot: pv }, Esc);
      }
      for (i = 0; i < rows; i++){
        if (i === r || A[i][c].isZero()) continue;
        var f = A[i][c];
        for (j = 0; j < cols; j++) A[i][j] = A[i][j].sub(f.mul(A[r][j]));
        for (j = 0; j < rows; j++) E[i][j] = E[i][j].sub(f.mul(E[r][j]));
        var Eel = eyeFrac(rows); Eel[i][r] = f.neg();
        snap("elim", { i: i, mult: f }, Eel);

      r++;
    }
    return { R: A, steps: steps, E: E, rank: r };
  }
  function rank(M){ return rref(M).rank; }
  function inverse(M){
    var s = shape(M), n = s[0];
    if (n !== s[1]) throw new Error("求逆要求方阵");
    guardNoDiv(M);
    var A = clone(M), I = [];
    for (var i = 0; i < n; i++){
      var row = [];
      for (var j = 0; j < n; j++) row.push(i === j ? ONE : ZERO);
      I.push(row);
    }
    for (var c = 0; c < n; c++){
      var p = -1;
      for (var i2 = c; i2 < n; i2++) if (!A[i2][c].isZero()) { p = i2; break; }
      if (p < 0) throw new Error("矩阵不可逆（行列式为 0）");

        var t = A[c]; A[c] = A[p]; A[p] = t;
        var t2 = I[c]; I[c] = I[p]; I[p] = t2;
      }
      var pv = A[c][c];
      for (var j = 0; j < n; j++){ A[c][j] = A[c][j].div(pv); I[c][j] = I[c][j].div(pv); }
      for (var i3 = 0; i3 < n; i3++){
        if (i3 === c) continue;
        var f = A[i3][c];
        if (f.isZero()) continue;
        for (var j3 = 0; j3 < n; j3++){
          A[i3][j3] = A[i3][j3].sub(f.mul(A[c][j3]));
          I[i3][j3] = I[i3][j3].sub(f.mul(I[c][j3]));
        }
      }
    }
    return I;
  }
  function solve(A, b){
    var s = shape(A);
    shape(b);
    guardRowMap(A);
    guardRowMap(b);
    if (b[0].length !== 1) throw new Error("b 要是一列（列数 1）");
    if (b.length !== s[0]) throw new Error("b 的行数要等于 A 的行数（" + s[0] + "）");
    var cols = s[1];
    var aug = A.map(function(r, i){ return r.concat([b[i][0]]); });
    var res = rref(aug), R = res.R, piv = res.pivots, rk = res.rank;
    for (var i = 0; i < R.length; i++){
      var zero = true;
      for (var j = 0; j < cols; j++) if (!R[i][j].isZero()) { zero = false; break; }
      if (zero && !R[i][cols].isZero()) return { type: "none", rankA: rref(A).rank, rankAug: rk };
    }
    var x = [];
    for (var j2 = 0; j2 < cols; j2++) x.push(ZERO);

    if (rk < cols) return { type: "infinite", free: cols - rk, x: x, rankA: rankA, rankAug: rk };

  }
  function generalSolution(A, b){
    var r = solve(A, b);
    if (r.type === "none") return { type: "none", rankA: r.rankA, rankAug: r.rankAug };
    if (r.type === "unique") return { type: "unique", particular: r.x, basis: [], free: 0, rankA: r.rankA, rankAug: r.rankAug };
    var ns = nullspaceBasis(A);
    return { type: "infinite", particular: r.x, basis: ns.basis, free: r.free, rankA: r.rankA, rankAug: r.rankAug };
  }

  function numMat(A){ return A.map(function(r){ return r.map(function(v){ return v.toNumber(); }); }); }
  function idNum(n){ var M = []; for (var i = 0; i < n; i++){ var r = []; for (var j = 0; j < n; j++) r.push(i === j ? 1 : 0); M.push(r); } return M; }

  }
  function durandKerner(coef){
    var n = coef.length;
    if (n === 0) return [];
    var p = [1].concat(coef);
    function evalP(z){
      var vr = p[0], vi = 0;
      for (var i = 1; i < p.length; i++){
        var nr = vr * z.re - vi * z.im + p[i];
        var ni = vr * z.im + vi * z.re;
        vr = nr; vi = ni;
      }

      roots.push({ re: cur.re, im: cur.im });

      var ni = cur.re * seed.im + cur.im * seed.re;
      cur = { re: nr, im: ni };
    }
    for (var iter = 0; iter < 400; iter++){
      var maxd = 0;
      for (var i = 0; i < n; i++){
        var num = evalP(roots[i]);
        var dr = 1, di = 0;
        for (var j = 0; j < n; j++){
          if (j === i) continue;
          var ar = roots[i].re - roots[j].re, ai = roots[i].im - roots[j].im;
          var q = dr * ar - di * ai, q2 = dr * ai + di * ar;
          dr = q; di = q2;
        }
        var den = dr * dr + di * di;
        if (den === 0) continue;
        var ur = (num.re * dr + num.im * di) / den;
        var ui = (num.im * dr - num.re * di) / den;
        roots[i] = { re: roots[i].re - ur, im: roots[i].im - ui };
        var mag = Math.sqrt(ur * ur + ui * ui);
        if (mag > maxd) maxd = mag;
      }
      if (maxd < 1e-15) break;
    }
    roots.forEach(function(r){
      if (Math.abs(r.re) < 1e-12) r.re = 0;
      if (Math.abs(r.im) < 1e-12) r.im = 0;
    });
    roots.sort(function(a, b){ return a.re !== b.re ? a.re - b.re : a.im - b.im; });
    return roots;
  }
  function eigen(A){
    var s = shape(A), n = s[0];
    if (n !== s[1]) throw new Error("特征值要求方阵");

      var r1 = Math.sqrt(-dd);

    shape: shape, matAdd: matAdd, matSub: matSub, matMul: matMul, scaleMat: scaleMat,

    generalSolution: generalSolution, rowSteps: rowSteps, eyeFrac: eyeFrac,
    matPow: matPow, gramSchmidt: gramSchmidt,

    V: val, val: val, valMat: valMat, isSym: isSym, Sym: Sym, calc: Calc, augSolve: augSolve
  };
})();
/* ==== ENGINE END ==== */
</script>

<script>
(function(){
  "use strict";
  var L = LinAlg, F = L.F;

  var OPS = {
    add:   { label: "A + B", needB: true,  hint: "A 与 B 的行数、列数都要相同" },
    sub:   { label: "A − B", needB: true,  hint: "A 与 B 的行数、列数都要相同" },
    mul:   { label: "A × B", needB: true,  hint: "A 的列数要等于 B 的行数" },
    kA:    { label: "k · A", needB: false, hint: "k 填在右侧的小输入框里，可以是分数" },
    trans: { label: "Aᵀ",    needB: false, hint: "转置：行列互换" },
    det:   { label: "det A", needB: false, hint: "要求方阵" },
    inv:   { label: "A⁻¹",   needB: false, hint: "要求方阵，且行列式不为 0" },
    rank:  { label: "rank A", needB: false, hint: "矩阵的秩" },
    trace: { label: "tr A",  needB: false, hint: "要求方阵" },
    ref:   { label: "REF A", needB: false, hint: "行阶梯形：主元下方清零，主元不归一、主元上方不清" },
    rref:  { label: "RREF A", needB: false, hint: "行最简形：主元归一为 1，主元上下都清零" },
    steps: { label: "RREF 化简步骤", needB: false, hint: "一步一步做初等行变换，一路化到行最简形（RREF）；每步附上该步的初等矩阵 E" },
    solve: { label: "Ax = b 的解", needB: true, hint: "把 B 做成只有 1 列，当作 b 向量" },
    aug:   { label: "增广矩阵求解", needB: false, hint: "把 A 填成增广矩阵 [A|b]：最后一列当作 b，前面是系数矩阵（列数至少 2）" },
    pow:   { label: "A 的 n 次幂", needB: false, hint: "n 填在右侧小输入框里，要是非负整数（例如 3）；要求方阵" },

    eig:   { label: "A 的特征值", needB: false, hint: "要求方阵；2 阶给精确解，3–4 阶为数值解" },
    ker:   { label: "ker A 的基", needB: false, hint: "零空间：被 A 压成零向量的那些方向" },
    col:   { label: "col A 的基", needB: false, hint: "列空间：A 的列向量张成的空间" }

  var PAD_KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "/", ".", "⌫"];
  var padCell = {}, padLast = {};
  function padBuild(){
    ["A", "B"].forEach(function(k){
      var box = el("pad" + k);
      if (!box) return;
      box.innerHTML = PAD_KEYS.map(function(c){
        return '<button type="button" class="kk" data-padk="' + k + '" data-c="' + c + '">' + c + "</button>";
      }).join("");
      if (!padLast[k]) padLast[k] = null;
    });
  }
  function padShow(k, cell){
    padCell[k] = cell; padLast[k] = cell;
    var box = el("pad" + k);
    if (box) box.hidden = false;
  }
  function padHide(k){
    var box = el("pad" + k);
    if (box && !box.contains(document.activeElement)) box.hidden = true;
  }
  function padInsert(k, c){
    var list = ins(k);
    var cell = padCell[k] || padLast[k] || list[0];
    if (!cell || list.indexOf(cell) < 0) cell = list[0];
    if (!cell) return;
    var v = cell.value, s = cell.selectionStart, e = cell.selectionEnd;
    if (s === null || s === undefined){ s = v.length; e = v.length; }
    if (c === "⌫"){
      if (s === e && s > 0){ cell.value = v.slice(0, s - 1) + v.slice(s); s = s - 1; }
      else cell.value = v.slice(0, s) + v.slice(e);
    } else {
      cell.value = v.slice(0, s) + c + v.slice(e);
      s = s + 1;
    }
    padCell[k] = cell; padLast[k] = cell;
    var box = el("pad" + k);
    if (box) box.hidden = false;
    cell.focus();
    try { cell.setSelectionRange(s, s); } catch (err) {}
  }
  document.addEventListener("mousedown", function(e){
    var t = e.target && e.target.closest ? e.target.closest(".kk") : null;
    if (t) e.preventDefault();
  });
  document.addEventListener("touchstart", function(e){
    var t = e.target && e.target.closest ? e.target.closest(".kk") : null;
    if (t) e.preventDefault();
  }, { passive: false });
  document.addEventListener("click", function(e){
    var t = e.target && e.target.closest ? e.target.closest(".kk") : null;
    if (!t) return;
    padInsert(t.getAttribute("data-padk"), t.getAttribute("data-c"));
  });

  function capture(k){
    var s = S[k], list = ins(k), out = [], i = 0;
    for (var y = 0; y < s.r; y++){
      var row = [];
      for (var x = 0; x < s.c; x++){ var node = list[i]; i++; row.push(node ? node.value : ""); }
      out.push(row);
    }
    grid(k)._vals = out;
    return out;
  }
  function build(k){
    var s = S[k], box = grid(k), vals = box._vals || [];
    box.innerHTML = "";
    box.style.setProperty("--cols", s.c);
    for (var y = 0; y < s.r; y++){
      for (var x = 0; x < s.c; x++){
        var inp = document.createElement("input");
        inp.type = "text";
        inp.inputMode = "text";
        inp.setAttribute("autocomplete", "off");
        inp.setAttribute("autocapitalize", "off");
        inp.spellcheck = false;
        inp.placeholder = "0";

          if (e.key !== "Enter") return;
          e.preventDefault();
          if (e.ctrlKey || e.metaKey || e.shiftKey){ run(); return; }

          var next = list[(idx + 1) % list.length];

        });
