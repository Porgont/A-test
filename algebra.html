        inp.addEventListener("focus", function(){ padShow(k, this); });
        inp.addEventListener("blur", function(){
          var self = this;
          setTimeout(function(){ if (document.activeElement !== self) padHide(k); }, 150);
        });
        box.appendChild(inp);
      }
    }
    el("d" + k + "-r").textContent = s.r;
    el("d" + k + "-c").textContent = s.c;
    geoDraw();
  }
  function resize(k, axis, d){
    capture(k);
    var s = S[k], next = (axis === "r" ? s.r : s.c) + d;
    if (next < 1 || next > 6) return;
    if (axis === "r") s.r = next; else s.c = next;
    build(k);
  }
  function fill(k, kind){
    capture(k);
    var s = S[k], rows = [];
    for (var y = 0; y < s.r; y++){
      var row = [];
      for (var x = 0; x < s.c; x++){
        if (kind === "clear") row.push("");
        else if (kind === "zero") row.push("0");
        else if (kind === "eye") row.push(y === x ? "1" : "0");
        else row.push(String(Math.floor(Math.random() * 11) - 5));
      }
      rows.push(row);
    }
    grid(k)._vals = rows;
    build(k);
  }
  function readMatrix(k){
    var s = S[k], list = ins(k), M = [], i = 0;
    for (var y = 0; y < s.r; y++){
      var row = [];
      for (var x = 0; x < s.c; x++){ var node = list[i]; i++; row.push(L.val(node ? node.value : "")); }
      M.push(row);
    }
    return M;
  }

  function fmtNum(x){
    if (!isFinite(x)) return String(x);
    if (Math.abs(x) < 1e-12) x = 0;
    var s = (Math.abs(x) >= 1e-6 || x === 0) ? x.toFixed(6) : x.toExponential(4);
    if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
    if (s === "-0") s = "0";
    return s;
  }
  function fracHTML(f){
    if (f.d === 1n) return String(f.n);
    var neg = f.n < 0n, n = neg ? -f.n : f.n;
    return (neg ? "−" : "") + '<span class="frac"><span class="fn">' + n + '</span><span class="fd">' + f.d + "</span></span>";
  }
  /* 符号表达式的显示美化：· 代乘号、真上标、π */
  function renderSym(t){
    return String(t)
      .replace(/\s*\*\s*/g, "·")
      .replace(/\^\(([^()]*)\)/g, function(m, d){ return "<sup>" + d.replace(/-/g, "−") + "</sup>"; })
      .replace(/\^([0-9]+)/g, function(m, d){ return "<sup>" + d + "</sup>"; })
      .replace(/pi/g, "π")
      .replace(/-/g, "−");
  }
  function cellHTML(f){
    if (L.isSym(f)) return renderSym(f.toString());
    return S.dec ? fmtNum(f.toNumber()) : fracHTML(f);
  }
  var SUBS = ["₀", "₁", "₂", "₃", "₄", "₅", "₆", "₇"];
  var SUPS = ["⁰", "¹", "²", "³", "⁴", "⁵", "⁶", "⁷", "⁸", "⁹"];
  function rn(n){ return "R" + String(n).split("").map(function(ch){ return SUPS[+ch] || ch; }).join(""); }
  function vecGridHTML(v){
    var h = '<div class="rgrid vec" style="--cols:1">';
    v.forEach(function(x){ h += '<div class="rcell">' + cellHTML(x) + "</div>"; });
    return h + "</div>";
  }
  function tupleHTML(v){
    return "(" + v.map(function(f){ return L.isSym(f) ? renderSym(f.toString()) : (S.dec ? fmtNum(f.toNumber()) : fracHTML(f)); }).join(", ") + ")";
  }
  function kName(j){ return "k" + SUBS[j + 1]; }
  function coordExpr(i, p, basis){
    var terms = [], j;
    if (!p[i].isZero() || basis.length === 0){
      terms.push({ neg: p[i].n < 0n, txt: S.dec ? fmtNum(Math.abs(p[i].toNumber())) : fracHTML(p[i].n < 0n ? p[i].neg() : p[i]) });
    }
    for (j = 0; j < basis.length; j++){
      var c = basis[j][i];
      if (c.isZero()) continue;
      var mag = Math.abs(c.toNumber());
      var pos = c.n < 0n ? c.neg() : c;
      var coefTxt = S.dec ? fmtNum(mag) : fracHTML(pos);
      var isInt = S.dec ? Math.abs(mag - Math.round(mag)) < 1e-12 : pos.d === 1n;
      var coef = (Math.abs(mag - 1) < 1e-12) ? "" : (isInt ? coefTxt : "(" + coefTxt + ")");
      terms.push({ neg: c.n < 0n, txt: coef + kName(j) });
    }
    if (!terms.length) return "0";
    var out = (terms[0].neg ? "−" : "") + terms[0].txt;
    for (j = 1; j < terms.length; j++) out += (terms[j].neg ? " − " : " + ") + terms[j].txt;
    return out;
  }
  function setHTML(p, basis){
    var s = "S = { " + tupleHTML(p);
    basis.forEach(function(v, j){ s += " + " + kName(j) + tupleHTML(v); });
    s += " }";
    return s;
  }
  function coordLines(p, basis){
    var out = [], i;
    for (i = 0; i < p.length; i++) out.push("x" + SUBS[i + 1] + " = " + coordExpr(i, p, basis));
    return out.join("<br>");
  }
  function kListHTML(basis){
    var names = [];
    basis.forEach(function(v, j){ names.push(kName(j)); });
    return names.join(", ") + " ∈ R";
  }
  function ctext(f){
    var neg = f.n < 0n, pos = neg ? f.neg() : f;
    var val = f.toNumber();
    var txt = S.dec ? fmtNum(Math.abs(val)) : fracHTML(pos);
    var isInt = S.dec ? Math.abs(Math.abs(val) - Math.round(Math.abs(val))) < 1e-12 : pos.d === 1n;
    return (neg ? "−" : "") + (isInt ? txt : "(" + txt + ")");
  }
  function matBoxHTML(M, label){
    var cols = M[0] ? M[0].length : 1;
    var h = '<div class="matwrap"><div class="matlab">' + label + '</div><div class="rgrid" style="--cols:' + cols + '">';
    M.forEach(function(row){ row.forEach(function(x){ h += '<div class="rcell">' + cellHTML(x) + "</div>"; }); });
    return h + "</div></div>";
  }
  function stepDescHTML(s){
    function rn2(i){ return "r" + (SUBS[i + 1] || (i + 1)); }
    if (s.kind === "swap") return "交换 " + rn2(s.row) + " 与 " + rn2(s.other);
    if (s.kind === "scale") return rn2(s.row) + " ← " + rn2(s.row) + " ÷ " + ctext(s.pivot);
    return rn2(s.target) + " ← " + rn2(s.target) + " − " + ctext(s.mult) + "·" + rn2(s.row);
  }
  function blockHTML(b){
    if (b.type === "matrix"){
      var c = b.data[0] ? b.data[0].length : 1;
      var h = '<div class="rgrid' + (b.big ? " big" : "") + '" style="--cols:' + c + '">';
      b.data.forEach(function(row){ row.forEach(function(v){ h += '<div class="rcell">' + cellHTML(v) + "</div>"; }); });
      return h + "</div>";
    }
    if (b.type === "vector"){
      var h2 = '<div class="rgrid vec" style="--cols:1">';
      b.data.forEach(function(v){ h2 += '<div class="rcell">' + cellHTML(v) + "</div>"; });
      return h2 + "</div>";
    }
    if (b.type === "step"){
      var sb = b.data, no = b.index + 1;
      return '<div class="stepbox"><div class="stepline"><span class="stepno">第 ' + no + ' 步</span>' + stepDescHTML(sb) + "</div>" +
        '<div class="stepmats">' + matBoxHTML(sb.R, "变换后的矩阵") + matBoxHTML(sb.Ei, "初等矩阵 E" + (SUBS[no] || no)) + "</div></div>";
    }
    if (b.type === "gensol"){
      var gd = b.data;
      var hg = '<div class="gsline"><span class="gslab">x =</span>' + vecGridHTML(gd.particular);
      gd.basis.forEach(function(v, i){
        hg += '<span class="gsop">+ k' + SUBS[i + 1] + '</span>' + vecGridHTML(v);
      });
      if (gd.basis.length === 0) hg += '<span class="gsop">（唯一解，零空间只有零向量）</span>';
      return hg + "</div>";
    }
    if (b.type === "vectors"){
      var hv = '<div class="vlist">';
      b.data.forEach(function(v, i){
        hv += '<div class="vrow"><span class="idx">v' + (i + 1) + '</span><div class="rgrid vec" style="--cols:1">';
        v.forEach(function(x){ hv += '<div class="rcell">' + cellHTML(x) + "</div>"; });
        hv += "</div></div>";
      });
      return hv + "</div>";
    }
    if (b.type === "scalar") return '<div class="scalar">' + cellHTML(b.data) + "</div>";
    if (b.type === "roots"){
      var h3 = '<div class="roots">';
      b.data.forEach(function(r, i){ h3 += '<div class="root"><span class="idx">λ' + (i + 1) + '</span>' + rootHTML(r) + "</div>"; });
      return h3 + "</div>";
    }
    return '<p class="' + (b.danger ? "msgerr" : "msg") + '">' + b.text + "</p>";
  }
  function rootHTML(r){
    if (r.exact && !S.dec) return fracHTML(r.exact);
    if (Math.abs(r.im) < 1e-9) return fmtNum(r.re);
    return fmtNum(r.re) + (r.im < 0 ? " − " : " + ") + fmtNum(Math.abs(r.im)) + "i";
  }
  function show(res){
    last = res;
    el("rlabel").textContent = res.label;
    var out = el("out");
    out.innerHTML = res.blocks.map(blockHTML).join("");
    out.classList.remove("pop");
    void out.offsetWidth;
    out.classList.add("pop");
  }
  function fail(msg){
    last = null;
    el("rlabel").textContent = OPS[S.op].label;
    el("out").innerHTML = '<p class="msgerr">' + msg + "</p>";
  }

  function run(){
    try{
      var op = S.op, o = OPS[op];
      var A = readMatrix("A");
      var B = o.needB ? readMatrix("B") : null;
      var res;
      if (op === "add") res = { label: "A + B", blocks: [{ type: "matrix", data: L.matAdd(A, B) }] };
      else if (op === "sub") res = { label: "A − B", blocks: [{ type: "matrix", data: L.matSub(A, B) }] };
      else if (op === "mul") res = { label: "A × B", blocks: [{ type: "matrix", data: L.matMul(A, B) }] };
      else if (op === "kA"){
        var k = L.val(el("kval").value);
        res = { label: k.toString() + " · A", blocks: [{ type: "matrix", data: L.scaleMat(A, k) }] };
      }
      else if (op === "trans") res = { label: "Aᵀ", blocks: [{ type: "matrix", data: L.transpose(A) }] };
      else if (op === "det") res = { label: "det A", blocks: [{ type: "scalar", data: L.det(A) }] };
      else if (op === "inv") res = { label: "A⁻¹", blocks: [{ type: "matrix", data: L.inverse(A) }] };
      else if (op === "rank") res = { label: "rank A", blocks: [{ type: "scalar", data: F(L.rank(A)) }] };
      else if (op === "trace") res = { label: "tr A", blocks: [{ type: "scalar", data: L.trace(A) }] };
      else if (op === "ref") res = { label: "REF A（行阶梯形）", blocks: [{ type: "matrix", data: L.ref(A).R }] };
      else if (op === "steps"){
        var rs = L.rowSteps(A);
        var blocks = [{ type: "text", text: "一共 " + rs.steps.length + " 步，一路化到<b>行最简形（RREF）</b>：主元先归一为 1，再把主元上下都清零。每步下方给出该步对应的<b>初等矩阵 E</b>——左乘它，就等于做这一步。" }];
        rs.steps.forEach(function(st, idx){ blocks.push({ type: "step", data: st, index: idx }); });
        blocks.push({ type: "text", text: "把每一步的初等矩阵按顺序乘起来，得到总的 <b>E = Eₖ⋯E₂E₁</b>：" });
        blocks.push({ type: "matrix", data: rs.E });
        blocks.push({ type: "text", text: "可以验证 <b>E · A = 下面的行最简形</b>；如果 A 是方阵且可逆，这个 E 正好就是 <b>A⁻¹</b>。" });
        blocks.push({ type: "text", text: "<b>最终结果：行最简形（RREF）</b>　——下面这个大图就是一路化简的终点。" });
        blocks.push({ type: "matrix", data: rs.R, big: true });
        res = { label: "RREF 化简步骤（化到行最简形）", blocks: blocks };
      }
      else if (op === "rref") res = { label: "RREF A（行最简形）", blocks: [{ type: "matrix", data: L.rref(A).R }] };
      else if (op === "solve"){
        var r = L.generalSolution(A, B);
        var nv = A[0] ? A[0].length : 0;
        if (r.type === "none") res = { label: "无解", blocks: [
          { type: "text", text: "方程组互相矛盾，没有解。", danger: true },
          { type: "text", text: "<b>解集</b>：S = ∅（空集）" }
        ] };
        else if (r.type === "unique") res = { label: "唯一解", blocks: [
          { type: "text", text: "dim ker A = 0（零空间只有零向量），所以解只有一个：" },
          { type: "gensol", data: r },
          { type: "text", text: "<b>坐标形式</b>：<br>" + coordLines(r.particular, []) },
          { type: "text", text: "<b>解集</b>：S = { " + tupleHTML(r.particular) + " }（只含这一个向量）" }
        ] };
        else res = { label: "通解 · 解集", blocks: [
          { type: "text", text: "无穷多解，自由变量 " + r.free + " 个。<b>向量形式</b>（通解 = 一个特解 + 齐次通解的线性组合）：" },
          { type: "gensol", data: r },
          { type: "text", text: "<b>坐标形式</b>：<br>" + coordLines(r.particular, r.basis) },
          { type: "text", text: "<b>解集</b>（集合写法，x ∈ " + rn(nv) + "）：<br>" + setHTML(r.particular, r.basis) + "<br>其中 " + kListHTML(r.basis) }
        ] };
      }
      else if (op === "aug"){
        var au = L.augSolve(A);
        var ab = [
          { type: "text", text: "增广矩阵 [A|b] 的行最简形：" },
          { type: "matrix", data: au.RREF },
          { type: "text", text: "未知数 " + au.unknown + " 个；<b>rank A = " + au.rankA + "</b>，<b>rank [A|b] = " + au.rankAug + "</b>。" }
        ];
        if (au.type === "none") ab.push({ type: "text", text: "<b>无解</b>：rank A &lt; rank [A|b]，方程互相矛盾。", danger: true });
        else if (au.type === "unique") ab.push({ type: "text", text: "<b>唯一解</b>：rank A = rank [A|b] = 未知数个数 " + au.unknown + "。" });
        else ab.push({ type: "text", text: "<b>无穷多解</b>：rank A = rank [A|b] &lt; 未知数个数，自由变量 " + au.free + " 个。" });
        if (au.type !== "none" && au.solution){
          ab.push({ type: "gensol", data: au.solution });
          ab.push({ type: "text", text: "<b>坐标形式</b>：<br>" + coordLines(au.solution.particular, au.solution.basis) });
          ab.push({ type: "text", text: "<b>解集</b>：<br>" + setHTML(au.solution.particular, au.solution.basis) +
            (au.solution.basis.length ? "<br>其中 " + kListHTML(au.solution.basis) : "") });
        }
        res = { label: "增广矩阵求解 [A|b]", blocks: ab };
      }
      else if (op === "pow"){
        var kk = parseFloat(el("kval").value);
        var AP = L.matPow(A, kk);
        res = { label: "A 的 " + (isFinite(kk) ? kk : "?") + " 次幂", blocks: [
          { type: "text", text: "方阵连乘（内部用快速幂），结果是精确分数：" },
          { type: "matrix", data: AP, big: true }
        ] };
      }
      else if (op === "gs"){
        var gs = L.gramSchmidt(A);
        var gb = [{ type: "text", text: "把 A 的每一列当成一个向量 α₁…αₙ，做施密特（Gram–Schmidt）正交化：<b>βₖ = αₖ − Σ (αₖ, βⱼ)/(βⱼ, βⱼ) · βⱼ</b>。" }];
        if (gs.dependent) gb.push({ type: "text", text: "注意：第 " + (gs.firstZero + 1) + " 个 β 算出来是<b>零向量</b>，说明原来这组向量<b>线性相关</b>（正交化过程中被减掉了）。", danger: true });
        gs.steps.forEach(function(st, i){
          var txt = "β" + (SUBS[i + 1] || i + 1) + " = α" + (SUBS[i + 1] || i + 1);
          if (st.projs.length) txt += st.projs.map(function(p){ return " − (" + p.coef.toString() + ")·β" + (SUBS[p.from] || p.from); }).join("");
          gb.push({ type: "text", text: txt });
        });
        gb.push({ type: "text", text: "<b>正交向量组 β</b>（两两内积为 0）：" });
        gs.betas.forEach(function(b, i){ gb.push({ type: "text", text: "β" + (SUBS[i + 1] || i + 1) + " = " + tupleHTML(b) }); });
        gb.push({ type: "text", text: "<b>单位化后的标准正交组 e</b>（每个向量长度为 1）：" });
        gs.es.forEach(function(e2, i){ gb.push({ type: "text", text: "e" + (SUBS[i + 1] || i + 1) + " = " + tupleHTML(e2) }); });
        res = { label: "施密特正交化（按列）", blocks: gb };
      }
      else if (op === "eig") res = { label: "A 的特征值", blocks: [{ type: "roots", data: L.eigen(A) }] };
      else if (op === "ker"){
        var kb = L.nullspaceBasis(A);
        if (kb.dim === 0) res = { label: "ker A", blocks: [{ type: "text", text: "零空间只有零向量：dim ker A = 0，A 的列向量线性无关。" }] };
        else res = { label: "ker A 的一组基", blocks: [
          { type: "text", text: "dim ker A = " + kb.dim + "（自由变量 " + kb.dim + " 个），一组基：" },
          { type: "vectors", data: kb.basis }
        ] };
      }
      else if (op === "col"){
        var cb = L.colspaceBasis(A);
        res = { label: "col A 的一组基", blocks: [
          { type: "text", text: "dim col A = rank A = " + cb.dim + "，取 A 的主元列：" },
          { type: "vectors", data: cb.basis }
        ] };
      }
      else throw new Error("未知运算");
      show(res);
    } catch (err){
      fail(err && err.message ? err.message : String(err));
    }
  }

  function copyOut(){
    if (!last){ flash("还没结果"); return; }
    var txt = last.label + "\n" + last.blocks.map(function(b){
      if (b.type === "matrix") return b.data.map(function(r){ return "[ " + r.map(function(v){ return v.toString(); }).join(", ") + " ]"; }).join("\n");
      if (b.type === "vector") return b.data.map(function(v){ return v.toString(); }).join("\n");
      if (b.type === "vectors") return b.data.map(function(v, i){ return "v" + (i + 1) + " = (" + v.map(function(x){ return x.toString(); }).join(", ") + ")"; }).join("\n");
      if (b.type === "step") return "第 " + (b.index + 1) + " 步：" + stepDescHTML(b.data).replace(/<[^>]+>/g, "") + "\n" +
        b.data.R.map(function(r){ return "[ " + r.map(function(x){ return x.toString(); }).join(", ") + " ]"; }).join("\n");
      if (b.type === "gensol"){
        var gs = "x = (" + b.data.particular.map(function(x){ return x.toString(); }).join(", ") + ")";
        b.data.basis.forEach(function(v, i){
          gs += " + k" + (i + 1) + "*(" + v.map(function(x){ return x.toString(); }).join(", ") + ")";
        });
        return gs;
      }
      if (b.type === "scalar") return b.data.toString();
      if (b.type === "roots") return b.data.map(function(r, i){
        var t = r.exact ? r.exact.toString() : fmtNum(r.re) + (Math.abs(r.im) > 1e-9 ? (r.im < 0 ? " - " : " + ") + fmtNum(Math.abs(r.im)) + "i" : "");
        return "λ" + (i + 1) + " = " + t;
      }).join("\n");
      return String(b.text).replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "");
    }).join("\n\n");
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ flash("已复制"); }, function(){ flash("复制失败"); });
    } else {
      flash("不支持复制");
    }
  }
  function flash(t){
    var b = el("copy");
    b.textContent = t;
    setTimeout(function(){ b.textContent = "复制"; }, 1200);
  }

  /* ---------- 几何表示：A 把空间变成什么 ---------- */
  var GEO = { yaw: -0.62, pitch: 0.42, zoom: 1, spin: false };
  var GEO_AXES = [
    { v: [1, 0, 0], color: "#ff6b6b", label: "x" },
    { v: [0, 1, 0], color: "#51cf66", label: "y" },
    { v: [0, 0, 1], color: "#4dabf7", label: "z" }
  ];

  function geoCanvas(){
    var cv = el("geo");
    if (!cv) return null;
    var w = cv.clientWidth || 600, h = cv.clientHeight || 330;
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
    }
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h, dpr: dpr };
  }

  function geoReadNumbers(){
    var s = S.A;
    if (s.r !== s.c || (s.r !== 2 && s.r !== 3)) return null;
    var list = ins("A"), n = s.r, M = [], i, j;
    try {
      for (i = 0; i < n; i++){
        var row = [];
        for (j = 0; j < n; j++) row.push(L.val(list[i * n + j].value).toNumber());
        M.push(row);
      }
    } catch (e){ return null; }
    if (n === 2) return [[M[0][0], M[0][1], 0], [M[1][0], M[1][1], 0], [0, 0, 1]];
    return M;
  }

  function geoFracs(){
    var s = S.A, list = ins("A"), M = [], i, j;
    for (i = 0; i < s.r; i++){
      var row = [];
      for (j = 0; j < s.c; j++) row.push(F(list[i * s.c + j].value));
      M.push(row);
    }
    return M;
  }

  function geoProject(p, w, h){
    var cy = Math.cos(GEO.yaw), sy = Math.sin(GEO.yaw);
    var x1 = p[0] * cy - p[1] * sy;
    var y1 = p[0] * sy + p[1] * cy;
    var cp = Math.cos(GEO.pitch), sp = Math.sin(GEO.pitch);
    var depth = y1 * cp - p[2] * sp;
    var up = y1 * sp + p[2] * cp;
    var scale = (Math.min(w, h) / 6.0) * GEO.zoom;
    return { x: w / 2 + x1 * scale, y: h / 2 - up * scale + h * 0.12, d: depth };
  }

  function geoBox(abc){
    var a = abc[0], b = abc[1], c = abc[2];
    function add(u, v){ return [u[0] + v[0], u[1] + v[1], u[2] + v[2]]; }
    var o = [0, 0, 0], ab = add(a, b), ac = add(a, c), bc = add(b, c), abc3 = add(ab, c);
    return {
      faces: [
        [o, a, ab, b], [c, ac, abc3, bc],
        [o, a, ac, c], [b, ab, abc3, bc],
        [o, b, bc, c], [a, ab, abc3, ac]
      ],
      edges: [
        [o, a], [o, b], [o, c],
        [a, ab], [a, ac], [b, ab], [b, bc], [c, ac], [c, bc],
        [ab, abc3], [ac, abc3], [bc, abc3]
      ]
    };
  }

  function geoDraw(){
    var g = geoCanvas();
    if (!g) return;
    var ctx = g.ctx, w = g.w, h = g.h, i;
    var cs = getComputedStyle(document.documentElement);
    var dim = (cs.getPropertyValue("--fg-dim") || "").trim() || "#8892a6";
    var accent = (cs.getPropertyValue("--accent-line") || "").trim() || "#4dabf7";
    ctx.setTransform(g.dpr, 0, 0, g.dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    function P(p){ return geoProject(p, w, h); }
    function seg(p1, p2, color, width, dash){
      var A2 = P(p1), B = P(p2);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width || 1;
      if (dash) ctx.setLineDash(dash);
      ctx.beginPath();
      ctx.moveTo(A2.x, A2.y);
      ctx.lineTo(B.x, B.y);
      ctx.stroke();
      ctx.restore();
    }
    function fillPoly(poly, color, alpha){
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      poly.forEach(function(p, k){
        var q = P(p);
        if (k === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    function arrow(p1, p2, color){
      var A2 = P(p1), B = P(p2);
      var ang = Math.atan2(B.y - A2.y, B.x - A2.x), len = 11;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(A2.x, A2.y);
      ctx.lineTo(B.x, B.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(B.x, B.y);
      ctx.lineTo(B.x - len * Math.cos(ang - 0.42), B.y - len * Math.sin(ang - 0.42));
      ctx.lineTo(B.x - len * Math.cos(ang + 0.42), B.y - len * Math.sin(ang + 0.42));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    function box(abc, opt){
      var bx = geoBox(abc), k;
      if (opt.fill){
        var sorted = bx.faces.map(function(f){
          var d = 0, m;
          for (m = 0; m < f.length; m++) d += P(f[m]).d;
          return { f: f, d: d / f.length };
        }).sort(function(x, y){ return y.d - x.d; });
        sorted.forEach(function(it){ fillPoly(it.f, opt.fillColor, opt.alpha); });
      }
      for (k = 0; k < bx.edges.length; k++) seg(bx.edges[k][0], bx.edges[k][1], opt.edgeColor, opt.edgeWidth, opt.dash);
    }

    for (i = -2; i <= 2; i++){
      seg([i, -2, 0], [i, 2, 0], dim, 1, [2, 5]);
      seg([-2, i, 0], [2, i, 0], dim, 1, [2, 5]);
    }
    for (i = 0; i < GEO_AXES.length; i++){
      var ax = GEO_AXES[i], v = ax.v;
      var tipP = [v[0] * 2.5, v[1] * 2.5, v[2] * 2.5];
      arrow([0, 0, 0], tipP, ax.color);
      var tip = P(tipP);
      ctx.save();
      ctx.fillStyle = ax.color;
      ctx.font = "600 13px system-ui,-apple-system,sans-serif";
      ctx.fillText(ax.label, tip.x + 7, tip.y + 5);
      ctx.restore();
    }
    box([[1, 0, 0], [0, 1, 0], [0, 0, 1]], { edgeColor: dim, edgeWidth: 1, dash: [3, 3] });

    var M = geoReadNumbers();
    if (M){
      var a = [M[0][0], M[1][0], M[2][0]];
      var b = [M[0][1], M[1][1], M[2][1]];
      var c = [M[0][2], M[1][2], M[2][2]];
      box([a, b, c], { edgeColor: accent, edgeWidth: 2, fill: true, fillColor: accent, alpha: 0.15 });
      arrow([0, 0, 0], a, "#ff6b6b");
      arrow([0, 0, 0], b, "#51cf66");
      arrow([0, 0, 0], c, "#4dabf7");
    }
    geoInfo(M);
  }

  function geoInfo(M){
    var info = el("geoinfo");
    if (!info) return;
    if (!M){
      info.innerHTML = "在 A 里填一个 <b>2×2</b> 或 <b>3×3</b> 矩阵，这里会画出它作用在单位立方体上的效果。拖动旋转，滚轮缩放。";
      return;
    }
    var Fm;
    try { Fm = geoFracs(); } catch (e){ return; }
    var d, rk;
    try { d = L.det(Fm); rk = L.rank(Fm); } catch (e){ return; }
    var dn = d.toNumber();
    var da = dn < 0 ? d.neg() : d;
    var detTxt = S.dec ? fmtNum(dn) : fracHTML(d);
    var absTxt = S.dec ? fmtNum(Math.abs(dn)) : fracHTML(da);
    var meaning;
    if (rk === 3) meaning = "空间体积放大到原来的 <b>" + absTxt + "</b> 倍，可逆。";
    else if (rk === 2) meaning = "整个空间被压扁成一个<b>平面</b>（体积 0，不可逆）。";
    else if (rk === 1) meaning = "整个空间被压扁成一条<b>直线</b>（体积 0，不可逆）。";
    else meaning = "整个空间被压到<b>原点</b>。";
    var extra = (S.A.r === 2) ? "　（2×2 按 xy 平面上的变换显示，z 方向不动）" : "";
    info.innerHTML = "<b>det A</b> = " + detTxt + "　<b>|det A|</b> = " + absTxt +
      "　<b>rank A</b> = " + rk + "<br>" + meaning +
      "<br>三个彩色箭头是 A 作用在三条单位轴上的像（就是 A 的三列）；虚线框是原来的单位立方体。" + extra;
  }

  var geoCv = el("geo");
  if (geoCv){
    var geoDrag = false, geoLx = 0, geoLy = 0;
    geoCv.addEventListener("pointerdown", function(e){
      geoDrag = true; geoLx = e.clientX; geoLy = e.clientY;
      geoCv.classList.add("dragging");
      try { geoCv.setPointerCapture(e.pointerId); } catch (err) {}
    });
    geoCv.addEventListener("pointermove", function(e){
      if (!geoDrag) return;
      GEO.yaw += (e.clientX - geoLx) * 0.0085;
      GEO.pitch += (e.clientY - geoLy) * 0.0085;
      if (GEO.pitch > 1.45) GEO.pitch = 1.45;
      if (GEO.pitch < -1.45) GEO.pitch = -1.45;
      geoLx = e.clientX; geoLy = e.clientY;
      geoDraw();
    });
    function geoStop(){ geoDrag = false; geoCv.classList.remove("dragging"); }
    geoCv.addEventListener("pointerup", geoStop);
    geoCv.addEventListener("pointercancel", geoStop);
    geoCv.addEventListener("wheel", function(e){
      e.preventDefault();
      GEO.zoom = Math.max(0.5, Math.min(2.2, GEO.zoom * (e.deltaY > 0 ? 0.94 : 1.06)));
      geoDraw();
    }, { passive: false });
    el("geoReset").addEventListener("click", function(){
      GEO.yaw = -0.62; GEO.pitch = 0.42; GEO.zoom = 1; geoDraw();
    });
    el("geoSpin").addEventListener("click", function(){
      GEO.spin = !GEO.spin;
      el("geoSpin").textContent = GEO.spin ? "停止旋转" : "自动旋转";
      if (GEO.spin) geoSpinLoop();
    });
    function geoSpinLoop(){
      if (!GEO.spin) return;
      GEO.yaw += 0.011;
      geoDraw();
      requestAnimationFrame(geoSpinLoop);
    }
    grid("A").addEventListener("input", geoDraw);
    window.addEventListener("resize", geoDraw);
  }

  function setOp(op){
    S.op = op;
    Array.prototype.forEach.call(document.querySelectorAll(".chip[data-op]"), function(b){
      b.classList.toggle("on", b.getAttribute("data-op") === op);
    });
    el("kbox").hidden = !(op === "kA" || op === "pow");
    el("ophint").textContent = OPS[op].hint || "";
    el("cardB").classList.toggle("idle", !OPS[op].needB);
    el("noteB").textContent = op === "solve" ? "当作 b，需要 1 列" : "";
  }

  function applySkin(s){
    document.documentElement.setAttribute("data-skin", s);
    Array.prototype.forEach.call(document.querySelectorAll("#skins button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-skin-set") === s);
    });
    try { localStorage.setItem("la-skin-v2", s); } catch (e) {}
    var T = THEME[s] || THEME.light;
    var mc = document.querySelector('meta[name="theme-color"]');
    if (mc) mc.setAttribute("content", T.color);
    var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (sb) sb.setAttribute("content", T.bar);
    geoDraw();
  }

  Array.prototype.forEach.call(document.querySelectorAll(".st"), function(b){
    b.addEventListener("click", function(){
      resize(b.getAttribute("data-k"), b.getAttribute("data-axis"), parseInt(b.getAttribute("data-d"), 10));
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-fill]"), function(b){
    b.addEventListener("click", function(){
      var parts = b.getAttribute("data-fill").split(":");
      fill(parts[0], parts[1]);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-op]"), function(b){
    b.addEventListener("click", function(){ setOp(b.getAttribute("data-op")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("#skins button"), function(b){
    b.addEventListener("click", function(){ applySkin(b.getAttribute("data-skin-set")); });
  });
  el("run").addEventListener("click", run);
  el("copy").addEventListener("click", copyOut);
  el("dec").addEventListener("click", function(){
    S.dec = !S.dec;
    el("dec").textContent = S.dec ? "分数" : "小数";
    if (last) show(last);
    geoDraw();
  });
  el("kval").addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); run(); } });

  build("A");
  build("B");
  padBuild();
  setOp("add");
  var SKINS = ["glass", "light", "brutal", "ark", "neon", "mono"];
  var THEME = {
    glass: { color: "#080c18", bar: "black-translucent" },
    light: { color: "#f2f2f7", bar: "default" },
    brutal: { color: "#fdf1dd", bar: "default" },
    ark: { color: "#0b0b0c", bar: "black-translucent" },
    neon: { color: "#07060f", bar: "black-translucent" },
    mono: { color: "#000000", bar: "black-translucent" }
  };
  var saved = "light";
  try {
    var q = new URLSearchParams(location.search).get("skin");
    saved = q || localStorage.getItem("la-skin-v2") || "light";
  } catch (e) {}
  if (SKINS.indexOf(saved) < 0) saved = "light";
  applySkin(saved);
})();
</script>
</body>
</html>
